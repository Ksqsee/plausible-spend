<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gruppenwerk Analytics</title>
<link rel="icon" type="image/svg+xml" href="/logo.svg?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --bg: #f5f5f7; --side: rgba(245,245,247,.78); --card: #ffffff; --raise: #ffffff;
  --card-shadow: 0 0 0 1px rgba(0,0,0,.05), 0 1px 2px rgba(0,0,0,.04);
  --card-hover: 0 0 0 1px rgba(0,0,0,.06), 0 14px 34px -12px rgba(0,0,0,.16);
  --line: rgba(0,0,0,.09); --line-soft: rgba(0,0,0,.055);
  --text: #1d1d1f; --text-2: #48484d; --text-3: #86868b;
  --ink: #1d1d1f; --ink-soft: rgba(29,29,31,.08);
  --sel: rgba(0,0,0,.045); --hover: rgba(0,0,0,.035);
  --seg: rgba(118,118,128,.12); --seg-on: #ffffff; --seg-on-shadow: 0 1px 1px rgba(0,0,0,.06), 0 2px 6px rgba(0,0,0,.08);
  --nav-on: rgba(0,0,0,.06);
  --accent: #0066cc; --brand: #1d1d1f;
  --up: #1f9d55; --down: #e5484d; --live: #30a46c; --warn: #f5a524; --info: #0a84ff;
  --bar: rgba(0,0,0,.05);
  --tip-bg: rgba(29,29,31,.92); --tip-text: #f5f5f7; --tip-muted: #a1a1a6;
  --chip: rgba(0,0,0,.05);
  --sk: rgba(0,0,0,.05); --sk-hi: rgba(0,0,0,.025);
  --glass: rgba(245,245,247,.72);
  --ease: cubic-bezier(.22,1,.36,1);
  --mono: "DM Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --display: "Inter Tight", Inter, ui-sans-serif, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --bg: #000000; --side: rgba(10,10,11,.8); --card: #111113; --raise: #1a1a1d;
    --card-shadow: 0 0 0 1px rgba(255,255,255,.07);
    --card-hover: 0 0 0 1px rgba(255,255,255,.12), 0 18px 40px -14px rgba(0,0,0,.9);
    --line: rgba(255,255,255,.1); --line-soft: rgba(255,255,255,.06);
    --text: #f5f5f7; --text-2: #c7c7cc; --text-3: #8e8e93;
    --ink: #f5f5f7; --ink-soft: rgba(245,245,247,.1);
    --sel: rgba(255,255,255,.07); --hover: rgba(255,255,255,.05);
    --seg: rgba(118,118,128,.24); --seg-on: #3a3a3d; --seg-on-shadow: 0 1px 2px rgba(0,0,0,.4);
    --nav-on: rgba(255,255,255,.08);
    --accent: #2997ff; --brand: #f5f5f7;
    --up: #3dd68c; --down: #ff6369; --live: #3dd68c; --warn: #ffb224; --info: #3b9eff;
    --bar: rgba(255,255,255,.07);
    --tip-bg: rgba(44,44,46,.94); --tip-text: #f5f5f7; --tip-muted: #98989d;
    --chip: rgba(255,255,255,.08);
    --sk: rgba(255,255,255,.06); --sk-hi: rgba(255,255,255,.03);
    --glass: rgba(0,0,0,.66);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #000000; --side: rgba(10,10,11,.8); --card: #111113; --raise: #1a1a1d;
  --card-shadow: 0 0 0 1px rgba(255,255,255,.07);
  --card-hover: 0 0 0 1px rgba(255,255,255,.12), 0 18px 40px -14px rgba(0,0,0,.9);
  --line: rgba(255,255,255,.1); --line-soft: rgba(255,255,255,.06);
  --text: #f5f5f7; --text-2: #c7c7cc; --text-3: #8e8e93;
  --ink: #f5f5f7; --ink-soft: rgba(245,245,247,.1);
  --sel: rgba(255,255,255,.07); --hover: rgba(255,255,255,.05);
  --seg: rgba(118,118,128,.24); --seg-on: #3a3a3d; --seg-on-shadow: 0 1px 2px rgba(0,0,0,.4);
  --nav-on: rgba(255,255,255,.08);
  --accent: #2997ff; --brand: #f5f5f7;
  --up: #3dd68c; --down: #ff6369; --live: #3dd68c; --warn: #ffb224; --info: #3b9eff;
  --bar: rgba(255,255,255,.07);
  --tip-bg: rgba(44,44,46,.94); --tip-text: #f5f5f7; --tip-muted: #98989d;
  --chip: rgba(255,255,255,.08);
  --sk: rgba(255,255,255,.06); --sk-hi: rgba(255,255,255,.03);
  --glass: rgba(0,0,0,.66);
}
:root { --bar-sources: var(--bar); --bar-pages: var(--bar); --bar-locations: var(--bar); --bar-devices: var(--bar); --bar-goals: var(--bar); --bar-search: var(--bar); --bar-sites: var(--bar); }
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--bg); color: var(--text); font: 14px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; font-feature-settings: "cv11", "ss01", "ss03"; letter-spacing: -.006em; }
button, select, input { font: inherit; color: inherit; letter-spacing: inherit; }
a { color: inherit; }
::selection { background: color-mix(in srgb, var(--info) 25%, transparent); }
:focus-visible { outline: 2px solid var(--info); outline-offset: 2px; border-radius: 8px; }
.kick, .stat .k, .kpi .k, .total .k, .sub-h, .trk .grid3 .k, .cols, th, .stitle { font-family: var(--mono); font-weight: 400; text-transform: uppercase; letter-spacing: .06em; }

/* ---------- layout ---------- */
.app { display: grid; grid-template-columns: 256px minmax(0, 1fr); min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; overflow-y: auto; background: var(--side); backdrop-filter: saturate(180%) blur(24px); -webkit-backdrop-filter: saturate(180%) blur(24px); border-right: 1px solid var(--line-soft); padding: 22px 12px 18px; display: flex; flex-direction: column; gap: 2px; scrollbar-width: none; }
.main { min-width: 0; }
.content { max-width: 1180px; margin: 0 auto; padding: 0 36px 96px; }

/* ---------- sidebar ---------- */
.sbrand { display: flex; flex-direction: column; gap: 6px; padding: 2px 10px 22px; text-decoration: none; color: var(--text); }
.sbrand svg { width: 132px; height: auto; display: block; }
.sbrand span { font: 400 10.5px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--text-3); }
.nav { position: relative; display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 9px; text-decoration: none; color: var(--text-2); font-weight: 500; cursor: pointer; transition: background .2s var(--ease), color .2s var(--ease); }
.nav:hover { background: var(--hover); color: var(--text); }
.nav.on { background: var(--nav-on); color: var(--text); font-weight: 600; }
.nav svg.i { width: 17px; height: 17px; flex-shrink: 0; stroke: currentColor; opacity: .85; }
.nav .logo { width: 20px; height: 20px; border-radius: 6px; flex-shrink: 0; }
.nav .lbl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stitle { font-size: 10.5px; color: var(--text-3); padding: 22px 10px 8px; }
.co { display: flex; flex-direction: column; }
.co-head { display: flex; align-items: center; gap: 2px; }
.co-head .nav { flex: 1; }
.tog { flex-shrink: 0; width: 28px; height: 28px; border-radius: 8px; border: 0; background: none; color: var(--text-3); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; transition: background .2s, color .2s; }
.tog:hover { background: var(--hover); color: var(--text); }
.tog svg { width: 13px; height: 13px; transition: transform .35s var(--ease); }
.co.open .tog svg { transform: rotate(90deg); }
.co-sites { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .4s var(--ease); }
.co.open .co-sites { grid-template-rows: 1fr; }
.co-sites > div { overflow: hidden; display: flex; flex-direction: column; gap: 1px; padding-left: 8px; margin-left: 20px; border-left: 1px solid var(--line); }
.co-sites .nav { font-size: 13px; padding: 5px 10px; }
.co-sites .nav img, .co-sites .nav .fallback { width: 15px; height: 15px; border-radius: 4px; }
.sfoot { margin-top: auto; padding: 18px 10px 0; font-size: 12px; color: var(--text-3); display: flex; flex-direction: column; gap: 10px; }
.sfoot button { align-self: flex-start; background: var(--card); border: 0; box-shadow: var(--card-shadow); border-radius: 999px; padding: 6px 14px; cursor: pointer; font-size: 12px; font-weight: 500; transition: transform .2s var(--ease), box-shadow .2s; }
.sfoot button:hover { box-shadow: var(--card-hover); }
.sfoot button:active { transform: scale(.97); }
.scrim { display: none; }

/* ---------- top bar ---------- */
.top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 0 -36px 22px; padding: 22px 36px 16px; background: var(--glass); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); border-bottom: 1px solid transparent; transition: border-color .3s, padding .3s var(--ease); }
.top.stuck { border-bottom-color: var(--line-soft); padding-top: 14px; padding-bottom: 12px; }
.ttl { display: flex; align-items: center; gap: 14px; min-width: 0; }
.ttl .logo { width: 40px; height: 40px; border-radius: 11px; flex-shrink: 0; box-shadow: var(--card-shadow); background: var(--card); padding: 7px; transition: width .3s var(--ease), height .3s var(--ease); }
.ttl .logo.big { padding: 0; box-shadow: none; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .ttl .logo.big { filter: invert(1); } }
:root[data-theme="dark"] .ttl .logo.big { filter: invert(1); }
.top.stuck .ttl .logo { width: 32px; height: 32px; }
.ttl h1 { margin: 0; font: 600 28px/1.15 var(--display); letter-spacing: -.028em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; transition: font-size .3s var(--ease); }
.top.stuck .ttl h1 { font-size: 21px; }
.ttl .sub { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--text-3); margin-top: 3px; flex-wrap: wrap; }
.ttl .sub a { color: inherit; text-decoration: none; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.ttl .sub a:hover { color: var(--text); }
.live { display: inline-flex; align-items: center; gap: 7px; }
.live i { width: 6px; height: 6px; border-radius: 50%; background: var(--live); animation: pulse 2.4s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--live) 55%, transparent) } 70% { box-shadow: 0 0 0 7px transparent } 100% { box-shadow: 0 0 0 0 transparent } }
.burger { display: none; width: 38px; height: 38px; border-radius: 11px; border: 0; background: var(--card); box-shadow: var(--card-shadow); cursor: pointer; align-items: center; justify-content: center; flex-shrink: 0; }
.burger svg { width: 18px; height: 18px; }
.right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.period { position: relative; display: inline-flex; align-items: center; background: var(--card); border-radius: 999px; box-shadow: var(--card-shadow); transition: box-shadow .2s; }
.period:hover { box-shadow: var(--card-hover); }
.period svg { width: 15px; height: 15px; stroke: var(--text-2); position: absolute; left: 13px; pointer-events: none; }
.period select { appearance: none; -webkit-appearance: none; border: 0; background: transparent; padding: 8px 34px 8px 36px; cursor: pointer; font-weight: 500; font-size: 13px; border-radius: 999px; }
.period::after { content: ""; position: absolute; right: 15px; top: 50%; width: 5px; height: 5px; border-right: 1.5px solid var(--text-3); border-bottom: 1.5px solid var(--text-3); transform: translateY(-70%) rotate(45deg); pointer-events: none; }
.custom { display: none; gap: 6px; align-items: center; font-size: 13px; }
.custom.on { display: inline-flex; }
.custom input { border: 0; box-shadow: var(--card-shadow); border-radius: 999px; background: var(--card); padding: 6px 10px; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; margin: -8px 0 16px; }
.filters:empty { display: none; }
.chip { display: inline-flex; align-items: center; gap: 4px; background: var(--card); box-shadow: var(--card-shadow); border-radius: 999px; padding: 4px 4px 4px 12px; font-size: 13px; animation: pop .35s var(--ease); }
.chip .k { color: var(--text-3); }
.chip b { font-weight: 600; max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip button { border: 0; background: transparent; cursor: pointer; color: var(--text-3); width: 22px; height: 22px; border-radius: 50%; font-size: 15px; line-height: 1; }
.chip button:hover { background: var(--hover); color: var(--text); }
@keyframes pop { from { opacity: 0; transform: scale(.9) } to { opacity: 1; transform: none } }

/* ---------- motion ---------- */
.enter > * { animation: rise .6s var(--ease) both; }
.enter > *:nth-child(2) { animation-delay: .06s } .enter > *:nth-child(3) { animation-delay: .12s } .enter > *:nth-child(4) { animation-delay: .18s }
@keyframes rise { from { opacity: 0; transform: translateY(10px); filter: blur(3px) } to { opacity: 1; transform: none; filter: none } }
.grid > .card { animation: rise .6s var(--ease) both; }
.sk { border-radius: 8px; background: linear-gradient(90deg, var(--sk) 0%, var(--sk-hi) 45%, var(--sk) 90%); background-size: 300% 100%; animation: shimmer 1.6s ease-in-out infinite; }
@keyframes shimmer { from { background-position: 100% 0 } to { background-position: -100% 0 } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-delay: 0s !important; transition-duration: .001ms !important; }
}

/* ---------- cards & stats ---------- */
.card { background: var(--card); border-radius: 20px; box-shadow: var(--card-shadow); }
.mainc { padding: 14px 18px 18px; }
.stats { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }
.stat { position: relative; text-align: left; background: transparent; border: 0; border-radius: 14px; padding: 12px 14px 13px; cursor: default; transition: background .25s var(--ease); }
.stat.pick { cursor: pointer; } .stat.pick:hover { background: var(--hover); }
.stat.sel { background: var(--sel); }
.stat .k { font-size: 10.5px; color: var(--text-3); white-space: nowrap; }
.stat.sel .k { color: var(--text); }
.stat .v { display: flex; align-items: baseline; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
.stat .n { font: 600 26px/1.1 var(--display); font-variant-numeric: tabular-nums; letter-spacing: -.03em; }
.d { font-size: 12px; color: var(--text-3); font-variant-numeric: tabular-nums; white-space: nowrap; }
.up { color: var(--up); } .down { color: var(--down); }
.chart { position: relative; height: 300px; margin-top: 18px; }
.chart svg { display: block; width: 100%; height: 100%; overflow: visible; }
.chart .line { transition: stroke-dashoffset 1.4s var(--ease); }
.chart .area { transition: opacity 1s .3s ease; }
.tip { position: absolute; z-index: 5; pointer-events: none; display: none; background: var(--tip-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); color: var(--tip-text); border-radius: 12px; padding: 10px 12px; min-width: 180px; box-shadow: 0 12px 30px rgba(0,0,0,.22); font-size: 13px; }
.tip .t { font: 400 10.5px/1.3 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--tip-muted); }
.tip .r { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 6px; }
.tip .r span { display: inline-flex; align-items: center; gap: 8px; }
.tip .r span::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--tip-text); }
.tip .r b { font: 600 15px var(--display); font-variant-numeric: tabular-nums; }
.tip .h { border-top: 1px solid rgba(255,255,255,.14); margin-top: 8px; padding-top: 6px; color: var(--tip-muted); font-size: 12px; }

/* ---------- panels ---------- */
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 18px; }
.grid > * { min-width: 0; }
.panel { padding: 18px 22px 20px; display: flex; flex-direction: column; min-height: 460px; }
.panel.wide { grid-column: 1 / -1; min-height: 0; }
.ph { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 4px; }
.tabs { display: inline-flex; gap: 2px; overflow-x: auto; scrollbar-width: none; background: var(--seg); border-radius: 10px; padding: 2px; max-width: 100%; }
.tabs:has(.title) { background: none; padding: 0; }
.tabs button { position: relative; background: none; border: 0; padding: 5px 12px; font-size: 12.5px; font-weight: 500; color: var(--text-2); cursor: pointer; white-space: nowrap; border-radius: 8px; transition: background .25s var(--ease), color .2s, box-shadow .25s; }
.tabs button:hover { color: var(--text); }
.tabs button.on { background: var(--seg-on); color: var(--text); box-shadow: var(--seg-on-shadow); cursor: default; }
.tabs .title { font: 600 16px/1.3 var(--display); letter-spacing: -.015em; color: var(--text); padding: 4px 0; white-space: nowrap; }
.expand { background: none; border: 0; padding: 6px; border-radius: 8px; cursor: pointer; color: var(--text-3); transition: color .15s, background .15s; }
.expand:hover { color: var(--text); background: var(--hover); }
.expand svg { width: 15px; height: 15px; display: block; }
.cols { display: flex; justify-content: space-between; gap: 12px; margin: 16px 0 6px; font-size: 10.5px; color: var(--text-3); }
.cols .nums, .row .nums { display: flex; flex-shrink: 0; }
.cols .nums span, .row .nums span { width: 76px; text-align: right; }
.list { display: flex; flex-direction: column; gap: 3px; }
.row { display: flex; align-items: center; gap: 12px; height: 34px; }
.row .track { position: relative; flex: 1; min-width: 0; height: 34px; }
.row .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 8px; width: 0; transition: width .9s var(--ease); }
.row .lbl { position: relative; display: flex; align-items: center; gap: 9px; height: 100%; padding: 0 10px; min-width: 0; }
.row .lbl span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .lbl.click { cursor: pointer; }
.row .lbl.click:hover span { text-decoration: underline; text-decoration-color: var(--text-3); text-underline-offset: 3px; }
.row .lbl img, .row .lbl .ico, .row .lbl .fallback { width: 16px; height: 16px; flex-shrink: 0; border-radius: 4px; }
.row .lbl .flag { font-size: 15px; line-height: 1; flex-shrink: 0; }
.row .nums span { font-weight: 500; font-variant-numeric: tabular-nums; }
.row .nums span.m { color: var(--text-3); font-weight: 400; }
.empty { flex: 1; display: flex; align-items: center; justify-content: center; text-align: center; color: var(--text-3); padding: 44px 12px; font-size: 13px; }
.skl { display: flex; flex-direction: column; gap: 8px; margin-top: 18px; }
.skl .sk { height: 30px; }
.fallback { width: 18px; height: 18px; border-radius: 5px; display: inline-flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; color: var(--card); background: var(--ink); flex-shrink: 0; }

.kpis { display: grid; grid-template-columns: repeat(4, 1fr); margin-top: 16px; gap: 12px; }
.kpi { padding: 14px 16px; border-radius: 14px; background: var(--sel); }
.kpi .k { font-size: 10.5px; color: var(--text-3); }
.kpi .n { font: 600 22px/1.2 var(--display); letter-spacing: -.025em; margin-top: 6px; font-variant-numeric: tabular-nums; }
.kpi .s { font-size: 12px; color: var(--text-3); margin-top: 3px; }
.tbl { overflow-x: auto; margin-top: 18px; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th { font-size: 10.5px; color: var(--text-3); text-align: right; padding: 0 0 10px 16px; white-space: nowrap; }
th:first-child, td:first-child { text-align: left; padding-left: 0; }
td { text-align: right; padding: 9px 0 9px 16px; border-top: 1px solid var(--line-soft); white-space: nowrap; font-weight: 500; }
td:first-child { font-weight: 400; max-width: 380px; overflow: hidden; text-overflow: ellipsis; }
tbody tr { transition: background .15s; } tbody tr:hover { background: var(--hover); }
td.m { color: var(--text-3); font-weight: 400; }
.note { margin-top: 14px; font-size: 12px; color: var(--text-3); line-height: 1.55; }

/* ---------- overview ---------- */
.totals { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 8px; }
.total { padding: 18px 20px; }
.total .k { font-size: 10.5px; color: var(--text-3); }
.total .n { font: 600 34px/1.1 var(--display); letter-spacing: -.035em; margin-top: 10px; font-variant-numeric: tabular-nums; }
.total .d { margin-top: 6px; white-space: normal; }
.cohead { display: flex; align-items: center; gap: 12px; margin: 40px 0 14px; flex-wrap: wrap; }
.cohead img, .cohead .fallback { width: 28px; height: 28px; border-radius: 8px; box-shadow: var(--card-shadow); }
.cohead h2 { margin: 0; font: 600 20px/1.2 var(--display); letter-spacing: -.02em; }
.cohead .meta { color: var(--text-3); font-size: 13px; }
.cohead a { margin-left: auto; font-size: 13px; font-weight: 500; color: var(--text); text-decoration: none; display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 999px; background: var(--card); box-shadow: var(--card-shadow); transition: box-shadow .2s; }
.cohead a:hover { box-shadow: var(--card-hover); }
.cohead a span { transition: transform .3s var(--ease); display: inline-block; } .cohead a:hover span { transform: translateX(3px); }
.sites { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.sites > * { min-width: 0; }
.sitecard { display: flex; flex-direction: column; gap: 14px; padding: 18px 20px; text-decoration: none; transition: box-shadow .35s var(--ease), transform .35s var(--ease); }
.sitecard:hover { box-shadow: var(--card-hover); transform: translateY(-3px); }
.sitecard .top2 { display: flex; align-items: center; gap: 10px; min-width: 0; }
.sitecard .top2 img, .sitecard .top2 .fallback { width: 22px; height: 22px; border-radius: 6px; }
.sitecard .top2 .nm { min-width: 0; }
.sitecard .top2 b { display: block; font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sitecard .top2 small { display: block; font-size: 12px; color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sitecard .badge { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-3); white-space: nowrap; }
.sitecard .badge i { width: 6px; height: 6px; border-radius: 50%; background: var(--live); }
.sitecard .spark { height: 56px; }
.sitecard .spark svg { width: 100%; height: 100%; display: block; overflow: visible; }
.sitecard .spark .line { transition: stroke-dashoffset 1.2s var(--ease); }
.sitecard .big { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.sitecard .big b { font: 600 24px/1.1 var(--display); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.sitecard .big span { font-size: 13px; color: var(--text-3); }
.sitecard .meta { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--text-3); border-top: 1px solid var(--line-soft); padding-top: 12px; }
.sitecard .meta b { color: var(--text); font-weight: 600; }

/* ---------- opportunities ---------- */
.badge-n { margin-left: auto; min-width: 19px; height: 19px; padding: 0 6px; border-radius: 10px; background: var(--down); color: #fff; font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }
.badge-n:empty { display: none; }
.ins-list { display: flex; flex-direction: column; margin-top: 6px; }
.ins { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 4px 16px; padding: 16px 0; border-top: 1px solid var(--line-soft); align-items: start; }
.ins:first-child { border-top: 0; }
.ins .dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 5px; background: var(--info); box-shadow: 0 0 0 4px color-mix(in srgb, var(--info) 18%, transparent); }
.ins.high .dot { background: var(--down); box-shadow: 0 0 0 4px color-mix(in srgb, var(--down) 18%, transparent); }
.ins.medium .dot { background: var(--warn); box-shadow: 0 0 0 4px color-mix(in srgb, var(--warn) 20%, transparent); }
.ins h3 { margin: 2px 0 0; font: 600 15px/1.4 var(--display); letter-spacing: -.01em; }
.ins .meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 3px; font-size: 12px; color: var(--text-3); }
.ins .meta img, .ins .meta .fallback { width: 14px; height: 14px; border-radius: 3px; }
.ins .tag { font: 400 10px/1.6 var(--mono); letter-spacing: .06em; text-transform: uppercase; padding: 1px 8px; border-radius: 999px; background: var(--sel); color: var(--text-2); }
.ins p { margin: 3px 0 0; color: var(--text-2); font-size: 13px; overflow-wrap: anywhere; }
.ins .act { margin-top: 7px; font-size: 13px; color: var(--text); display: flex; gap: 6px; overflow-wrap: anywhere; }
.ins .act { font-weight: 500; }
.ins .act::before { content: "→"; color: var(--text-3); font-weight: 500; }
.ins .val { text-align: right; font: 600 15px var(--display); letter-spacing: -.01em; white-space: nowrap; font-variant-numeric: tabular-nums; }
.ins .val small { display: block; font-weight: 400; color: var(--text-3); font-size: 11px; }
.ins details { margin-top: 6px; font-size: 12px; color: var(--text-2); }
.ins details summary { cursor: pointer; color: var(--text-3); }
.ins details ul { margin: 6px 0 0; padding-left: 18px; columns: 2; column-gap: 24px; }
.more { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; margin-top: 12px; font-size: 13px; font-weight: 500; color: var(--text); text-decoration: none; padding: 7px 14px; border-radius: 999px; background: var(--sel); transition: background .2s; }
.more:hover { background: var(--line); }
.seg { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 14px; }
.seg button { border: 0; box-shadow: var(--card-shadow); background: var(--card); border-radius: 999px; padding: 6px 14px; font-size: 13px; font-weight: 500; cursor: pointer; color: var(--text-2); transition: all .15s; display: inline-flex; gap: 6px; align-items: center; }
.seg button:hover { box-shadow: var(--card-hover); color: var(--text); }
.seg button.on { background: var(--ink); box-shadow: none; color: var(--bg); }
.seg button img, .seg button .fallback { width: 14px; height: 14px; border-radius: 3px; }
.seg button span.c { font-size: 11px; opacity: .7; }

/* ---------- funnel ---------- */
.funnel { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
.fstep { display: grid; grid-template-columns: minmax(120px, 220px) minmax(0, 1fr) 150px; gap: 14px; align-items: center; }
.fstep .lbl { font-size: 13px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fstep .lbl small { display: block; font-weight: 400; color: var(--text-3); font-size: 11px; }
.fstep .bar { position: relative; height: 32px; border-radius: 9px; background: var(--bar); overflow: hidden; }
.fstep .bar i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; min-width: 4px; border-radius: 9px; background: var(--ink); transition: width 1s var(--ease); }
.fstep:nth-child(2) .bar i { opacity: .82 } .fstep:nth-child(3) .bar i { opacity: .66 } .fstep:nth-child(4) .bar i { opacity: .52 } .fstep:nth-child(5) .bar i { opacity: .42 } .fstep:nth-child(n+6) .bar i { opacity: .34 }
.fstep .num { font-variant-numeric: tabular-nums; font-size: 13px; text-align: right; white-space: nowrap; }
.fstep .num b { font: 600 16px var(--display); letter-spacing: -.02em; }
.fstep .num .drop { display: block; font-size: 11px; color: var(--down); }

/* ---------- lead feed ---------- */
.feed { display: flex; flex-direction: column; margin-top: 10px; }
.lead { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line-soft); align-items: start; }
.lead:first-child { border-top: 0; }
.lead .ic { width: 34px; height: 34px; border-radius: 11px; display: flex; align-items: center; justify-content: center; background: var(--sel); }
.lead .ic svg { width: 17px; height: 17px; }
.lead .ic.form { background: color-mix(in srgb, var(--brand) 16%, transparent); color: var(--brand); }
.lead .ic.call { background: color-mix(in srgb, var(--up) 16%, transparent); color: var(--up); }
.lead .ic.mail { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); }
.lead .ic.wa { background: color-mix(in srgb, #25d366 18%, transparent); color: #1da851; }
.lead b { font-weight: 600; }
.lead .sub2 { font-size: 12px; color: var(--text-3); margin-top: 2px; display: flex; flex-wrap: wrap; gap: 4px 10px; }
.lead .sub2 svg { width: 13px; height: 13px; vertical-align: -2px; margin-right: 4px; }
.lead .sub2 img, .lead .sub2 .fallback { width: 13px; height: 13px; border-radius: 3px; vertical-align: -2px; margin-right: 4px; }
.lead .ch { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
.lead .ch span { font-size: 12px; background: var(--chip); border-radius: 999px; padding: 2px 9px; }
.lead .ch span em { font-style: normal; color: var(--text-3); }
.lead time { font-size: 12px; color: var(--text-3); white-space: nowrap; }
.kw { font: 500 11.5px var(--mono); background: var(--chip); color: var(--text); border-radius: 999px; padding: 1px 8px; }

/* ---------- tables, flags, small charts ---------- */
.flag2 { display: inline-block; font-size: 11px; font-weight: 500; padding: 1px 8px; border-radius: 999px; margin-left: 6px; vertical-align: 1px; }
.flag2.bad { background: color-mix(in srgb, var(--down) 15%, transparent); color: var(--down); }
.flag2.good { background: color-mix(in srgb, var(--up) 16%, transparent); color: var(--up); }
.flag2.warn { background: color-mix(in srgb, var(--warn) 20%, transparent); color: color-mix(in srgb, var(--warn) 70%, var(--text)); }
.flag2.info { background: color-mix(in srgb, var(--info) 16%, transparent); color: var(--info); }
.qs { display: inline-flex; width: 22px; height: 22px; border-radius: 7px; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #fff; }
td.wrap { white-space: normal; min-width: 180px; }
.hours { display: grid; grid-template-columns: repeat(24, minmax(0, 1fr)); gap: 3px; align-items: end; height: 140px; margin-top: 18px; }
.hours div { position: relative; background: var(--ink-soft); border-radius: 5px 5px 2px 2px; height: 0; transition: height .7s cubic-bezier(.2,.8,.2,1); }
.hours div.cv { background: var(--ink); }
.hours div.off { opacity: .45; }
.hlab { display: grid; grid-template-columns: repeat(24, minmax(0, 1fr)); gap: 3px; font: 10px var(--mono); color: var(--text-3); text-align: center; margin-top: 4px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--text-3); margin-top: 10px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.share { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--line-soft); min-width: 140px; }
.share i { display: block; height: 100%; }
.sub-h { font-size: 10.5px; color: var(--text-3); margin: 24px 0 6px; }
.split { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
.split > * { min-width: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chips span { font-size: 12px; background: var(--sel); border-radius: 999px; padding: 4px 10px; }
.chips span b { font-weight: 600; margin-left: 4px; }
.stars { color: #f59e0b; letter-spacing: 1px; }

/* ---------- tracking setup ---------- */
.trk { padding: 20px 22px; display: flex; flex-direction: column; gap: 10px; }
.trk .h { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.trk .h img, .trk .h .fallback { width: 22px; height: 22px; border-radius: 5px; }
.trk .h b { font: 600 16px var(--display); letter-spacing: -.015em; }
.trk .h small { color: var(--text-3); }
.status { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; }
.status i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.status.ok { color: var(--up); background: color-mix(in srgb, var(--up) 12%, transparent); }
.status.off { color: var(--text-3); background: var(--sel); }
.status.wait { color: color-mix(in srgb, var(--warn) 75%, var(--text)); background: color-mix(in srgb, var(--warn) 16%, transparent); }
.code { position: relative; font: 12px/1.6 var(--mono); background: var(--sel); border-radius: 12px; padding: 10px 84px 10px 12px; overflow-x: auto; white-space: pre; color: var(--text); }
.code button { position: absolute; right: 7px; top: 6px; border: 0; box-shadow: var(--card-shadow); background: var(--card); border-radius: 999px; padding: 3px 11px; font: 500 12px Inter, sans-serif; cursor: pointer; }
.trk .grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; font-size: 13px; }
.trk .grid3 > div { min-width: 0; }
.trk .grid3 .k { font-size: 10.5px; color: var(--text-3); margin-bottom: 6px; }
.trk ol { margin: 0; padding-left: 18px; color: var(--text-2); overflow-wrap: anywhere; }
.brandlogo { height: 22px; max-width: 120px; object-fit: contain; margin-left: 4px; padding: 3px 6px; border-radius: 6px; background: #fff; box-shadow: 0 0 0 1px var(--line); }
@media (max-width: 960px) {
  .split, .trk .grid3 { grid-template-columns: 1fr; }
  .fstep { grid-template-columns: minmax(0, 1fr) auto; }
  .fstep .num .drop { white-space: normal; }
  .ttl { flex: 1; }
  .ttl > div { flex: 1; min-width: 0; }
  .fstep .bar { grid-column: 1 / -1; grid-row: 2; }
}
@media (max-width: 560px) {
  .ins { grid-template-columns: 10px minmax(0, 1fr); }
  .ins .val { grid-column: 2; text-align: left; }
  .ins details ul { columns: 1; }
  .lead { grid-template-columns: 30px minmax(0, 1fr); }
  .lead time { grid-column: 2; }
  .hlab span:nth-child(odd) { visibility: hidden; }
}

/* ---------- responsive ---------- */
@media (max-width: 1100px) { .sites { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 960px) {
  .app { grid-template-columns: 1fr; }
  .side { position: fixed; z-index: 40; left: 0; top: 0; width: 284px; background: var(--card); transform: translateX(-104%); transition: transform .45s var(--ease); box-shadow: 0 0 60px rgba(0,0,0,.25); }
  .app.menu .side { transform: none; }
  .scrim { display: block; position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.3); backdrop-filter: blur(2px); opacity: 0; pointer-events: none; transition: opacity .35s; }
  .app.menu .scrim { opacity: 1; pointer-events: auto; }
  .burger { display: inline-flex; }
  .content { padding: 0 16px 72px; }
  .top { margin: 0 -16px 16px; padding: 14px 16px 12px; }
  .stats { grid-template-columns: repeat(3, 1fr); }
  .grid { grid-template-columns: 1fr; }
  .panel { min-height: 0; }
  .kpis, .totals { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 560px) {
  .stats { grid-template-columns: repeat(2, 1fr); }
  .stat .n { font-size: 22px; }
  .chart { height: 220px; }
  .cols .nums span.m, .row .nums span.m { display: none; }
  .cols .nums span, .row .nums span { width: 56px; }
  .panel { padding: 16px 16px 18px; }
  .card { border-radius: 18px; }
  .sites { grid-template-columns: minmax(0, 1fr); }
  .ttl h1, .top.stuck .ttl h1 { font-size: 20px; }
  .total .n { font-size: 26px; }
  .right { width: 100%; }
}
</style>

  var ICON_COLLAPSE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>'

  }
  // only used with the constant icon strings above
  function html(str) { var t = document.createElement('template'); t.innerHTML = str; return t.content.firstChild }
  function cssVar(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim() }
  function iso(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0') }
  function berlinToday() {
    var a = new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/Berlin', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date()).split('-').map(Number)
    return new Date(a[0], a[1] - 1, a[2])
  }
  function addDays(d, n) { var x = new Date(d); x.setDate(x.getDate() + n); return x }
  function range() {
    var t = berlinToday()

      case 'today': return [iso(t), iso(t)]
      case 'yesterday': return [iso(addDays(t, -1)), iso(addDays(t, -1))]
      case '7d': return [iso(addDays(t, -6)), iso(t)]
      case '30d': return [iso(addDays(t, -29)), iso(t)]
      case 'month': return [iso(new Date(t.getFullYear(), t.getMonth(), 1)), iso(t)]

  }
  function scopeParams() { return state.site ? { site: state.site } : { scope: state.scope || 'all' } }
  function qs(extra) {

  }
  function api(path, extra) {

      if (!r.ok) throw new Error('HTTP ' + r.status)

  }
  function favicon(domain, cls) {
    var img = el('img', cls)
    img.alt = ''

  }
  // Real favicons from the Onepage CDN, falling back to the search-engine favicon service.
  function logoImg(url, fallbackDomain, cls) {
    if (!url) return favicon(fallbackDomain, cls)

  function companyLogo(c, cls) { return logoImg(c.favicon_url, c.logo_domain, cls) }

  function flag(code) {
    if (!code || code.length !== 2) return null

  }
  function iconFor(dim, value) {
    if (value === null || value === undefined) return null
    if (dim === 'site') return siteLogo(value)
    if (dim === 'source') {
      if (value === 'Direct / None') return html(ICON_LINK)
      var d = Object.prototype.hasOwnProperty.call(SOURCE_DOMAINS, value) ? SOURCE_DOMAINS[value] : (value.indexOf('.') > 0 ? value : null)
      return d ? favicon(d) : html(ICON_LINK)
    }
    if (dim === 'utm_source' && value.indexOf('.') > 0) return favicon(value)
    if (dim === 'browser' && BROWSER_DOMAINS[value]) return favicon(BROWSER_DOMAINS[value])
    if (dim === 'os' && OS_DOMAINS[value]) return favicon(OS_DOMAINS[value])
    if (dim === 'country') return flag(value)
    return null
  }
  function fmtDuration(s) { s = Math.round(s || 0); if (s < 60) return s + 's'; return Math.floor(s / 60) + 'm ' + (s % 60) + 's' }
  function fmtStat(key, v) {

  // ---------- motion ----------
  function countUp(node, to, fmt) {
    if (REDUCED || !to) { node.textContent = fmt(to || 0); return }
    var start = performance.now(), dur = 700

      node.textContent = fmt(to * (1 - Math.pow(1 - t, 3)))

    }

  }

  }

    return box
  }

  // ---------- routing ----------
  function readUrl() {
    var p = new URLSearchParams(location.search)
    state.site = p.get('site') && SITE_BY_DOMAIN[p.get('site')] ? p.get('site') : null
    var scope = p.get('scope')
    state.scope = !state.site && scope && (scope === 'all' || COMPANIES.some(function (c) { return 'company:' + c.id === scope })) ? scope : null

    if (state.view === 'insights' && !state.site && !state.scope) state.scope = 'all'
    state.period = p.get('period') || '30d'
    state.from = p.get('from')
    state.to = p.get('to')
    try { state.filters = JSON.parse(p.get('filters') || '[]') } catch (e) { state.filters = [] }
  }
  function urlFor(target) {

    else if (target.scope) p.set('scope', target.scope)

    if (period !== '30d') p.set('period', period)
    if (period === 'custom') { p.set('from', state.from || ''); p.set('to', state.to || '') }
    if (target.filters && target.filters.length) p.set('filters', JSON.stringify(target.filters))

  }

  document.addEventListener('click', function (e) {

  // ---------- sidebar ----------

  function buildSidebar() {

  function markSidebar() {

  // ---------- header ----------
  function brandLogo() { var img = el('img', 'logo big'); img.src = '/logo.svg?v=2'; img.alt = ''; return img }

    var logo = $('ttlLogo'), sub = $('sub')

  }

  // ---------- filters ----------
  function addFilter(dim, value) {
    if (dim === 'site') { navigate(urlFor({ site: value })); return }
    state.filters = state.filters.filter(function (f) { return f[0] !== dim })

  }

    state.filters.forEach(function (f, i) {

  // ---------- render ----------
  function render() {

    view.replaceChildren()

    view.classList.add('enter')

    else if (state.view === 'tracking') renderTracking(view)

  }

  // Monotone cubic curve through the points, so lines never overshoot below zero.
  function smoothPath(pts) {
    var n = pts.length
    if (n < 3) return pts.map(function (p, i) { return (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1) }).join(' ')

    for (var i = 0; i < n - 1; i++) { dx[i] = pts[i + 1][0] - pts[i][0]; dy[i] = pts[i + 1][1] - pts[i][1]; m[i] = dy[i] / dx[i] }
    t[0] = m[0]; t[n - 1] = m[n - 2]
    for (i = 1; i < n - 1; i++) t[i] = m[i - 1] * m[i] <= 0 ? 0 : (3 * (dx[i - 1] + dx[i])) / ((2 * dx[i] + dx[i - 1]) / m[i - 1] + (dx[i] + 2 * dx[i - 1]) / m[i])
    var d = 'M' + pts[0][0].toFixed(1) + ' ' + pts[0][1].toFixed(1)
    for (i = 0; i < n - 1; i++) {
      var h = dx[i] / 3
      d += ' C' + (pts[i][0] + h).toFixed(1) + ' ' + (pts[i][1] + h * t[i]).toFixed(1) + ' ' + (pts[i + 1][0] - h).toFixed(1) + ' ' + (pts[i + 1][1] - h * t[i + 1]).toFixed(1) + ' ' + pts[i + 1][0].toFixed(1) + ' ' + pts[i + 1][1].toFixed(1)
    }
    return d
  }

    for (var i = 0; i < steps.length; i++) if (steps[i] * pow >= v) return steps[i] * pow
    return 10 * pow
  }

  function loadChart() {
    var r = range(), token = renderToken

        }
      } else {
        var d = new Date(r[0] + 'T00:00:00'), end = new Date(r[1] + 'T00:00:00')
        var monthly = (end - d) / 86400000 > 120
        var buckets = {}, order = []
        for (; d <= end; d = addDays(d, 1)) {

          var row2 = map[iso(d)]

        series = order.map(function (k) {
          var b = buckets[k]

        d.pages.slice(0, 10).forEach(function (r) { list.append(barRow(r.page, null, r.depth, 'var(--bar-pages)', [[fmtDuration(r.time), true], [r.depth + ' %']], function () { addFilter('page', r.page) })) })
      } else {
        if (!d.faq.length) { section.append(el('div', 'empty', 'Noch keine FAQ-Klicks')); return }
        nums.append(el('span', 'm', 'Klicks'), el('span', null, 'Besucher'))
        cols.append(el('span', null, 'Frage'), nums)
        var max = d.faq[0].visitors
        d.faq.forEach(function (r) { list.append(barRow(r.name, null, (r.visitors / max) * 100, 'var(--bar-locations)', [[nf.format(r.events), true], [nf.format(r.visitors)]], null)) })
      }
      section.append(cols, list)
      growBars(list)
    }).catch(function () { sk.replaceWith(el('div', 'empty', 'Fehler beim Laden')) })
  }

  // ---------- Google Business Profile ----------
  function renderGbp() {
    var section = $('gbp'), token = renderToken
    if (!section) return
    section.replaceChildren()
    header(section, [['g', 'Google-Unternehmensprofil']], 'g', null, null)
    var sk = skeletonRows(3); section.append(sk)
    api('gbp').then(function (d) {
      if (token !== renderToken) return
      sk.remove()
      if (!d.locations.length) { section.append(el('div', 'empty', 'Kein Unternehmensprofil mit dieser Website verknüpft')); return }
      var t = d.totals, kpis = el('div', 'kpis')
      var reviews = d.locations.reduce(function (a, l) { return a + (l.reviews || 0) }, 0)
      kpis.append(
        kpi('Einblendungen', nf.format(t.maps + t.search), nf.format(t.maps) + ' Maps · ' + nf.format(t.search) + ' Suche'),
        kpi('Anrufe', nf.format(t.calls), 'direkt aus dem Profil'),
        kpi('Routen & Website', nf.format(t.directions) + ' · ' + nf.format(t.website), 'Routenplanungen · Website-Klicks'),
        kpi('Bewertungen', nf.format(reviews), d.locations.length === 1 && d.locations[0].rating ? '★ ' + pct.format(d.locations[0].rating) : d.locations.length + ' Profile')
      )
      section.append(kpis)
      section.append(richTable(['Profil', 'Maps', 'Suche', 'Anrufe', 'Website', 'Routen', 'Bewertungen'], d.locations.map(function (l) {
        var flags = (l.reviews || 0) < 10 ? [flagEl('wenige Bewertungen', 'warn')] : []
        return [labelCell(l.name, l.site, flags), nf.format(l.maps), nf.format(l.search), nf.format(l.calls), nf.format(l.website), nf.format(l.directions),
          l.reviews === null ? { text: '–', muted: true } : nf.format(l.reviews) + (l.rating ? ' · ★ ' + pct.format(l.rating) : '')]
      })))
      if (d.keywords.length) {
        section.append(el('div', 'sub-h', 'So wird das Profil gefunden (letzter Monat)'))
        var chips = el('div', 'chips')
        d.keywords.slice(0, 30).forEach(function (k) {
          var c = el('span', null, k.keyword)
          c.append(el('b', null, k.value !== null ? nf.format(k.value) : '< ' + (k.threshold || 15)))
          if (!state.site && d.locations.length > 1) c.title = k.location_name
          chips.append(c)
        })
        section.append(chips)
      }
      section.append(el('div', 'note', 'Anrufe aus dem Profil sind Leads, die keine Website-Statistik sieht. Bewertungen und Beiträge lassen sich über Windsor beantworten bzw. veröffentlichen.'))
    }).catch(function () { sk.replaceWith(el('div', 'empty', 'Fehler beim Laden')) })
  }

  // ---------- tracking setup ----------
  var TRACKER_ORIGIN = location.origin
  function renderTracking(view) {
    var token = renderToken
    var intro = el('section', 'card trk')
    intro.append(el('b', null, 'Ein Snippet je Website, der Rest wird erkannt'))
    intro.append(el('div', 'note', 'Der Tracker erkennt Anruf-, Mail- und WhatsApp-Klicks, Bewertungs- und Karten-Links, FAQ, gelesene Abschnitte, Scrolltiefe, mehrstufige Formulare (Start, jeder Schritt, angenommene Anfrage inkl. Auswahl ohne Kontaktdaten) und Bewerbungen. Die Funnel-Schritte je Website liegen serverseitig, das Snippet muss dafür nie geändert werden. Eigene Ziele: Attribut data-track="Name" an ein Element setzen.'))
    var tpl = el('div', 'code', '{lpurl}?utm_source=google&utm_medium=cpc&utm_campaign={campaignid}&utm_term={keyword}&utm_content={creative}')
    var cp0 = el('button', null, 'Kopieren'); cp0.type = 'button'; cp0.onclick = function () { copy(tpl.firstChild.textContent, cp0) }
    tpl.append(cp0)
    intro.append(el('div', 'sub-h', 'Tracking-Vorlage für alle Google-Ads-Konten (Kontoebene)'), tpl)
    view.append(intro)
    var list = el('div'); list.style.cssText = 'display:flex;flex-direction:column;gap:16px;margin-top:16px'
    view.append(list)
    fetch('/api/tracking').then(function (r) { return r.json() }).then(function (rows) {
      if (token !== renderToken) return
      var by = {}
      rows.forEach(function (r) { by[r.site] = r })
      COMPANIES.forEach(function (c) {
        c.sites.forEach(function (s) {
          var info = by[s.domain] || {}
          var card = el('section', 'card trk'), h = el('div', 'h')
          var nm = el('div'); nm.append(el('b', null, s.name), el('br'), el('small', null, s.domain))
          h.append(siteLogo(s.domain), nm)
          var fresh = info.last_ts && Date.now() - info.last_ts < 3 * 86400000
          var st = el('span', 'status ' + (fresh ? 'ok' : info.last_ts ? 'wait' : 'off'))
          st.append(el('i'), document.createTextNode(fresh ? 'Aktiv · ' + timeAgo(info.last_ts) : info.last_ts ? 'Zuletzt ' + timeAgo(info.last_ts) : 'Noch keine Besuche'))
          h.append(st)
          card.append(h)
          var snippet = '<script defer data-domain="' + s.domain + '" src="' + TRACKER_ORIGIN + '/s.js"></' + 'script>'
          var code = el('div', 'code', snippet), cp = el('button', null, 'Kopieren')
          cp.type = 'button'; cp.onclick = function () { copy(snippet, cp) }
          code.append(cp)
          card.append(code)
          var g = el('div', 'grid3')
          var a = el('div'); a.append(el('div', 'k', 'Funnel'))
          var ol = el('ol')
          ;((s.config && s.config.funnel) || []).forEach(function (f) { ol.append(el('li', null, f.label)) })
          a.append(ol)
          var b = el('div'); b.append(el('div', 'k', 'Gemessen (7 Tage)'))
          var ch = el('div', 'chips'); ch.style.marginTop = '0'
          ;(info.names || []).forEach(function (n) { ch.append(el('span', null, EVENT_NAMES[n] || (n === 'pageview' ? 'Seitenaufruf' : n === 'Engagement' ? 'Lesetiefe' : n === 'Form step' ? 'Formularschritt' : n))) })
          if (!(info.names || []).length) ch.append(el('span', null, 'noch nichts'))
          b.append(ch)
          var c3 = el('div'); c3.append(el('div', 'k', 'Verknüpft'))
          var ul = el('ol'); ul.style.listStyle = 'none'; ul.style.paddingLeft = '0'
          ul.append(el('li', null, s.ads_account ? 'Google Ads ' + s.ads_account : 'Google Ads: –'))
          ul.append(el('li', null, s.gsc_property ? 'Search Console ✓' : 'Search Console: –'))
          ul.append(el('li', null, 'Profil-Link mit ?utm_source=gbp'))
          c3.append(ul)
          g.append(a, b, c3)
          card.append(g)
          list.append(card)
        })
      })
    })
  }
  function copy(text, btn) {
    var done = function () { btn.textContent = 'Kopiert'; setTimeout(function () { btn.textContent = 'Kopieren' }, 1500) }
    if (navigator.clipboard) navigator.clipboard.writeText(text).then(done, function () {})
  }
  function renderSearch() {
    var section = $('search'), token = renderToken
    if (!section) return
    section.replaceChildren()
    header(section, [['search', 'Google-Suchbegriffe']], 'search', null, function () { renderSearch() })
    var sk = skeletonRows(5); section.append(sk)
    api('search').then(function (d) {
      if (token !== renderToken) return
      sk.remove()
      if (!d.results.length) { section.append(el('div', 'empty', 'Keine Suchdaten in diesem Zeitraum (Google liefert sie mit 2–3 Tagen Verzögerung)')); return }
      var t = d.totals, kpis = el('div', 'kpis')
      kpis.append(
        kpi('Klicks aus Google', nf.format(t.clicks)),
        kpi('Impressionen', nf.format(t.impressions)),
        kpi('Klickrate', t.impressions ? pct.format((t.clicks / t.impressions) * 100) + '%' : '–'),
        kpi('Ø Position', t.position === null ? '–' : pct.format(t.position), t.latest ? 'Daten bis ' + new Date(t.latest + 'T00:00:00').toLocaleDateString('de-DE') : '')
      )
      section.append(kpis)
      var cols = el('div', 'cols'), nums = el('span', 'nums')
      nums.append(el('span', 'm', 'Klicks'), el('span', null, 'Impr.'), el('span', null, 'Position'))
      cols.append(el('span', null, 'Suchbegriff'), nums)
      section.append(cols)
      var rows = d.results.slice(0, section.dataset.expanded ? 100 : 10)
      var max = Math.max.apply(null, rows.map(function (r) { return r.impressions }))
      var list = el('div', 'list')
      rows.forEach(function (r) {
        list.append(barRow(r.name, null, (r.impressions / max) * 100, 'var(--bar-search)',
          [[nf.format(r.clicks), true], [nf.format(r.impressions)], [r.position === null ? '–' : pct.format(r.position)]], null))
      })
      section.append(list)
      growBars(list)
    }).catch(function () { sk.replaceWith(el('div', 'empty', 'Fehler beim Laden')) })
  }
  function loadLive() {
    if (state.view !== 'dash') return
    fetch('/api/realtime?' + new URLSearchParams(scopeParams())).then(function (r) { return r.json() }).then(function (d) {
      var live = $('live')
      if (live) live.lastChild.textContent = nf.format(d.visitors) + (d.visitors === 1 ? ' aktueller Besucher' : ' aktuelle Besucher')
    }).catch(function () {})
  }

  // ---------- overview ----------
  var PERIOD_TEXT = { today: 'heute', yesterday: 'gestern', '7d': 'letzte 7 Tage', '30d': 'letzte 30 Tage', month: 'diesen Monat', lastmonth: 'letzten Monat', '12mo': 'letzte 12 Monate', custom: 'im Zeitraum' }
  function sparkline(daily, from, to) {
    var values = []
    for (var d = new Date(from + 'T00:00:00'), end = new Date(to + 'T00:00:00'); d <= end; d = addDays(d, 1)) values.push(daily[iso(d)] || 0)
    if (values.length < 2) values = [values[0] || 0, values[0] || 0]
    var W = 300, H = 52, max = Math.max.apply(null, values.concat([1]))
    var line = smoothPath(values.map(function (v, i) { return [(W * i) / (values.length - 1), H - 4 - ((H - 8) * v) / max] }))
    var accent = cssVar('--ink')
    var root = svg('svg', { viewBox: '0 0 ' + W + ' ' + H, preserveAspectRatio: 'none', 'aria-hidden': 'true' })
    var id = 'sp' + Math.random().toString(36).slice(2)
    var defs = svg('defs'), grad = svg('linearGradient', { id: id, x1: 0, x2: 0, y1: 0, y2: 1 })
    grad.append(svg('stop', { offset: '0%', 'stop-color': accent, 'stop-opacity': 0.2 }), svg('stop', { offset: '100%', 'stop-color': accent, 'stop-opacity': 0 }))
    defs.append(grad); root.append(defs)
    root.append(svg('path', { d: line + ' L' + W + ' ' + H + ' L0 ' + H + ' Z', fill: 'url(#' + id + ')' }))
    var path = svg('path', { d: line, fill: 'none', stroke: accent, 'stroke-width': 2, 'vector-effect': 'non-scaling-stroke', 'stroke-linejoin': 'round', class: 'line' })
    root.append(path)
    return { root: root, path: path }
  }
  function renderOverview(view) {
    var r = range(), token = renderToken
    var totals = el('div', 'totals')
    var tiles = [['Besucher', 'visitors'], ['Seitenaufrufe', 'pageviews'], ['Anfragen', 'leads'], ['Werbeausgaben', 'spend']].map(function (t) {
      var c = el('div', 'card total'), n = el('div', 'n'), s = el('div', 'sk'); s.style.height = '30px'; s.style.marginTop = '6px'
      c.append(el('div', 'k', t[0]), s)
      totals.append(c)
      return { key: t[1], card: c, n: n, sk: s }
    })
    var groups = el('div')
    var ins = el('section', 'card panel wide'); ins.id = 'insp'; ins.style.cssText = 'min-height:0;margin:16px 0 0'
    view.append(totals, ins, groups)
    renderInsightsPanel(ins)
    COMPANIES.forEach(function (c) {
      var head = el('div', 'cohead')
      head.append(companyLogo(c), el('h2', null, c.name), el('span', 'meta', c.sites.length === 1 ? '1 Website' : c.sites.length + ' Websites'))
      var link = el('a'); link.href = '?scope=company:' + c.id; link.dataset.nav = ''; link.dataset.scope = 'company:' + c.id
      link.append(document.createTextNode('Gesamtdashboard '), el('span', null, '→'))
      head.append(link)
      var grid = el('div', 'sites')
      c.sites.forEach(function () { var sk = el('div', 'card sitecard'), x = el('div', 'sk'); x.style.height = '150px'; sk.append(x); grid.append(sk) })
      groups.append(head, grid)
      c._grid = grid
    })
    fetch('/api/sites-summary?from=' + r[0] + '&to=' + r[1]).then(function (res) { return res.json() }).then(function (rows) {
      if (token !== renderToken) return
      var by = {}, sum = { visitors: 0, pageviews: 0, leads: 0, spend: 0, previous_visitors: 0 }
      rows.forEach(function (x) {
        by[x.domain] = x
        sum.visitors += x.visitors; sum.pageviews += x.pageviews; sum.leads += x.leads; sum.spend += x.spend; sum.previous_visitors += x.previous_visitors
      })
      tiles.forEach(function (t) {
        t.sk.replaceWith(t.n)
        countUp(t.n, sum[t.key], t.key === 'spend' ? function (x) { return money0.format(x) } : function (x) { return nf.format(Math.round(x)) })
        var d = el('div', 'd')
        if (t.key === 'visitors' && sum.previous_visitors) { d.append(changeEl(sum.visitors, sum.previous_visitors), document.createTextNode(' · ')) }
        d.append(document.createTextNode(PERIOD_TEXT[state.period] + (t.key === 'leads' ? ' · ' + LEAD_HINT : t.key === 'spend' ? ' · Google Ads' : '')))
        t.card.append(d)
      })
      COMPANIES.forEach(function (c) {
        var grid = c._grid
        grid.replaceChildren()
        c.sites.forEach(function (site, i) {
          var s = by[site.domain] || { visitors: 0, previous_visitors: 0, pageviews: 0, leads: 0, spend: 0, live: 0, daily: {} }
          var a = el('a', 'card sitecard')
          a.href = '?site=' + encodeURIComponent(site.domain); a.dataset.nav = ''; a.dataset.site = site.domain
          if (!REDUCED) a.style.animation = 'rise .45s ' + (0.05 * i) + 's cubic-bezier(.2,.8,.2,1) both'
          var top = el('div', 'top2'), nm = el('div', 'nm')
          nm.append(el('b', null, site.name), el('small', null, site.domain))
          top.append(siteLogo(site.domain), nm)
          if (s.live) { var bd = el('span', 'badge'); bd.append(el('i'), document.createTextNode(nf.format(s.live) + ' aktiv')); top.append(bd) }
          var sp = sparkline(s.daily, r[0], r[1]), spark = el('div', 'spark')
          spark.append(sp.root)
          var big = el('div', 'big'), bn = el('b')
          big.append(bn, el('span', null, 'Besucher'))
          if (s.previous_visitors) big.append(changeEl(s.visitors, s.previous_visitors))
          var meta = el('div', 'meta')
          var m = function (label, value) { var x = el('span'); x.append(el('b', null, value), document.createTextNode(' ' + label)); meta.append(x) }
          m('Aufrufe', nf.format(s.pageviews)); m('Anfragen', nf.format(s.leads)); if (s.spend) m('Ads', money0.format(s.spend))
          a.append(top, spark, big, meta)
          grid.append(a)
          countUp(bn, s.visitors, function (x) { return nf.format(Math.round(x)) })
          requestAnimationFrame(function () { drawLine(sp.path) })
        })
      })
    }).catch(function () { groups.replaceChildren(el('div', 'empty', 'Fehler beim Laden')) })
    timers.push(setInterval(function () { if (state.view === 'overview') render() }, 120000))
  }

  // ---------- sync ----------
  function loadSyncInfo() {
    fetch('/api/sync-log').then(function (r) { return r.json() }).then(function (rows) {
      var label = $('synced')
      label.title = ''
      if (!rows.length) { label.textContent = 'Werbe- und Suchdaten noch nicht abgerufen'; return }
      var last = rows[0], errors = rows.filter(function (r) { return r.ts >= last.ts - 120000 && r.error })
      label.textContent = 'Daten abgerufen: ' + new Date(last.ts).toLocaleString('de-DE', { dateStyle: 'short', timeStyle: 'short' }) + (errors.length ? ' (mit Fehlern)' : '')
      if (errors.length) label.title = errors.map(function (e) { return e.site + ' · ' + e.source + ': ' + e.error }).join('\n')
    }).catch(function () {})
  }
  $('syncnow').onclick = function () {
    var b = $('syncnow')
    b.disabled = true
    b.textContent = 'Wird abgerufen…'
    fetch('/api/sync?days=90', { method: 'POST' }).then(function (r) { return r.json() }).then(function () {
      b.textContent = 'Fertig'
      loadSyncInfo()
      render()
    }).catch(function () { b.textContent = 'Fehler' }).finally(function () {
      setTimeout(function () { b.disabled = false; b.textContent = 'Werbe- & Suchdaten abrufen' }, 2500)
    })
  }

  // ---------- controls ----------
  $('period').onchange = function () {
    state.period = this.value
    $('custom').classList.toggle('on', state.period === 'custom')
    if (state.period === 'custom') { state.from = $('from').value; state.to = $('to').value }
    else { var r = range(); $('from').value = r[0]; $('to').value = r[1] }
    saveUrl()
    if (state.view === 'dash') { renderHeader(); refreshDash() } else render()
    loadInsightCount()
  }
  $('from').onchange = $('to').onchange = function () {
    if ($('from').value && $('to').value && $('from').value <= $('to').value) {
      state.from = $('from').value; state.to = $('to').value
      saveUrl()
      if (state.view === 'dash') refreshDash(); else render()
    }
  }
  var resizeTimer
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer)
    resizeTimer = setTimeout(function () { if (state.view === 'dash') renderChart(lastSeries, false) }, 150)
  })

  var topBar = document.querySelector('.top')
  window.addEventListener('scroll', function () { topBar.classList.toggle('stuck', window.scrollY > 8) }, { passive: true })

  // ---------- init ----------
  fetch('/api/sites').then(function (r) { return r.json() }).then(function (sites) {
    SITES = sites
    var byCompany = {}
    sites.forEach(function (s) {
      SITE_BY_DOMAIN[s.domain] = s
      var id = s.company || 'other'
      if (!byCompany[id]) {
        byCompany[id] = { id: id, name: s.company_name || 'Weitere', logo_domain: s.logo_domain || s.domain, favicon_url: s.company_favicon, logo_url: s.company_logo, sites: [] }
        COMPANIES.push(byCompany[id])
      }
      byCompany[id].sites.push(s)
    })
    buildSidebar()
    readUrl()
    render()
    loadSyncInfo()
    loadInsightCount()
  })
})()
</script>
</body>
