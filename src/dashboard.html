<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gruppenwerk Analytics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --bg: #f9fafb;
  --card: #ffffff;
  --card-shadow: 0 1px 3px rgba(0, 0, 0, 0.06), 0 1px 2px rgba(0, 0, 0, 0.04);
  --line: #e5e7eb;
  --line-soft: #f3f4f6;
  --text: #111827;
  --text-2: #4b5563;
  --text-3: #6b7280;
  --sel: #f3f4f6;
  --accent: #6366f1;
  --accent-fill: rgba(99, 102, 241, 0.16);
  --tab-on: #111827;
  --up: #10b981;
  --down: #ef4444;
  --live: #10b981;
  --bar-sources: #eff6ff;
  --bar-pages: #fff7ed;
  --bar-locations: #eef2ff;
  --bar-devices: #ecfdf5;
  --bar-goals: #fef2f2;
  --bar-search: #f0fdfa;
  --tip-bg: #111827;
  --tip-text: #f9fafb;
  --tip-muted: #9ca3af;
  --menu: #ffffff;
  --hover: #f9fafb;
  --chip: #eef2ff;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --bg: #0f0f12; --card: #1c1c21; --card-shadow: none; --line: #2e2e35; --line-soft: #26262c;
    --text: #f4f4f5; --text-2: #c4c4cc; --text-3: #9b9ba6; --sel: #27272d;
    --accent: #818cf8; --accent-fill: rgba(129, 140, 248, 0.16); --tab-on: #f4f4f5;
    --up: #34d399; --down: #f87171; --live: #34d399;
    --bar-sources: rgba(59, 130, 246, 0.14); --bar-pages: rgba(249, 115, 22, 0.11); --bar-locations: rgba(99, 102, 241, 0.16);
    --bar-devices: rgba(16, 185, 129, 0.12); --bar-goals: rgba(239, 68, 68, 0.11); --bar-search: rgba(20, 184, 166, 0.12);
    --tip-bg: #0a0a0c; --tip-text: #f4f4f5; --tip-muted: #a1a1aa; --menu: #232329; --hover: #26262c; --chip: rgba(129, 140, 248, 0.18);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0f0f12; --card: #1c1c21; --card-shadow: none; --line: #2e2e35; --line-soft: #26262c;
  --text: #f4f4f5; --text-2: #c4c4cc; --text-3: #9b9ba6; --sel: #27272d;
  --accent: #818cf8; --accent-fill: rgba(129, 140, 248, 0.16); --tab-on: #f4f4f5;
  --up: #34d399; --down: #f87171; --live: #34d399;
  --bar-sources: rgba(59, 130, 246, 0.14); --bar-pages: rgba(249, 115, 22, 0.11); --bar-locations: rgba(99, 102, 241, 0.16);
  --bar-devices: rgba(16, 185, 129, 0.12); --bar-goals: rgba(239, 68, 68, 0.11); --bar-search: rgba(20, 184, 166, 0.12);
  --tip-bg: #0a0a0c; --tip-text: #f4f4f5; --tip-muted: #a1a1aa; --menu: #232329; --hover: #26262c; --chip: rgba(129, 140, 248, 0.18);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 14px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased; font-feature-settings: "cv11", "ss01";
}
button, select, input { font: inherit; color: inherit; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 24px 16px 80px; }

/* top bar */
.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.left, .right { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
.site { position: relative; display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; }
.site img { width: 18px; height: 18px; border-radius: 4px; }
.site select { appearance: none; -webkit-appearance: none; border: 0; background: transparent; font-weight: 700; font-size: 15px; padding: 2px 20px 2px 0; cursor: pointer; }
.site::after { content: ""; position: absolute; right: 4px; top: 50%; width: 6px; height: 6px; border-right: 1.5px solid var(--text-3); border-bottom: 1.5px solid var(--text-3); transform: translateY(-70%) rotate(45deg); pointer-events: none; }
.live { display: inline-flex; align-items: center; gap: 8px; color: var(--text-3); font-size: 14px; }
.live i { width: 8px; height: 8px; border-radius: 50%; background: var(--live); box-shadow: 0 0 0 0 rgba(16,185,129,.5); animation: pulse 2s infinite; }
@keyframes pulse { 70% { box-shadow: 0 0 0 6px rgba(16,185,129,0) } 100% { box-shadow: 0 0 0 0 rgba(16,185,129,0) } }
.ghost { display: inline-flex; align-items: center; gap: 8px; background: transparent; border: 0; padding: 6px 4px; cursor: pointer; font-weight: 500; color: var(--text); }
.ghost svg { width: 16px; height: 16px; stroke: var(--text-2); }
.period { position: relative; display: inline-flex; align-items: center; gap: 8px; font-weight: 500; }
.period svg { width: 16px; height: 16px; stroke: var(--text-2); pointer-events: none; position: absolute; left: 2px; }
.period select { appearance: none; -webkit-appearance: none; border: 0; background: transparent; padding: 6px 4px 6px 26px; cursor: pointer; font-weight: 500; }
.custom { display: none; gap: 6px; align-items: center; font-size: 13px; }
.custom.on { display: inline-flex; }
.custom input { border: 1px solid var(--line); border-radius: 6px; background: var(--card); padding: 4px 6px; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.filters:empty { display: none; }
.chip { display: inline-flex; align-items: center; gap: 4px; background: var(--chip); border-radius: 6px; padding: 4px 4px 4px 10px; font-size: 13px; }
.chip .k { color: var(--text-2); }
.chip b { font-weight: 600; max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip button { border: 0; background: transparent; cursor: pointer; color: var(--text-3); width: 22px; height: 22px; border-radius: 4px; font-size: 16px; line-height: 1; }
.chip button:hover { background: rgba(0,0,0,.06); color: var(--text); }

/* cards */
.card { background: var(--card); border-radius: 8px; box-shadow: var(--card-shadow); }
.main { margin-top: 16px; padding: 12px 16px 16px; }
.stats { display: grid; grid-template-columns: repeat(6, 1fr); }
.stat { position: relative; text-align: left; background: transparent; border: 0; border-radius: 6px; padding: 10px 12px; cursor: default; }
.stat + .stat::before { content: ""; position: absolute; left: -1px; top: 4px; bottom: 4px; width: 1px; background: var(--line); }
.stat.pick { cursor: pointer; }
.stat.pick:hover { background: var(--hover); }
.stat.sel { background: var(--sel); }
.stat.sel::before, .stat.sel + .stat::before { opacity: 0; }
.stat .k { font-size: 12px; font-weight: 600; letter-spacing: .02em; text-transform: uppercase; color: var(--text-3); white-space: nowrap; }
.stat.sel .k { color: var(--text); }
.stat .v { display: flex; align-items: baseline; gap: 8px; margin-top: 2px; flex-wrap: wrap; }
.stat .n { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.stat .d { font-size: 12px; color: var(--text-3); font-variant-numeric: tabular-nums; white-space: nowrap; }
.stat .d .up { color: var(--up); }
.stat .d .down { color: var(--down); }
.chart { position: relative; height: 300px; margin-top: 18px; }
.chart svg { display: block; width: 100%; height: 100%; overflow: visible; }
.tip { position: absolute; z-index: 5; pointer-events: none; display: none; background: var(--tip-bg); color: var(--tip-text); border-radius: 6px; padding: 10px 12px; min-width: 190px; box-shadow: 0 10px 25px rgba(0,0,0,.25); font-size: 13px; }
.tip .t { font-size: 11px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; }
.tip .r { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 6px; }
.tip .r span { display: inline-flex; align-items: center; gap: 8px; }
.tip .r span::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.tip .r b { font-size: 15px; font-variant-numeric: tabular-nums; }
.tip .h { border-top: 1px solid rgba(255,255,255,.14); margin-top: 8px; padding-top: 6px; color: var(--tip-muted); font-size: 12px; }

/* panels */
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
.grid > * { min-width: 0; }
.panel { padding: 16px 20px 18px; display: flex; flex-direction: column; min-height: 460px; }
.panel.wide { grid-column: 1 / -1; min-height: 0; }
.ph { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--line); }
.tabs { display: flex; gap: 16px; overflow-x: auto; scrollbar-width: none; }
.tabs button { background: none; border: 0; padding: 4px 0 12px; margin-bottom: -1px; border-bottom: 2px solid transparent; font-size: 12px; font-weight: 600; letter-spacing: .02em; text-transform: uppercase; color: var(--text-3); cursor: pointer; white-space: nowrap; }
.tabs button:hover { color: var(--text-2); }
.tabs button.on { color: var(--tab-on); border-bottom-color: var(--tab-on); }
.tabs .title { padding: 4px 0 12px; font-size: 12px; font-weight: 600; letter-spacing: .02em; text-transform: uppercase; color: var(--tab-on); border-bottom: 2px solid var(--tab-on); margin-bottom: -1px; white-space: nowrap; }
.expand { background: none; border: 0; padding: 2px 0 12px; cursor: pointer; color: var(--text-3); }
.expand:hover { color: var(--text); }
.expand svg { width: 16px; height: 16px; display: block; }
.cols { display: flex; justify-content: space-between; gap: 12px; margin: 14px 0 6px; font-size: 13px; color: var(--text-3); }
.cols .nums, .row .nums { display: flex; flex-shrink: 0; }
.cols .nums span, .row .nums span { width: 76px; text-align: right; }
.list { display: flex; flex-direction: column; gap: 4px; }
.row { display: flex; align-items: center; gap: 12px; height: 32px; }
.row .track { position: relative; flex: 1; min-width: 0; height: 32px; }
.row .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; }
.row .lbl { position: relative; display: flex; align-items: center; gap: 8px; height: 100%; padding: 0 8px; min-width: 0; }
.row .lbl span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .lbl.click { cursor: pointer; }
.row .lbl.click:hover span { text-decoration: underline; text-decoration-color: var(--text-3); text-underline-offset: 3px; }
.row .lbl img, .row .lbl .ico { width: 16px; height: 16px; flex-shrink: 0; border-radius: 3px; }
.row .lbl .flag { font-size: 15px; line-height: 1; flex-shrink: 0; }
.row .nums span { font-weight: 500; font-variant-numeric: tabular-nums; }
.row .nums span.m { color: var(--text-2); font-weight: 400; }
.empty { flex: 1; display: flex; align-items: center; justify-content: center; text-align: center; color: var(--text-3); padding: 40px 12px; }
.spin { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--text-3); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg) } }

/* ads & search */
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); margin-top: 14px; }
.kpi { padding: 4px 16px 4px 0; }
.kpi + .kpi { border-left: 1px solid var(--line); padding-left: 16px; }
.kpi .k { font-size: 12px; font-weight: 600; letter-spacing: .02em; text-transform: uppercase; color: var(--text-3); }
.kpi .n { font-size: 20px; font-weight: 700; margin-top: 2px; font-variant-numeric: tabular-nums; }
.kpi .s { font-size: 12px; color: var(--text-3); margin-top: 1px; }
.tbl { overflow-x: auto; margin-top: 16px; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th { font-size: 13px; font-weight: 400; color: var(--text-3); text-align: right; padding: 0 0 8px 16px; white-space: nowrap; }
th:first-child, td:first-child { text-align: left; padding-left: 0; }
td { text-align: right; padding: 7px 0 7px 16px; border-top: 1px solid var(--line-soft); white-space: nowrap; font-weight: 500; }
td:first-child { font-weight: 400; max-width: 360px; overflow: hidden; text-overflow: ellipsis; }
td.m { color: var(--text-3); font-weight: 400; }
.note { margin-top: 12px; font-size: 12px; color: var(--text-3); }
.foot { display: flex; justify-content: flex-end; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 24px; font-size: 12px; color: var(--text-3); }
.foot button { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; cursor: pointer; font-size: 12px; font-weight: 500; }
.foot button:hover { border-color: var(--text-3); }

@media (max-width: 900px) {
  .stats { grid-template-columns: repeat(3, 1fr); row-gap: 6px; }
  .stat:nth-child(4)::before { opacity: 0; }
  .grid { grid-template-columns: 1fr; }
  .panel { min-height: 0; }
  .kpis { grid-template-columns: repeat(2, 1fr); row-gap: 12px; }
  .kpi:nth-child(3) { border-left: 0; padding-left: 0; }
}
@media (max-width: 560px) {
  .wrap { padding-top: 16px; }
  .stats { grid-template-columns: repeat(2, 1fr); }
  .stat:nth-child(4)::before { opacity: 1; }
  .stat:nth-child(odd)::before { opacity: 0; }
  .chart { height: 220px; }
  .cols .nums span.m, .row .nums span.m { display: none; }
  .cols .nums span, .row .nums span { width: 56px; }
  .panel { padding: 14px 14px 16px; }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <div class="left">
      <label class="site"><img id="siteIcon" alt=""><select id="site" aria-label="Website"></select></label>
      <span class="live"><i></i><span id="live">–</span></span>
    </div>
    <div class="right">
      <span class="custom" id="custom"><input type="date" id="from" aria-label="Von"> – <input type="date" id="to" aria-label="Bis"></span>
      <label class="period">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>
        <select id="period" aria-label="Zeitraum">
          <option value="today">Heute</option>
          <option value="yesterday">Gestern</option>
          <option value="7d">Letzte 7 Tage</option>
          <option value="30d" selected>Letzte 30 Tage</option>
          <option value="month">Dieser Monat</option>
          <option value="lastmonth">Letzter Monat</option>
          <option value="12mo">Letzte 12 Monate</option>
          <option value="custom">Eigener Zeitraum</option>
        </select>
      </label>
    </div>
  </div>
  <div class="filters" id="filters"></div>

  <section class="card main">
    <div class="stats" id="stats"></div>
    <div class="chart" id="chart"><div class="tip" id="tip"></div></div>
  </section>

  <div class="grid">
    <section class="card panel" data-panel="sources"></section>
    <section class="card panel" data-panel="pages"></section>
    <section class="card panel" data-panel="locations"></section>
    <section class="card panel" data-panel="devices"></section>
    <section class="card panel wide" data-panel="goals"></section>
    <section class="card panel wide" id="ads"></section>
    <section class="card panel wide" id="search"></section>
  </div>

  <div class="foot">
    <span id="synced"></span>
    <button id="syncnow" type="button">Werbe- &amp; Suchdaten jetzt abrufen</button>
  </div>
</div>

<script>
(function () {
  'use strict'

  var PANELS = {
    sources: { bar: '--bar-sources', tabs: [['source', 'Quellen', 'Quelle'], ['utm_medium', 'Medium', 'UTM-Medium'], ['utm_source', 'UTM-Quelle', 'UTM-Quelle'], ['utm_campaign', 'Kampagnen', 'Kampagne']] },
    pages: { bar: '--bar-pages', tabs: [['page', 'Top-Seiten', 'Seite'], ['entry_page', 'Einstiegsseiten', 'Einstiegsseite'], ['exit_page', 'Ausstiegsseiten', 'Ausstiegsseite']] },
    locations: { bar: '--bar-locations', tabs: [['city', 'Städte', 'Stadt'], ['region', 'Regionen', 'Region'], ['country', 'Länder', 'Land']] },
    devices: { bar: '--bar-devices', tabs: [['browser', 'Browser', 'Browser'], ['os', 'Betriebssysteme', 'Betriebssystem'], ['device', 'Geräte', 'Gerät']] },
    goals: { bar: '--bar-goals', goal: true, tabs: [['event', 'Ziele', 'Ziel'], ['label', 'Button-Texte', 'Button-Text']] }
  }
  var FILTER_NAMES = {
    page: 'Seite', source: 'Quelle', referrer: 'Verweis', utm_source: 'UTM-Quelle', utm_medium: 'Medium', utm_campaign: 'Kampagne',
    utm_content: 'UTM-Inhalt', utm_term: 'UTM-Begriff', country: 'Land', region: 'Region', city: 'Stadt', device: 'Gerät',
    browser: 'Browser', os: 'Betriebssystem', event: 'Ziel', label: 'Button-Text', hostname: 'Hostname'
  }
  var EVENT_NAMES = {
    'Phone click': 'Anruf-Klick', 'Email click': 'E-Mail-Klick', 'WhatsApp click': 'WhatsApp-Klick', 'Form submit': 'Formular gesendet',
    'Button click': 'Button-Klick', 'Outbound link': 'Externer Link', 'File download': 'Datei-Download', 'Maps click': 'Google-Maps-Klick'
  }
  var STATS = [
    ['visitors', 'Besucher', true], ['visits', 'Besuche', true], ['pageviews', 'Seitenaufrufe', true],
    ['bounce_rate', 'Absprungrate', false], ['visit_duration', 'Besuchsdauer', false], ['leads', 'Anfragen', false]
  ]
  var SOURCE_DOMAINS = {
    Google: 'google.com', 'Google Ads': 'ads.google.com', Bing: 'bing.com', DuckDuckGo: 'duckduckgo.com', Ecosia: 'ecosia.org', Yahoo: 'yahoo.com',
    Qwant: 'qwant.com', Facebook: 'facebook.com', Instagram: 'instagram.com', LinkedIn: 'linkedin.com', X: 'x.com', YouTube: 'youtube.com',
    TikTok: 'tiktok.com', Pinterest: 'pinterest.com', ChatGPT: 'chatgpt.com', Perplexity: 'perplexity.ai', Claude: 'claude.ai',
    Gemini: 'gemini.google.com', Copilot: 'copilot.microsoft.com', MyHammer: 'my-hammer.de', 'Gelbe Seiten': 'gelbeseiten.de',
    '11880': '11880.com', WhatsApp: 'whatsapp.com', Newsletter: null
  }
  var BROWSER_DOMAINS = { Chrome: 'google.com/chrome', Safari: 'apple.com/safari', Firefox: 'firefox.com', Edge: 'microsoft.com/edge', Opera: 'opera.com', 'Samsung Internet': 'samsung.com' }
  var OS_DOMAINS = { Windows: 'microsoft.com', macOS: 'apple.com', iOS: 'apple.com', Android: 'android.com', Linux: 'kernel.org', ChromeOS: 'google.com/chromebook' }

  var ICON_LINK = '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="color:var(--text-3)"><path d="M10 13a5 5 0 0 0 7.07 0l3-3a5 5 0 0 0-7.07-7.07l-1.5 1.5"/><path d="M14 11a5 5 0 0 0-7.07 0l-3 3a5 5 0 0 0 7.07 7.07l1.5-1.5"/></svg>'
  var ICON_EXPAND = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>'
  var ICON_COLLAPSE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>'

  var state = { site: null, period: '30d', from: null, to: null, filters: [], metric: 'visitors', tabs: {}, totalVisitors: 0 }
  var nf = new Intl.NumberFormat('de-DE')
  var pct = new Intl.NumberFormat('de-DE', { maximumFractionDigits: 1 })
  var money = new Intl.NumberFormat('de-DE', { style: 'currency', currency: 'EUR' })
  var regionNames = (function () { try { return new Intl.DisplayNames(['de'], { type: 'region' }) } catch (e) { return null } })()

  function $(id) { return document.getElementById(id) }
  function el(tag, cls, text) {
    var e = document.createElement(tag)
    if (cls) e.className = cls
    if (text !== undefined && text !== null) e.textContent = String(text)
    return e
  }
  function favicon(domain) {
    var img = el('img')
    img.alt = ''
    img.loading = 'lazy'
    img.referrerPolicy = 'no-referrer'
    img.src = 'https://icons.duckduckgo.com/ip3/' + domain.split('/')[0] + '.ico'
    img.onerror = function () { img.replaceWith(linkIcon()) }
    return img
  }
  function linkIcon() { var s = el('span'); s.innerHTML = ICON_LINK; return s.firstChild }
  function flag(code) {
    if (!code || code.length !== 2) return null
    var f = el('span', 'flag', String.fromCodePoint.apply(null, code.toUpperCase().split('').map(function (c) { return 127397 + c.charCodeAt(0) })))
    return f
  }
  function iconFor(dim, value) {
    if (value === null || value === undefined) return null
    if (dim === 'source') {
      if (value === 'Direct / None') return linkIcon()
      var d = Object.prototype.hasOwnProperty.call(SOURCE_DOMAINS, value) ? SOURCE_DOMAINS[value] : (value.indexOf('.') > 0 ? value : null)
      return d ? favicon(d) : linkIcon()
    }
    if (dim === 'utm_source' && value.indexOf('.') > 0) return favicon(value)
    if (dim === 'browser' && BROWSER_DOMAINS[value]) return favicon(BROWSER_DOMAINS[value])
    if (dim === 'os' && OS_DOMAINS[value]) return favicon(OS_DOMAINS[value])
    if (dim === 'country') return flag(value)
    return null
  }

  function iso(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0') }
  function berlinToday() {

  }
  function api(path, extra) {

  function fmtDuration(s) {

  function displayName(dim, value) {

    if (dim === 'event') return EVENT_NAMES[value] || value

  // ---------- filters ----------

    refresh()

      b.type = 'button'

      var v = el('div', 'v')
      v.append(el('span', 'n', fmtStat(key, cur)))
      var d = el('span', 'd')
      if (prev) {

        var good = key === 'bounce_rate' ? change < 0 : change > 0
        if (change !== 0) d.append(el('span', good ? 'up' : 'down', change > 0 ? '↗ ' : '↘ '))

  // ---------- chart ----------
  var NS = 'http://www.w3.org/2000/svg'
  function svg(tag, attrs) {
    var e = document.createElementNS(NS, tag)
    Object.keys(attrs || {}).forEach(function (k) { e.setAttribute(k, attrs[k]) })
    return e
  }
  function niceMax(v) {
    if (v <= 4) return 4
    var pow = Math.pow(10, Math.floor(Math.log10(v)))
    var steps = [1, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10]
    for (var i = 0; i < steps.length; i++) if (steps[i] * pow >= v) return steps[i] * pow
    return 10 * pow
  }
  var METRIC_LABEL = { visitors: 'Besucher', visits: 'Besuche', pageviews: 'Seitenaufrufe' }
  function renderChart(series) {
    var box = $('chart'), tip = $('tip')
    Array.prototype.slice.call(box.querySelectorAll('svg')).forEach(function (n) { n.remove() })
    if (!series.length) return
    var W = box.clientWidth, H = box.clientHeight
    var padL = 40, padB = 28, padT = 6, padR = 4
    var iw = W - padL - padR, ih = H - padT - padB
    var max = niceMax(Math.max.apply(null, series.map(function (p) { return p.value }).concat([1])))
    var css = getComputedStyle(document.documentElement)
    var grid = css.getPropertyValue('--line-soft').trim(), muted = css.getPropertyValue('--text-3').trim()
    var accent = css.getPropertyValue('--accent').trim(), card = css.getPropertyValue('--card').trim(), axis = css.getPropertyValue('--line').trim()
    var root = svg('svg', { viewBox: '0 0 ' + W + ' ' + H, role: 'img', 'aria-label': METRIC_LABEL[state.metric] + ' im Zeitverlauf' })
    var ticks = max <= 4 ? max : 7
    if (max > 4) { var nice = [7, 6, 5, 4]; for (var k = 0; k < nice.length; k++) if ((max / nice[k]) % 1 === 0) { ticks = nice[k]; break } }
    for (var i = 0; i <= ticks; i++) {
      var y = padT + ih - (ih * i) / ticks
      root.append(svg('line', { x1: padL, x2: W - padR, y1: y, y2: y, stroke: i === 0 ? axis : grid, 'stroke-width': 1 }))
      var t = svg('text', { x: padL - 10, y: y + 4, 'text-anchor': 'end', 'font-size': 12, fill: muted })
      t.textContent = nf.format(Math.round((max * i) / ticks))
      root.append(t)
    }
    var n = series.length
    var x = function (i) { return padL + (n === 1 ? iw / 2 : (iw * i) / (n - 1)) }
    var yv = function (v) { return padT + ih - (ih * v) / max }
    var every = Math.max(1, Math.ceil(n / Math.max(2, Math.floor(iw / 80))))
    series.forEach(function (p, i) {
      if (i % every !== 0) return
      var t = svg('text', { x: x(i), y: H - 6, 'text-anchor': i === 0 ? 'start' : 'middle', 'font-size': 12, fill: muted })
      t.textContent = p.short
      root.append(t)
      root.append(svg('line', { x1: x(i), x2: x(i), y1: padT + ih, y2: padT + ih + 4, stroke: axis }))
    })
    var d = series.map(function (p, i) { return (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + yv(p.value).toFixed(1) }).join(' ')
    var area = d + ' L' + x(n - 1).toFixed(1) + ' ' + (padT + ih) + ' L' + x(0).toFixed(1) + ' ' + (padT + ih) + ' Z'
    var defs = svg('defs')
    var grad = svg('linearGradient', { id: 'fill', x1: 0, x2: 0, y1: 0, y2: 1 })
    grad.append(svg('stop', { offset: '0%', 'stop-color': accent, 'stop-opacity': 0.22 }), svg('stop', { offset: '100%', 'stop-color': accent, 'stop-opacity': 0.02 }))
    defs.append(grad); root.append(defs)
    root.append(svg('path', { d: area, fill: 'url(#fill)' }))
    root.append(svg('path', { d: d, fill: 'none', stroke: accent, 'stroke-width': 2.5, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }))
    if (n === 1) root.append(svg('circle', { cx: x(0), cy: yv(series[0].value), r: 4, fill: accent }))
    var hair = svg('line', { y1: padT, y2: padT + ih, stroke: muted, 'stroke-opacity': 0.5, 'stroke-width': 1, visibility: 'hidden' })
    var dot = svg('circle', { r: 4.5, fill: accent, stroke: card, 'stroke-width': 2, visibility: 'hidden' })
    root.append(hair, dot)
    var hit = svg('rect', { x: padL - 6, y: 0, width: iw + 12, height: padT + ih, fill: 'transparent' })
    root.append(hit)
    var current = -1
    function show(evt) {
      var rect = root.getBoundingClientRect()
      var px = ((evt.clientX - rect.left) / rect.width) * W
      var i = n === 1 ? 0 : Math.max(0, Math.min(n - 1, Math.round(((px - padL) / iw) * (n - 1))))
      current = i
      var p = series[i]
      hair.setAttribute('x1', x(i)); hair.setAttribute('x2', x(i)); hair.setAttribute('visibility', 'visible')
      dot.setAttribute('cx', x(i)); dot.setAttribute('cy', yv(p.value)); dot.setAttribute('visibility', 'visible')
      var row = el('div', 'r')
      row.append(el('span', null, p.long), el('b', null, nf.format(p.value)))
      tip.replaceChildren(el('div', 't', METRIC_LABEL[state.metric]), row)
      if (p.day) tip.append(el('div', 'h', 'Klicken, um den Tag anzuzeigen'))
      tip.style.display = 'block'

      var left = x(i) + 14

    function hide() { hair.setAttribute('visibility', 'hidden'); dot.setAttribute('visibility', 'hidden'); tip.style.display = 'none'; current = -1 }
    hit.addEventListener('pointermove', show)
    hit.addEventListener('pointerdown', show)
    hit.addEventListener('pointerleave', hide)
    hit.addEventListener('click', function () {
      var p = series[current]
      if (!p || !p.day) return
      state.period = 'custom'; state.from = p.day; state.to = p.day
      $('period').value = 'custom'; $('from').value = p.day; $('to').value = p.day
      $('custom').classList.add('on')
      refresh()
    })
    box.append(root)
  }

  var lastSeries = []
  function loadChart() {
    var r = range()
    return api('timeseries').then(function (data) {
      var metric = state.metric
      var map = {}
      data.results.forEach(function (row) { map[row.bucket] = row })
      var series = []
      if (data.interval === 'hour') {
        for (var h = 0; h < 24; h++) {
          var row = map[h]
          series.push({ value: row ? row[metric] : 0, short: String(h).padStart(2, '0') + ':00', long: String(h).padStart(2, '0') + ':00 Uhr' })
        }
      } else {
        var d = new Date(r[0] + 'T00:00:00'), end = new Date(r[1] + 'T00:00:00')
        var monthly = (end - d) / 86400000 > 120
        var buckets = {}, order = []
        for (; d <= end; d = addDays(d, 1)) {
          var key = monthly ? iso(d).slice(0, 7) : iso(d)
          if (!buckets[key]) { buckets[key] = { value: 0, date: new Date(d) }; order.push(key) }
          var row2 = map[iso(d)]
          if (row2) buckets[key].value += row2[metric] || 0
        }
        series = order.map(function (k) {
          var b = buckets[k]
          return monthly
            ? { value: b.value, short: b.date.toLocaleDateString('de-DE', { month: 'short' }), long: b.date.toLocaleDateString('de-DE', { month: 'long', year: 'numeric' }) }
            : { value: b.value, day: k, short: b.date.toLocaleDateString('de-DE', { day: 'numeric', month: 'short' }), long: b.date.toLocaleDateString('de-DE', { weekday: 'short', day: 'numeric', month: 'short' }) }
        })
      }
      lastSeries = series
      renderChart(series)
    })
  }

  // ---------- list panels ----------
  function header(section, tabsDef, active, onTab, expandable) {
    var ph = el('div', 'ph')
    var tabs = el('div', 'tabs')
    tabsDef.forEach(function (t) {
      if (!onTab) { tabs.append(el('span', 'title', t[1])); return }
      var b = el('button', t[0] === active ? 'on' : '', t[1])
      b.type = 'button'
      b.onclick = function () { onTab(t[0]) }
      tabs.append(b)
    })
    ph.append(tabs)
    if (expandable) {
      var x = el('button', 'expand')
      x.type = 'button'
      x.title = section.dataset.expanded ? 'Weniger anzeigen' : 'Alle anzeigen'
      x.setAttribute('aria-label', x.title)
      x.innerHTML = section.dataset.expanded ? ICON_COLLAPSE : ICON_EXPAND
      x.onclick = function () {
        if (section.dataset.expanded) delete section.dataset.expanded
        else section.dataset.expanded = '1'
        expandable()
      }
      ph.append(x)
    }
    section.append(ph)
  }
  function loading(section) {
    var e = el('div', 'empty')
    e.append(el('div', 'spin'))
    section.append(e)
    return e
  }

  function renderPanel(section, key) {
    var conf = PANELS[key]
    var tab = state.tabs[key] || conf.tabs[0][0]
    var tabDef = conf.tabs.filter(function (t) { return t[0] === tab })[0]
    section.replaceChildren()
    header(section, conf.tabs, tab, function (t) { state.tabs[key] = t; renderPanel(section, key) }, function () { renderPanel(section, key) })
    var spinner = loading(section)
    var isGoal = !!conf.goal
    var isSession = tab === 'entry_page' || tab === 'exit_page'
    var limit = section.dataset.expanded ? 100 : 9
    api('breakdown', { dim: tab, limit: limit }).then(function (rows) {
      spinner.remove()
      if (!rows.length) {
        section.append(el('div', 'empty', isGoal ? 'Noch keine Klicks erfasst' : 'Noch keine Daten'))
        return
      }
      var cols = el('div', 'cols')
      var nums = el('span', 'nums')
      if (isGoal) nums.append(el('span', 'm', 'Gesamt'), el('span', null, 'Besucher'), el('span', null, 'CR'))
      else nums.append(el('span', 'm', isSession ? 'Besuche' : 'Aufrufe'), el('span', null, 'Besucher'))
      cols.append(el('span', null, tabDef[2]), nums)
      section.append(cols)
      var list = el('div', 'list')
      var max = Math.max.apply(null, rows.map(function (r) { return r.visitors }))
      var color = 'var(' + conf.bar + ')'
      rows.forEach(function (r) {
        var row = el('div', 'row')
        var track = el('div', 'track')
        var fill = el('div', 'fill')
        fill.style.width = Math.max(1.5, (r.visitors / max) * 100) + '%'
        fill.style.background = color
        var lbl = el('div', 'lbl')
        var icon = iconFor(tab, r.name)
        if (icon) lbl.append(icon)
        var name = el('span', null, displayName(tab, r.name))
        name.title = displayName(tab, r.name)
        lbl.append(name)
        if (!isSession) {
          lbl.classList.add('click')
          lbl.onclick = function () { addFilter(tab, r.name) }
        }
        track.append(fill, lbl)
        var n = el('div', 'nums')
        if (isGoal) {
          var cr = state.totalVisitors ? (r.visitors / state.totalVisitors) * 100 : 0
          n.append(el('span', 'm', nf.format(r.events)), el('span', null, nf.format(r.visitors)), el('span', null, pct.format(cr) + '%'))
        } else {
          n.append(el('span', 'm', nf.format(isSession ? r.visits : r.pageviews)), el('span', null, nf.format(r.visitors)))
        }
        row.append(track, n)
        list.append(row)
      })
      section.append(list)
    }).catch(function () { spinner.replaceChildren(document.createTextNode('Fehler beim Laden')) })
  }

  // ---------- live + sync ----------
  function loadLive() {
    if (!state.site) return
    fetch('/api/realtime?site=' + encodeURIComponent(state.site)).then(function (r) { return r.json() }).then(function (d) {
      $('live').textContent = nf.format(d.visitors) + (d.visitors === 1 ? ' aktueller Besucher' : ' aktuelle Besucher')
    }).catch(function () {})
  }
  function loadSyncInfo() {
    fetch('/api/sync-log').then(function (r) { return r.json() }).then(function (rows) {
      var mine = rows.filter(function (r) { return r.site === state.site })
      var label = $('synced')
      label.title = ''
      if (!mine.length) { label.textContent = 'Werbe- und Suchdaten noch nicht abgerufen'; return }
      var last = mine[0]
      var recent = mine.filter(function (r) { return r.ts >= last.ts - 120000 })
      var errors = recent.filter(function (r) { return r.error })
      label.textContent = 'Werbe- und Suchdaten abgerufen: ' + new Date(last.ts).toLocaleString('de-DE', { dateStyle: 'short', timeStyle: 'short' }) + (errors.length ? ' (mit Fehlern)' : '')
      if (errors.length) label.title = errors.map(function (e) { return e.source + ': ' + e.error }).join('\n')
    }).catch(function () {})
  }
  $('syncnow').onclick = function () {
    var b = $('syncnow')
    b.disabled = true
    b.textContent = 'Wird abgerufen…'
    fetch('/api/sync?days=90', { method: 'POST' }).then(function (r) { return r.json() }).then(function () {
      b.textContent = 'Fertig'
      refresh()
    }).catch(function () { b.textContent = 'Fehler' }).finally(function () {
      setTimeout(function () { b.disabled = false; b.textContent = 'Werbe- & Suchdaten jetzt abrufen' }, 2500)
    })
  }

  function setSiteIcon() {
    var img = $('siteIcon')
    img.src = 'https://icons.duckduckgo.com/ip3/' + state.site + '.ico'
    img.onerror = function () { img.style.visibility = 'hidden' }
    img.onload = function () { img.style.visibility = 'visible' }
  }

  function refresh() {
    saveUrl()
    renderFilters()
    setSiteIcon()
    api('overview').then(function (d) {
      renderStats(d)
      // goal conversion rates need the total visitor count
      var goals = document.querySelector('[data-panel="goals"]')
      if (goals) renderPanel(goals, 'goals')
    })
    loadChart()
    Array.prototype.forEach.call(document.querySelectorAll('[data-panel]:not([data-panel="goals"])'), function (s) { renderPanel(s, s.dataset.panel) })
    renderAds()
    renderSearch()
    loadLive()
    loadSyncInfo()
  }

  // ---------- init ----------
  var params = new URLSearchParams(location.search)
  state.period = params.get('period') || '30d'
  state.from = params.get('from')
  state.to = params.get('to')
  try { state.filters = JSON.parse(params.get('filters') || '[]') } catch (e) { state.filters = [] }

  $('period').value = state.period
  $('custom').classList.toggle('on', state.period === 'custom')
  var r0 = range()
  $('from').value = r0[0]; $('to').value = r0[1]
  $('period').onchange = function () {
    state.period = this.value
    $('custom').classList.toggle('on', state.period === 'custom')
    if (state.period === 'custom') { state.from = $('from').value; state.to = $('to').value }
    else { var r = range(); $('from').value = r[0]; $('to').value = r[1] }
    refresh()
  }
  $('from').onchange = $('to').onchange = function () {
    if ($('from').value && $('to').value && $('from').value <= $('to').value) {
      state.from = $('from').value; state.to = $('to').value; refresh()
    }
  }
  $('site').onchange = function () { state.site = this.value; state.filters = []; refresh() }

  var resizeTimer
  window.addEventListener('resize', function () { clearTimeout(resizeTimer); resizeTimer = setTimeout(function () { renderChart(lastSeries) }, 150) })
  setInterval(loadLive, 30000)

  fetch('/api/sites').then(function (r) { return r.json() }).then(function (sites) {
    var sel = $('site')
    sites.forEach(function (s) { var o = el('option', null, s.domain); o.value = s.domain; sel.append(o) })
    var wanted = params.get('site')
    state.site = sites.some(function (s) { return s.domain === wanted }) ? wanted : sites[0].domain
    sel.value = state.site
    refresh()
  })
})()
</script>
</body>
</html>
