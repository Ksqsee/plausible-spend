<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gruppenwerk Analytics</title>
<link rel="icon" type="image/svg+xml" href="/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --bg: #f9fafb; --side: #f4f5f7; --card: #ffffff;
  --card-shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
  --line: #e5e7eb; --line-soft: #f3f4f6;
  --text: #111827; --text-2: #4b5563; --text-3: #6b7280;
  --sel: #f3f4f6; --nav-on: #ffffff; --nav-on-shadow: 0 1px 2px rgba(0,0,0,.06), 0 0 0 1px rgba(0,0,0,.04);
  --accent: #6366f1; --brand: #016b63;
  --tab-on: #111827; --up: #10b981; --down: #ef4444; --live: #10b981;
  --bar-sources: #eff6ff; --bar-pages: #fff7ed; --bar-locations: #eef2ff; --bar-devices: #ecfdf5;
  --bar-goals: #fef2f2; --bar-search: #f0fdfa; --bar-sites: #f0fdf9;
  --tip-bg: #111827; --tip-text: #f9fafb; --tip-muted: #9ca3af;
  --hover: rgba(17,24,39,.045); --chip: #eef2ff;
  --sk: #eef0f3; --sk-hi: #f7f8fa;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --bg: #0f0f12; --side: #131317; --card: #1c1c21; --card-shadow: none; --line: #2e2e35; --line-soft: #26262c;
    --text: #f4f4f5; --text-2: #c4c4cc; --text-3: #9b9ba6; --sel: #27272d; --nav-on: #23232a; --nav-on-shadow: 0 0 0 1px #2e2e35;
    --accent: #818cf8; --brand: #19a394; --tab-on: #f4f4f5; --up: #34d399; --down: #f87171; --live: #34d399;
    --bar-sources: rgba(59,130,246,.14); --bar-pages: rgba(249,115,22,.11); --bar-locations: rgba(99,102,241,.16); --bar-devices: rgba(16,185,129,.12);
    --bar-goals: rgba(239,68,68,.11); --bar-search: rgba(20,184,166,.12); --bar-sites: rgba(25,163,148,.14);
    --tip-bg: #0a0a0c; --tip-text: #f4f4f5; --tip-muted: #a1a1aa; --hover: rgba(255,255,255,.05); --chip: rgba(129,140,248,.18);
    --sk: #24242a; --sk-hi: #2c2c33;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0f0f12; --side: #131317; --card: #1c1c21; --card-shadow: none; --line: #2e2e35; --line-soft: #26262c;
  --text: #f4f4f5; --text-2: #c4c4cc; --text-3: #9b9ba6; --sel: #27272d; --nav-on: #23232a; --nav-on-shadow: 0 0 0 1px #2e2e35;
  --accent: #818cf8; --brand: #19a394; --tab-on: #f4f4f5; --up: #34d399; --down: #f87171; --live: #34d399;
  --bar-sources: rgba(59,130,246,.14); --bar-pages: rgba(249,115,22,.11); --bar-locations: rgba(99,102,241,.16); --bar-devices: rgba(16,185,129,.12);
  --bar-goals: rgba(239,68,68,.11); --bar-search: rgba(20,184,166,.12); --bar-sites: rgba(25,163,148,.14);
  --tip-bg: #0a0a0c; --tip-text: #f4f4f5; --tip-muted: #a1a1aa; --hover: rgba(255,255,255,.05); --chip: rgba(129,140,248,.18);
  --sk: #24242a; --sk-hi: #2c2c33;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 14px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; font-feature-settings: "cv11", "ss01"; }
button, select, input { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

/* ---------- layout ---------- */
.app { display: grid; grid-template-columns: 264px minmax(0, 1fr); min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; overflow-y: auto; background: var(--side); border-right: 1px solid var(--line); padding: 18px 12px 16px; display: flex; flex-direction: column; gap: 4px; scrollbar-width: thin; }
.main { min-width: 0; }
.content { max-width: 1120px; margin: 0 auto; padding: 22px 28px 80px; }

/* ---------- sidebar ---------- */
.sbrand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 16px; text-decoration: none; font-weight: 700; font-size: 15px; letter-spacing: -.01em; }
.sbrand img { width: 28px; height: 28px; border-radius: 7px; }
.sbrand span { display: block; font-size: 12px; font-weight: 500; color: var(--text-3); letter-spacing: 0; }
.nav { position: relative; display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 8px; text-decoration: none; color: var(--text-2); font-weight: 500; cursor: pointer; transition: background .15s, color .15s; border: 0; background: none; width: 100%; text-align: left; }
.nav:hover { background: var(--hover); color: var(--text); }
.nav.on { background: var(--nav-on); color: var(--text); box-shadow: var(--nav-on-shadow); font-weight: 600; }
.nav svg.i { width: 18px; height: 18px; flex-shrink: 0; stroke: currentColor; }
.nav .logo { width: 20px; height: 20px; border-radius: 5px; flex-shrink: 0; }
.nav .lbl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stitle { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-3); padding: 18px 10px 6px; }
.co { display: flex; flex-direction: column; }
.co-head { display: flex; align-items: center; gap: 2px; }
.co-head .nav { flex: 1; }
.tog { flex-shrink: 0; width: 28px; height: 28px; border-radius: 6px; border: 0; background: none; color: var(--text-3); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; transition: background .15s, color .15s; }
.tog:hover { background: var(--hover); color: var(--text); }
.tog svg { width: 14px; height: 14px; transition: transform .25s cubic-bezier(.2,.8,.2,1); }
.co.open .tog svg { transform: rotate(90deg); }
.co-sites { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .3s cubic-bezier(.2,.8,.2,1); }
.co.open .co-sites { grid-template-rows: 1fr; }
.co-sites > div { overflow: hidden; display: flex; flex-direction: column; gap: 1px; padding-left: 10px; margin-left: 20px; border-left: 1px solid var(--line); }
.co-sites .nav { font-size: 13px; padding: 6px 10px; }
.co-sites .nav img, .co-sites .nav .fallback { width: 16px; height: 16px; }
.sfoot { margin-top: auto; padding: 16px 10px 0; font-size: 12px; color: var(--text-3); display: flex; flex-direction: column; gap: 8px; }
.sfoot button { align-self: flex-start; background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; cursor: pointer; font-size: 12px; font-weight: 500; transition: border-color .15s; }
.sfoot button:hover { border-color: var(--text-3); }
.scrim { display: none; }

/* ---------- top bar ---------- */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.ttl { display: flex; align-items: center; gap: 12px; min-width: 0; }
.ttl .logo { width: 36px; height: 36px; border-radius: 9px; flex-shrink: 0; box-shadow: 0 0 0 1px var(--line); background: var(--card); padding: 6px; }
.ttl .logo.big { padding: 0; }
.ttl h1 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -.015em; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ttl .sub { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--text-3); margin-top: 1px; flex-wrap: wrap; }
.ttl .sub a { color: inherit; text-decoration: none; } .ttl .sub a:hover { text-decoration: underline; }
.live { display: inline-flex; align-items: center; gap: 6px; }
.live i { width: 7px; height: 7px; border-radius: 50%; background: var(--live); animation: pulse 2s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(16,185,129,.5) } 70% { box-shadow: 0 0 0 6px rgba(16,185,129,0) } 100% { box-shadow: 0 0 0 0 rgba(16,185,129,0) } }
.burger { display: none; width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); cursor: pointer; align-items: center; justify-content: center; flex-shrink: 0; }
.burger svg { width: 18px; height: 18px; }
.right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.period { position: relative; display: inline-flex; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--card-shadow); transition: border-color .15s; }
.period:hover { border-color: var(--text-3); }
.period svg { width: 16px; height: 16px; stroke: var(--text-2); position: absolute; left: 10px; pointer-events: none; }
.period select { appearance: none; -webkit-appearance: none; border: 0; background: transparent; padding: 7px 30px 7px 34px; cursor: pointer; font-weight: 500; }
.period::after { content: ""; position: absolute; right: 12px; top: 50%; width: 6px; height: 6px; border-right: 1.5px solid var(--text-3); border-bottom: 1.5px solid var(--text-3); transform: translateY(-70%) rotate(45deg); pointer-events: none; }
.custom { display: none; gap: 6px; align-items: center; font-size: 13px; }
.custom.on { display: inline-flex; }
.custom input { border: 1px solid var(--line); border-radius: 6px; background: var(--card); padding: 5px 6px; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; margin: -6px 0 14px; }
.filters:empty { display: none; }
.chip { display: inline-flex; align-items: center; gap: 4px; background: var(--chip); border-radius: 6px; padding: 4px 4px 4px 10px; font-size: 13px; animation: pop .25s cubic-bezier(.2,.8,.2,1); }
.chip .k { color: var(--text-2); }
.chip b { font-weight: 600; max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip button { border: 0; background: transparent; cursor: pointer; color: var(--text-3); width: 22px; height: 22px; border-radius: 4px; font-size: 16px; line-height: 1; }
.chip button:hover { background: var(--hover); color: var(--text); }
@keyframes pop { from { opacity: 0; transform: scale(.92) } to { opacity: 1; transform: none } }

/* ---------- motion ---------- */
.enter > * { animation: rise .45s cubic-bezier(.2,.8,.2,1) both; }
.enter > *:nth-child(2) { animation-delay: .05s } .enter > *:nth-child(3) { animation-delay: .1s }
@keyframes rise { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }
.sk { border-radius: 6px; background: linear-gradient(90deg, var(--sk) 0%, var(--sk-hi) 40%, var(--sk) 80%); background-size: 300% 100%; animation: shimmer 1.4s ease-in-out infinite; }
@keyframes shimmer { from { background-position: 100% 0 } to { background-position: -100% 0 } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-delay: 0s !important; transition-duration: .001ms !important; }
}

/* ---------- cards & stats ---------- */
.card { background: var(--card); border-radius: 10px; box-shadow: var(--card-shadow); }
.mainc { padding: 12px 16px 16px; }
.stats { display: grid; grid-template-columns: repeat(6, 1fr); }
.stat { position: relative; text-align: left; background: transparent; border: 0; border-radius: 7px; padding: 10px 12px; cursor: default; transition: background .2s; }
.stat + .stat::before { content: ""; position: absolute; left: -1px; top: 6px; bottom: 6px; width: 1px; background: var(--line); transition: opacity .2s; }
.stat.pick { cursor: pointer; } .stat.pick:hover { background: var(--hover); }
.stat.sel { background: var(--sel); }
.stat.sel::before, .stat.sel + .stat::before { opacity: 0; }
.stat .k { font-size: 12px; font-weight: 600; letter-spacing: .02em; text-transform: uppercase; color: var(--text-3); white-space: nowrap; }
.stat.sel .k { color: var(--text); }
.stat .v { display: flex; align-items: baseline; gap: 8px; margin-top: 2px; flex-wrap: wrap; }
.stat .n { font-size: 21px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.d { font-size: 12px; color: var(--text-3); font-variant-numeric: tabular-nums; white-space: nowrap; }
.up { color: var(--up); } .down { color: var(--down); }
.chart { position: relative; height: 300px; margin-top: 18px; }
.chart svg { display: block; width: 100%; height: 100%; overflow: visible; }
.chart .line { transition: stroke-dashoffset 1.1s cubic-bezier(.4,.1,.2,1); }
.chart .area { transition: opacity .9s .25s ease; }
.tip { position: absolute; z-index: 5; pointer-events: none; display: none; background: var(--tip-bg); color: var(--tip-text); border-radius: 7px; padding: 10px 12px; min-width: 190px; box-shadow: 0 10px 25px rgba(0,0,0,.25); font-size: 13px; transition: left .08s linear, top .08s linear; }
.tip .t { font-size: 11px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; }
.tip .r { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 6px; }
.tip .r span { display: inline-flex; align-items: center; gap: 8px; }
.tip .r span::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.tip .r b { font-size: 15px; font-variant-numeric: tabular-nums; }
.tip .h { border-top: 1px solid rgba(255,255,255,.14); margin-top: 8px; padding-top: 6px; color: var(--tip-muted); font-size: 12px; }

/* ---------- panels ---------- */
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
.grid > * { min-width: 0; }
.panel { padding: 16px 20px 18px; display: flex; flex-direction: column; min-height: 460px; }
.panel.wide { grid-column: 1 / -1; min-height: 0; }
.ph { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--line); }
.tabs { display: flex; gap: 16px; overflow-x: auto; scrollbar-width: none; }
.tabs button, .tabs .title { position: relative; background: none; border: 0; padding: 4px 0 12px; font-size: 12px; font-weight: 600; letter-spacing: .02em; text-transform: uppercase; color: var(--text-3); cursor: pointer; white-space: nowrap; transition: color .15s; }
.tabs button:hover { color: var(--text-2); }
.tabs button.on, .tabs .title { color: var(--tab-on); cursor: default; }
.tabs button::after, .tabs .title::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: var(--tab-on); transform: scaleX(0); transform-origin: left; transition: transform .25s cubic-bezier(.2,.8,.2,1); }
.tabs button.on::after, .tabs .title::after { transform: scaleX(1); }
.expand { background: none; border: 0; padding: 2px 0 12px; cursor: pointer; color: var(--text-3); transition: color .15s; }
.expand:hover { color: var(--text); }
.expand svg { width: 16px; height: 16px; display: block; }
.cols { display: flex; justify-content: space-between; gap: 12px; margin: 14px 0 6px; font-size: 13px; color: var(--text-3); }
.cols .nums, .row .nums { display: flex; flex-shrink: 0; }
.cols .nums span, .row .nums span { width: 76px; text-align: right; }
.list { display: flex; flex-direction: column; gap: 4px; }
.row { display: flex; align-items: center; gap: 12px; height: 32px; }
.row .track { position: relative; flex: 1; min-width: 0; height: 32px; }
.row .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 5px; width: 0; transition: width .7s cubic-bezier(.2,.8,.2,1); }
.row .lbl { position: relative; display: flex; align-items: center; gap: 8px; height: 100%; padding: 0 8px; min-width: 0; }
.row .lbl span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .lbl.click { cursor: pointer; }
.row .lbl.click:hover span { text-decoration: underline; text-decoration-color: var(--text-3); text-underline-offset: 3px; }
.row .lbl img, .row .lbl .ico, .row .lbl .fallback { width: 16px; height: 16px; flex-shrink: 0; border-radius: 3px; }
.row .lbl .flag { font-size: 15px; line-height: 1; flex-shrink: 0; }
.row .nums span { font-weight: 500; font-variant-numeric: tabular-nums; }
.row .nums span.m { color: var(--text-2); font-weight: 400; }
.empty { flex: 1; display: flex; align-items: center; justify-content: center; text-align: center; color: var(--text-3); padding: 40px 12px; }
.skl { display: flex; flex-direction: column; gap: 8px; margin-top: 18px; }
.skl .sk { height: 28px; }
.fallback { width: 18px; height: 18px; border-radius: 4px; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #fff; background: var(--brand); flex-shrink: 0; }

.kpis { display: grid; grid-template-columns: repeat(4, 1fr); margin-top: 14px; }
.kpi { padding: 4px 16px 4px 0; }
.kpi + .kpi { border-left: 1px solid var(--line); padding-left: 16px; }
.kpi .k { font-size: 12px; font-weight: 600; letter-spacing: .02em; text-transform: uppercase; color: var(--text-3); }
.kpi .n { font-size: 20px; font-weight: 700; margin-top: 2px; font-variant-numeric: tabular-nums; }
.kpi .s { font-size: 12px; color: var(--text-3); margin-top: 1px; }
.tbl { overflow-x: auto; margin-top: 16px; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th { font-size: 13px; font-weight: 400; color: var(--text-3); text-align: right; padding: 0 0 8px 16px; white-space: nowrap; }
th:first-child, td:first-child { text-align: left; padding-left: 0; }
td { text-align: right; padding: 7px 0 7px 16px; border-top: 1px solid var(--line-soft); white-space: nowrap; font-weight: 500; }
td:first-child { font-weight: 400; max-width: 360px; overflow: hidden; text-overflow: ellipsis; }
tbody tr { transition: background .15s; } tbody tr:hover { background: var(--hover); }
td.m { color: var(--text-3); font-weight: 400; }
.note { margin-top: 12px; font-size: 12px; color: var(--text-3); }

/* ---------- overview ---------- */
.totals { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 8px; }
.total { padding: 16px 18px; }
.total .k { font-size: 12px; font-weight: 600; letter-spacing: .02em; text-transform: uppercase; color: var(--text-3); }
.total .n { font-size: 26px; font-weight: 700; letter-spacing: -.02em; margin-top: 4px; font-variant-numeric: tabular-nums; }
.total .d { margin-top: 2px; white-space: normal; }
.cohead { display: flex; align-items: center; gap: 12px; margin: 30px 0 12px; flex-wrap: wrap; }
.cohead img, .cohead .fallback { width: 26px; height: 26px; border-radius: 6px; box-shadow: 0 0 0 1px var(--line); }
.cohead h2 { margin: 0; font-size: 16px; font-weight: 700; letter-spacing: -.01em; }
.cohead .meta { color: var(--text-3); font-size: 13px; }
.cohead a { margin-left: auto; font-size: 13px; font-weight: 600; color: var(--accent); text-decoration: none; display: inline-flex; align-items: center; gap: 4px; padding: 4px 8px; border-radius: 6px; transition: background .15s; }
.cohead a:hover { background: var(--hover); }
.cohead a span { transition: transform .2s; display: inline-block; } .cohead a:hover span { transform: translateX(3px); }
.sites { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.sites > * { min-width: 0; }
.sitecard { display: flex; flex-direction: column; gap: 12px; padding: 16px 18px; text-decoration: none; transition: box-shadow .2s, transform .2s; }
.sitecard:hover { box-shadow: 0 8px 24px rgba(0,0,0,.08); transform: translateY(-2px); }
.sitecard .top2 { display: flex; align-items: center; gap: 10px; min-width: 0; }
.sitecard .top2 img, .sitecard .top2 .fallback { width: 18px; height: 18px; border-radius: 4px; }
.sitecard .top2 .nm { min-width: 0; }
.sitecard .top2 b { display: block; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sitecard .top2 small { display: block; font-size: 12px; color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sitecard .badge { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-3); white-space: nowrap; }
.sitecard .badge i { width: 7px; height: 7px; border-radius: 50%; background: var(--live); }
.sitecard .spark { height: 52px; }
.sitecard .spark svg { width: 100%; height: 100%; display: block; overflow: visible; }
.sitecard .spark .line { transition: stroke-dashoffset 1s cubic-bezier(.4,.1,.2,1); }
.sitecard .big { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.sitecard .big b { font-size: 20px; font-variant-numeric: tabular-nums; }
.sitecard .big span { font-size: 13px; color: var(--text-3); }
.sitecard .meta { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--text-3); border-top: 1px solid var(--line-soft); padding-top: 10px; }
.sitecard .meta b { color: var(--text); font-weight: 600; }

/* ---------- responsive ---------- */
@media (max-width: 1100px) { .sites { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 960px) {
  .app { grid-template-columns: 1fr; }
  .side { position: fixed; z-index: 40; left: 0; top: 0; width: 280px; transform: translateX(-100%); transition: transform .3s cubic-bezier(.2,.8,.2,1); box-shadow: 0 0 40px rgba(0,0,0,.18); }
  .app.menu .side { transform: none; }
  .scrim { display: block; position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.35); opacity: 0; pointer-events: none; transition: opacity .3s; }
  .app.menu .scrim { opacity: 1; pointer-events: auto; }
  .burger { display: inline-flex; }
  .content { padding: 16px 16px 64px; }
  .stats { grid-template-columns: repeat(3, 1fr); row-gap: 6px; }
  .stat:nth-child(4)::before { opacity: 0; }
  .grid { grid-template-columns: 1fr; }
  .panel { min-height: 0; }
  .kpis, .totals { grid-template-columns: repeat(2, 1fr); row-gap: 12px; }
  .kpi:nth-child(3) { border-left: 0; padding-left: 0; }
}
@media (max-width: 560px) {
  .stats { grid-template-columns: repeat(2, 1fr); }
  .stat:nth-child(4)::before { opacity: 1; } .stat:nth-child(odd)::before { opacity: 0; }
  .chart { height: 220px; }
  .cols .nums span.m, .row .nums span.m { display: none; }
  .cols .nums span, .row .nums span { width: 56px; }
  .panel { padding: 14px 14px 16px; }
  .sites { grid-template-columns: minmax(0, 1fr); }
  .ttl h1 { font-size: 18px; }
}

<script>
(function () {
  'use strict'

  // ---------- constants ----------
  var LEAD_HINT = 'Anruf, E-Mail, WhatsApp, Formular'
  var PANELS = {
    sources: { bar: '--bar-sources', tabs: [['source', 'Quellen', 'Quelle'], ['utm_medium', 'Medium', 'UTM-Medium'], ['utm_source', 'UTM-Quelle', 'UTM-Quelle'], ['utm_campaign', 'Kampagnen', 'Kampagne']] },
    pages: { bar: '--bar-pages', tabs: [['page', 'Top-Seiten', 'Seite'], ['entry_page', 'Einstiegsseiten', 'Einstiegsseite'], ['exit_page', 'Ausstiegsseiten', 'Ausstiegsseite']] },
    locations: { bar: '--bar-locations', tabs: [['city', 'Städte', 'Stadt'], ['region', 'Regionen', 'Region'], ['country', 'Länder', 'Land']] },
    devices: { bar: '--bar-devices', tabs: [['browser', 'Browser', 'Browser'], ['os', 'Betriebssysteme', 'Betriebssystem'], ['device', 'Geräte', 'Gerät']] },
    goals: { bar: '--bar-goals', goal: true, tabs: [['event', 'Ziele', 'Ziel'], ['label', 'Button-Texte', 'Button-Text']] },
    sites: { bar: '--bar-sites', tabs: [['site', 'Websites', 'Website']] }
  }
  var FILTER_NAMES = {
    page: 'Seite', source: 'Quelle', referrer: 'Verweis', utm_source: 'UTM-Quelle', utm_medium: 'Medium', utm_campaign: 'Kampagne',
    utm_content: 'UTM-Inhalt', utm_term: 'UTM-Begriff', country: 'Land', region: 'Region', city: 'Stadt', device: 'Gerät',
    browser: 'Browser', os: 'Betriebssystem', event: 'Ziel', label: 'Button-Text', hostname: 'Hostname', site: 'Website'
  }
  var EVENT_NAMES = {
    'Phone click': 'Anruf-Klick', 'Email click': 'E-Mail-Klick', 'WhatsApp click': 'WhatsApp-Klick', 'Form submit': 'Formular gesendet',
    'Button click': 'Button-Klick', 'Outbound link': 'Externer Link', 'File download': 'Datei-Download', 'Maps click': 'Google-Maps-Klick'
  }
  var STATS = [
    ['visitors', 'Besucher', true], ['visits', 'Besuche', true], ['pageviews', 'Seitenaufrufe', true],
    ['bounce_rate', 'Absprungrate', false], ['visit_duration', 'Besuchsdauer', false], ['leads', 'Anfragen', false]
  ]
  var METRIC_LABEL = { visitors: 'Besucher', visits: 'Besuche', pageviews: 'Seitenaufrufe' }
  var SOURCE_DOMAINS = {
    Google: 'google.com', 'Google Ads': 'ads.google.com', Bing: 'bing.com', DuckDuckGo: 'duckduckgo.com', Ecosia: 'ecosia.org', Yahoo: 'yahoo.com',
    Qwant: 'qwant.com', Facebook: 'facebook.com', Instagram: 'instagram.com', LinkedIn: 'linkedin.com', X: 'x.com', YouTube: 'youtube.com',
    TikTok: 'tiktok.com', Pinterest: 'pinterest.com', ChatGPT: 'chatgpt.com', Perplexity: 'perplexity.ai', Claude: 'claude.ai',
    Gemini: 'gemini.google.com', Copilot: 'copilot.microsoft.com', MyHammer: 'my-hammer.de', 'Gelbe Seiten': 'gelbeseiten.de',
    '11880': '11880.com', WhatsApp: 'whatsapp.com'
  }
  var BROWSER_DOMAINS = { Chrome: 'google.com/chrome', Safari: 'apple.com/safari', Firefox: 'firefox.com', Edge: 'microsoft.com/edge', Opera: 'opera.com', 'Samsung Internet': 'samsung.com' }
  var OS_DOMAINS = { Windows: 'microsoft.com', macOS: 'apple.com', iOS: 'apple.com', Android: 'android.com', Linux: 'kernel.org', ChromeOS: 'google.com/chromebook' }
  var ICON_LINK = '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="color:var(--text-3)"><path d="M10 13a5 5 0 0 0 7.07 0l3-3a5 5 0 0 0-7.07-7.07l-1.5 1.5"/><path d="M14 11a5 5 0 0 0-7.07 0l-3 3a5 5 0 0 0 7.07 7.07l1.5-1.5"/></svg>'
  var ICON_EXPAND = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>'
  var ICON_COLLAPSE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>'
  var ICON_CHEVRON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>'
  var REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches

  var nf = new Intl.NumberFormat('de-DE')
  var pct = new Intl.NumberFormat('de-DE', { maximumFractionDigits: 1 })
  var money = new Intl.NumberFormat('de-DE', { style: 'currency', currency: 'EUR' })
  var money0 = new Intl.NumberFormat('de-DE', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 })
  var regionNames = (function () { try { return new Intl.DisplayNames(['de'], { type: 'region' }) } catch (e) { return null } })()

  // ---------- state ----------
  var SITES = [], COMPANIES = [], SITE_BY_DOMAIN = {}
  var state = { view: 'overview', scope: null, site: null, period: '30d', from: null, to: null, filters: [], metric: 'visitors', tabs: {}, totalVisitors: 0 }
  var renderToken = 0
  var timers = []

  // ---------- helpers ----------
  function $(id) { return document.getElementById(id) }
  function el(tag, cls, text) {
    var e = document.createElement(tag)
    if (cls) e.className = cls
    if (text !== undefined && text !== null) e.textContent = String(text)
    return e
  }
  var NS = 'http://www.w3.org/2000/svg'
  function svg(tag, attrs) {
    var e = document.createElementNS(NS, tag)
    Object.keys(attrs || {}).forEach(function (k) { e.setAttribute(k, attrs[k]) })
    return e
  }
  // only used with the constant icon strings above
  function html(str) { var t = document.createElement('template'); t.innerHTML = str; return t.content.firstChild }
  function cssVar(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim() }
  function iso(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0') }
  function berlinToday() {
    var a = new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/Berlin', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date()).split('-').map(Number)
    return new Date(a[0], a[1] - 1, a[2])
  }
  function addDays(d, n) { var x = new Date(d); x.setDate(x.getDate() + n); return x }
  function range() {
    var t = berlinToday()
    switch (state.period) {
      case 'today': return [iso(t), iso(t)]
      case 'yesterday': return [iso(addDays(t, -1)), iso(addDays(t, -1))]
      case '7d': return [iso(addDays(t, -6)), iso(t)]
      case '30d': return [iso(addDays(t, -29)), iso(t)]
      case 'month': return [iso(new Date(t.getFullYear(), t.getMonth(), 1)), iso(t)]
      case 'lastmonth': return [iso(new Date(t.getFullYear(), t.getMonth() - 1, 1)), iso(new Date(t.getFullYear(), t.getMonth(), 0))]
      case '12mo': return [iso(new Date(t.getFullYear() - 1, t.getMonth(), t.getDate() + 1)), iso(t)]
      default: return [state.from || iso(addDays(t, -29)), state.to || iso(t)]
    }
  }
  function scopeParams() { return state.site ? { site: state.site } : { scope: state.scope } }
  function qs(extra) {
    var r = range()
    var p = new URLSearchParams(Object.assign(scopeParams(), { from: r[0], to: r[1] }))
    if (state.filters.length) p.set('filters', JSON.stringify(state.filters))
    Object.keys(extra || {}).forEach(function (k) { p.set(k, extra[k]) })
    return p.toString()
  }
  function api(path, extra) {
    return fetch('/api/' + path + '?' + qs(extra), { headers: { Accept: 'application/json' } }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status)
      return r.json()
    })
  }
  function favicon(domain, cls) {
    var img = el('img', cls)
    img.alt = ''
    img.loading = 'lazy'
    img.referrerPolicy = 'no-referrer'
    img.src = 'https://icons.duckduckgo.com/ip3/' + domain.split('/')[0] + '.ico'
    img.onerror = function () {
      img.replaceWith(el('span', 'fallback' + (cls ? ' ' + cls : ''), (domain.replace(/^www\./, '').charAt(0) || '?').toUpperCase()))
    }
    return img
  }
  function logoDomainFor(domain) {
    var s = SITE_BY_DOMAIN[domain]
    // sites still on a builder subdomain show their company's logo
    return /\.onepage\.me$/.test(domain) && s && s.logo_domain ? s.logo_domain : domain
  }
  function siteLogo(domain, cls) { return favicon(logoDomainFor(domain), cls) }
  function flag(code) {
    if (!code || code.length !== 2) return null
    return el('span', 'flag', String.fromCodePoint.apply(null, code.toUpperCase().split('').map(function (c) { return 127397 + c.charCodeAt(0) })))
  }
  function iconFor(dim, value) {
    if (value === null || value === undefined) return null
    if (dim === 'site') return siteLogo(value)
    if (dim === 'source') {
      if (value === 'Direct / None') return html(ICON_LINK)
      var d = Object.prototype.hasOwnProperty.call(SOURCE_DOMAINS, value) ? SOURCE_DOMAINS[value] : (value.indexOf('.') > 0 ? value : null)
      return d ? favicon(d) : html(ICON_LINK)
    }
    if (dim === 'utm_source' && value.indexOf('.') > 0) return favicon(value)
    if (dim === 'browser' && BROWSER_DOMAINS[value]) return favicon(BROWSER_DOMAINS[value])
    if (dim === 'os' && OS_DOMAINS[value]) return favicon(OS_DOMAINS[value])
    if (dim === 'country') return flag(value)
    return null
  }
  function fmtDuration(s) { s = Math.round(s || 0); if (s < 60) return s + 's'; return Math.floor(s / 60) + 'm ' + (s % 60) + 's' }
  function fmtStat(key, v) {
    if (key === 'bounce_rate') return Math.round(v) + '%'
    if (key === 'visit_duration') return fmtDuration(v)
    return nf.format(Math.round(v || 0))
  }
  function displayName(dim, value) {
    if (value === null || value === undefined || value === '(none)') return '(keine Angabe)'
    if (dim === 'country' && regionNames) { try { return regionNames.of(value) || value } catch (e) { return value } }
    if (dim === 'event') return EVENT_NAMES[value] || value
    if (dim === 'site') return (SITE_BY_DOMAIN[value] && SITE_BY_DOMAIN[value].name) || value
    return value
  }
  function changeEl(cur, prev, invert) {
    var d = el('span', 'd')
    if (!prev) return d
    var change = Math.round(((cur - prev) / prev) * 100)
    var good = invert ? change < 0 : change > 0
    if (change !== 0) d.append(el('span', good ? 'up' : 'down', change > 0 ? '↗ ' : '↘ '))
    d.append(document.createTextNode(Math.abs(change) + '%'))
    return d
  }

  // ---------- motion ----------
  function countUp(node, to, fmt) {
    if (REDUCED || !to) { node.textContent = fmt(to || 0); return }
    var start = performance.now(), dur = 700
    function frame(now) {
      var t = Math.min(1, (now - start) / dur)
      node.textContent = fmt(to * (1 - Math.pow(1 - t, 3)))
      if (t < 1 && node.isConnected) requestAnimationFrame(frame)
    }
    node.textContent = fmt(0)
    requestAnimationFrame(frame)
  }
  function growBars(container) {
    var fills = container.querySelectorAll('.fill[data-w]')
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        Array.prototype.forEach.call(fills, function (f, i) {
          f.style.transitionDelay = Math.min(i * 35, 350) + 'ms'
          f.style.width = f.dataset.w
        })
      })
    })
  }
  function drawLine(path) {
    if (REDUCED || !path.getTotalLength) return
    var len = path.getTotalLength()
    if (!len) return
    path.style.transition = 'none'
    path.style.strokeDasharray = len
    path.style.strokeDashoffset = len
    path.getBoundingClientRect()
    path.style.transition = ''
    requestAnimationFrame(function () { path.style.strokeDashoffset = 0 })
  }
  function skeletonRows(n) {
    var box = el('div', 'skl')
    for (var i = 0; i < n; i++) { var s = el('div', 'sk'); s.style.width = (95 - i * 9) + '%'; box.append(s) }
    return box
  }

  // ---------- routing ----------
  function readUrl() {
    var p = new URLSearchParams(location.search)
    state.site = p.get('site') && SITE_BY_DOMAIN[p.get('site')] ? p.get('site') : null
    var scope = p.get('scope')
    state.scope = !state.site && scope && (scope === 'all' || COMPANIES.some(function (c) { return 'company:' + c.id === scope })) ? scope : null
    state.view = state.site || state.scope ? 'dash' : 'overview'
    state.period = p.get('period') || '30d'
    state.from = p.get('from')
    state.to = p.get('to')
    try { state.filters = JSON.parse(p.get('filters') || '[]') } catch (e) { state.filters = [] }
  }
  function urlFor(target) {
    var p = new URLSearchParams()
    if (target.site) p.set('site', target.site)
    else if (target.scope) p.set('scope', target.scope)
    var period = state.period
    if (period !== '30d') p.set('period', period)
    if (period === 'custom') { p.set('from', state.from || ''); p.set('to', state.to || '') }
    if (target.filters && target.filters.length) p.set('filters', JSON.stringify(target.filters))
    var s = p.toString()
    return s ? '?' + s : '/'
  }
  function navigate(url) {
    history.pushState(null, '', url)
    readUrl()
    render()
  }
  function saveUrl() { history.replaceState(null, '', urlFor({ site: state.site, scope: state.scope, filters: state.filters })) }

  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('a[data-nav]')
    if (!a || e.metaKey || e.ctrlKey || e.shiftKey || e.button !== 0) return
    e.preventDefault()
    closeMenu()
    // links are rebuilt with the current period when clicked
    var href = a.dataset.site ? urlFor({ site: a.dataset.site }) : a.dataset.scope ? urlFor({ scope: a.dataset.scope }) : a.getAttribute('href') === '/' ? urlFor({}) : a.getAttribute('href')
    navigate(href)
  })
  window.addEventListener('popstate', function () { readUrl(); render() })

  // ---------- sidebar ----------
  var openCompanies = {}
  try { openCompanies = JSON.parse(localStorage.getItem('gw_open') || '{}') } catch (e) {}
  function saveOpen() { try { localStorage.setItem('gw_open', JSON.stringify(openCompanies)) } catch (e) {} }

  function buildSidebar() {
    var box = $('companies')
    box.replaceChildren()
    COMPANIES.forEach(function (c) {
      var wrap = el('div', 'co' + (openCompanies[c.id] ? ' open' : ''))
      wrap.dataset.company = c.id
      var head = el('div', 'co-head')
      var a = el('a', 'nav')
      a.href = '?scope=company:' + c.id
      a.dataset.nav = ''
      a.dataset.scope = 'company:' + c.id
      a.dataset.key = 'scope:company:' + c.id
      a.append(favicon(c.logo_domain, 'logo'), el('span', 'lbl', c.name))
      var tog = el('button', 'tog')
      tog.type = 'button'
      tog.setAttribute('aria-label', 'Websites von ' + c.name + ' ein- oder ausklappen')
      tog.setAttribute('aria-expanded', String(!!openCompanies[c.id]))
      tog.innerHTML = ICON_CHEVRON
      tog.onclick = function () {
        openCompanies[c.id] = !wrap.classList.contains('open')
        wrap.classList.toggle('open', openCompanies[c.id])
        tog.setAttribute('aria-expanded', String(openCompanies[c.id]))
        saveOpen()
      }
      head.append(a, tog)
      var sites = el('div', 'co-sites'), inner = el('div')
      c.sites.forEach(function (s) {
        var sa = el('a', 'nav')
        sa.href = '?site=' + encodeURIComponent(s.domain)
        sa.dataset.nav = ''
        sa.dataset.site = s.domain
        sa.dataset.key = 'site:' + s.domain
        sa.title = s.domain
        sa.append(favicon(logoDomainFor(s.domain)), el('span', 'lbl', s.name))
        inner.append(sa)
      })
      sites.append(inner)
      wrap.append(head, sites)
      box.append(wrap)
    })
  }
  function markSidebar() {
    var key = state.site ? 'site:' + state.site : state.scope ? 'scope:' + state.scope : 'overview'
    Array.prototype.forEach.call(document.querySelectorAll('.side .nav[data-key]'), function (n) { n.classList.toggle('on', n.dataset.key === key) })
    var company = state.site ? (SITE_BY_DOMAIN[state.site] || {}).company : state.scope && state.scope.indexOf('company:') === 0 ? state.scope.slice(8) : null
    if (company && !openCompanies[company]) {
      openCompanies[company] = true
      var w = document.querySelector('.co[data-company="' + company + '"]')

      saveOpen()
    }
  }
  function closeMenu() { $('app').classList.remove('menu') }
  $('burger').onclick = function () { $('app').classList.add('menu') }
  $('scrim').onclick = closeMenu
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeMenu() })

  // ---------- header ----------
  function brandLogo() { var img = el('img', 'logo big'); img.src = '/logo.svg'; img.alt = ''; return img }
  function renderHeader() {
    var logo = $('ttlLogo'), sub = $('sub')
    logo.replaceChildren(); sub.replaceChildren()
    var title, img
    if (state.view === 'overview') {
      title = 'Übersicht'
      img = brandLogo()
      sub.append(document.createTextNode(COMPANIES.length + ' Unternehmen · ' + SITES.length + ' Websites'))
    } else if (state.site) {
      title = SITE_BY_DOMAIN[state.site].name
      img = siteLogo(state.site, 'logo')
      var link = el('a', null, state.site); link.href = 'https://' + state.site; link.target = '_blank'; link.rel = 'noopener'
      sub.append(link)
    } else if (state.scope === 'all') {
      title = 'Alle Unternehmen'
      img = brandLogo()
      sub.append(document.createTextNode(SITES.length + ' Websites zusammengefasst'))
    } else {
      var c = COMPANIES.filter(function (x) { return 'company:' + x.id === state.scope })[0]
      title = c.name
      img = favicon(c.logo_domain, 'logo')
      sub.append(document.createTextNode(c.sites.length === 1 ? '1 Website' : c.sites.length + ' Websites zusammengefasst'))
    }
    logo.append(img)
    $('ttl').textContent = title
    document.title = (state.view === 'overview' ? '' : title + ' · ') + 'Gruppenwerk Analytics'
    if (state.view === 'dash') {
      var live = el('span', 'live'); live.id = 'live'
      live.append(el('i'), el('span', null, '…'))
      sub.append(live)
    }
    $('period').value = state.period
    $('custom').classList.toggle('on', state.period === 'custom')
    var r = range(); $('from').value = r[0]; $('to').value = r[1]
  }

  // ---------- filters ----------
  function addFilter(dim, value) {
    if (dim === 'site') { navigate(urlFor({ site: value })); return }
    state.filters = state.filters.filter(function (f) { return f[0] !== dim })
    state.filters.push([dim, value === null ? '(none)' : value])
    refreshDash()

      return { key: t[1], card: c, n: n, sk: s }
    })
    var groups = el('div')
    view.append(totals, groups)
    COMPANIES.forEach(function (c) {
      var head = el('div', 'cohead')
      head.append(favicon(c.logo_domain), el('h2', null, c.name), el('span', 'meta', c.sites.length === 1 ? '1 Website' : c.sites.length + ' Websites'))
      var link = el('a'); link.href = '?scope=company:' + c.id; link.dataset.nav = ''; link.dataset.scope = 'company:' + c.id
      link.append(document.createTextNode('Gesamtdashboard '), el('span', null, '→'))
      head.append(link)
      var grid = el('div', 'sites')
      c.sites.forEach(function () { var sk = el('div', 'card sitecard'), x = el('div', 'sk'); x.style.height = '150px'; sk.append(x); grid.append(sk) })
      groups.append(head, grid)
      c._grid = grid
    })
    fetch('/api/sites-summary?from=' + r[0] + '&to=' + r[1]).then(function (res) { return res.json() }).then(function (rows) {
      if (token !== renderToken) return
      var by = {}, sum = { visitors: 0, pageviews: 0, leads: 0, spend: 0, previous_visitors: 0 }
      rows.forEach(function (x) {
        by[x.domain] = x
        sum.visitors += x.visitors; sum.pageviews += x.pageviews; sum.leads += x.leads; sum.spend += x.spend; sum.previous_visitors += x.previous_visitors
      })
      tiles.forEach(function (t) {
        t.sk.replaceWith(t.n)
        countUp(t.n, sum[t.key], t.key === 'spend' ? function (x) { return money0.format(x) } : function (x) { return nf.format(Math.round(x)) })
        var d = el('div', 'd')
        if (t.key === 'visitors' && sum.previous_visitors) { d.append(changeEl(sum.visitors, sum.previous_visitors), document.createTextNode(' · ')) }
        d.append(document.createTextNode(PERIOD_TEXT[state.period] + (t.key === 'leads' ? ' · ' + LEAD_HINT : t.key === 'spend' ? ' · Google Ads' : '')))
        t.card.append(d)
      })
      COMPANIES.forEach(function (c) {
        var grid = c._grid
        grid.replaceChildren()
        c.sites.forEach(function (site, i) {
          var s = by[site.domain] || { visitors: 0, previous_visitors: 0, pageviews: 0, leads: 0, spend: 0, live: 0, daily: {} }
          var a = el('a', 'card sitecard')
          a.href = '?site=' + encodeURIComponent(site.domain); a.dataset.nav = ''; a.dataset.site = site.domain
          if (!REDUCED) a.style.animation = 'rise .45s ' + (0.05 * i) + 's cubic-bezier(.2,.8,.2,1) both'
          var top = el('div', 'top2'), nm = el('div', 'nm')
          nm.append(el('b', null, site.name), el('small', null, site.domain))
          top.append(siteLogo(site.domain), nm)
          if (s.live) { var bd = el('span', 'badge'); bd.append(el('i'), document.createTextNode(nf.format(s.live) + ' aktiv')); top.append(bd) }
          var sp = sparkline(s.daily, r[0], r[1]), spark = el('div', 'spark')
          spark.append(sp.root)
          var big = el('div', 'big'), bn = el('b')
          big.append(bn, el('span', null, 'Besucher'))
          if (s.previous_visitors) big.append(changeEl(s.visitors, s.previous_visitors))
          var meta = el('div', 'meta')
          var m = function (label, value) { var x = el('span'); x.append(el('b', null, value), document.createTextNode(' ' + label)); meta.append(x) }
          m('Aufrufe', nf.format(s.pageviews)); m('Anfragen', nf.format(s.leads)); if (s.spend) m('Ads', money0.format(s.spend))
          a.append(top, spark, big, meta)
          grid.append(a)
          countUp(bn, s.visitors, function (x) { return nf.format(Math.round(x)) })
          requestAnimationFrame(function () { drawLine(sp.path) })
        })
      })
    }).catch(function () { groups.replaceChildren(el('div', 'empty', 'Fehler beim Laden')) })
    timers.push(setInterval(function () { if (state.view === 'overview') render() }, 120000))
  }

  // ---------- sync ----------
  function loadSyncInfo() {
    fetch('/api/sync-log').then(function (r) { return r.json() }).then(function (rows) {
      var label = $('synced')
      label.title = ''
      if (!rows.length) { label.textContent = 'Werbe- und Suchdaten noch nicht abgerufen'; return }
      var last = rows[0], errors = rows.filter(function (r) { return r.ts >= last.ts - 120000 && r.error })
      label.textContent = 'Daten abgerufen: ' + new Date(last.ts).toLocaleString('de-DE', { dateStyle: 'short', timeStyle: 'short' }) + (errors.length ? ' (mit Fehlern)' : '')
      if (errors.length) label.title = errors.map(function (e) { return e.site + ' · ' + e.source + ': ' + e.error }).join('\n')
    }).catch(function () {})
  }
  $('syncnow').onclick = function () {
    var b = $('syncnow')
    b.disabled = true
    b.textContent = 'Wird abgerufen…'
    fetch('/api/sync?days=90', { method: 'POST' }).then(function (r) { return r.json() }).then(function () {
      b.textContent = 'Fertig'
      loadSyncInfo()
      render()
    }).catch(function () { b.textContent = 'Fehler' }).finally(function () {
      setTimeout(function () { b.disabled = false; b.textContent = 'Werbe- & Suchdaten abrufen' }, 2500)
    })
  }

  // ---------- controls ----------
  $('period').onchange = function () {
    state.period = this.value
    $('custom').classList.toggle('on', state.period === 'custom')
    if (state.period === 'custom') { state.from = $('from').value; state.to = $('to').value }
    else { var r = range(); $('from').value = r[0]; $('to').value = r[1] }
    saveUrl()
    if (state.view === 'dash') { renderHeader(); refreshDash() } else render()
  }
  $('from').onchange = $('to').onchange = function () {
    if ($('from').value && $('to').value && $('from').value <= $('to').value) {
      state.from = $('from').value; state.to = $('to').value
      saveUrl()
      if (state.view === 'dash') refreshDash(); else render()
    }
  }
  var resizeTimer
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer)
    resizeTimer = setTimeout(function () { if (state.view === 'dash') renderChart(lastSeries, false) }, 150)
  })

  // ---------- init ----------
  fetch('/api/sites').then(function (r) { return r.json() }).then(function (sites) {
    SITES = sites
    var byCompany = {}
    sites.forEach(function (s) {
      SITE_BY_DOMAIN[s.domain] = s
      var id = s.company || 'other'
      if (!byCompany[id]) {
        byCompany[id] = { id: id, name: s.company_name || 'Weitere', logo_domain: s.logo_domain || s.domain, sites: [] }
        COMPANIES.push(byCompany[id])
      }
      byCompany[id].sites.push(s)
    })
    buildSidebar()
    readUrl()
    render()
    loadSyncInfo()
  })
})()
</script>
</body>
</html>
