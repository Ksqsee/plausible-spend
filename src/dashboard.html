:root {

:root { --bar-bad: color-mix(in srgb, var(--down) 22%, transparent); --bar-sources: var(--bar); --bar-pages: var(--bar); --bar-locations: var(--bar); --bar-devices: var(--bar); --bar-goals: var(--bar); --bar-search: var(--bar); --bar-sites: var(--bar); }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--bg); color: var(--text); font: 14px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; font-feature-settings: "cv11", "ss01", "ss03"; letter-spacing: -.006em; }
button, select, input { font: inherit; color: inherit; letter-spacing: inherit; }
a { color: inherit; }
::selection { background: color-mix(in srgb, var(--info) 25%, transparent); }
:focus-visible { outline: 2px solid var(--info); outline-offset: 2px; border-radius: 8px; }
.stitle { font-family: var(--mono); font-weight: 400; text-transform: uppercase; letter-spacing: .08em; }
.stat .k, .kpi .k, .total .k, .sub-h, .trk .grid3 .k, .cols, th { font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-weight: 500; letter-spacing: -.003em; }

/* ---------- layout ---------- */
.app { display: grid; grid-template-columns: 256px minmax(0, 1fr); min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; overflow-y: auto; background: var(--side); backdrop-filter: saturate(180%) blur(24px); -webkit-backdrop-filter: saturate(180%) blur(24px); border-right: 1px solid var(--line-soft); padding: 22px 12px 18px; display: flex; flex-direction: column; gap: 2px; scrollbar-width: none; }
.main { min-width: 0; }
.content { max-width: 1200px; margin: 0 auto; padding: 0 48px 120px; }

/* ---------- sidebar ---------- */
.sbrand { display: flex; align-items: center; gap: 12px; padding: 4px 8px 28px; text-decoration: none; color: var(--text); }
.sbrand .mark { width: 34px; height: 34px; border-radius: 9px; flex-shrink: 0; box-shadow: 0 1px 2px rgba(0,0,0,.18), 0 0 0 .5px rgba(0,0,0,.2); }
.sbrand .wm { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.sbrand svg { width: 108px; height: auto; display: block; }
.sbrand .wm span { font: 500 10px/1 var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--text-3); }
.nav { position: relative; display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 9px; text-decoration: none; color: var(--text-2); font-weight: 500; cursor: pointer; transition: background .2s var(--ease), color .2s var(--ease); }
.nav:hover { background: var(--hover); color: var(--text); }
.nav.on { background: var(--nav-on); color: var(--text); font-weight: 600; }
.nav svg.i { width: 17px; height: 17px; flex-shrink: 0; stroke: currentColor; opacity: .85; }
.nav .logo { width: 20px; height: 20px; border-radius: 6px; flex-shrink: 0; }
.nav .lbl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stitle { font-size: 10.5px; color: var(--text-3); padding: 22px 10px 8px; }
.co { display: flex; flex-direction: column; }
.co-head { display: flex; align-items: center; gap: 2px; }
.co-head .nav { flex: 1; }
.tog { flex-shrink: 0; width: 28px; height: 28px; border-radius: 8px; border: 0; background: none; color: var(--text-3); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; transition: background .2s, color .2s; }
.tog:hover { background: var(--hover); color: var(--text); }
.tog svg { width: 13px; height: 13px; transition: transform .35s var(--ease); }
.co.open .tog svg { transform: rotate(90deg); }
.co-sites { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .4s var(--ease); }
.co.open .co-sites { grid-template-rows: 1fr; }
.co-sites > div { overflow: hidden; display: flex; flex-direction: column; gap: 1px; padding-left: 8px; margin-left: 20px; border-left: 1px solid var(--line); }
.co-sites .nav { font-size: 13px; padding: 5px 10px; }
.co-sites .nav img, .co-sites .nav .fallback { width: 15px; height: 15px; border-radius: 4px; }
.sfoot { margin-top: auto; padding: 18px 10px 0; font-size: 12px; color: var(--text-3); display: flex; flex-direction: column; gap: 10px; }
.sfoot button { align-self: flex-start; background: var(--card); border: 0; box-shadow: var(--card-shadow); border-radius: 999px; padding: 6px 14px; cursor: pointer; font-size: 12px; font-weight: 500; transition: transform .2s var(--ease), box-shadow .2s; }
.sfoot button:hover { box-shadow: var(--card-hover); }
.sfoot button:active { transform: scale(.97); }
.sfoot .me { display: flex; align-items: center; gap: 4px; margin: 6px -10px 0; border-top: 1px solid var(--line-soft); padding-top: 10px; }
.sfoot .me .nav { flex: 1; }
.sfoot #logout { align-self: center; width: 34px; height: 34px; padding: 0; display: inline-flex; align-items: center; justify-content: center; box-shadow: none; background: none; color: var(--text-3); }
.sfoot #logout:hover { background: var(--hover); color: var(--text); box-shadow: none; }
.sfoot #logout svg { width: 17px; height: 17px; }
.role-company .adm, .role-company #navAll { display: none !important; }
.acc { padding: 26px 28px; margin-bottom: 24px; max-width: 760px; }
.acc h2 { margin: 0; font: 600 20px/1.2 var(--display); letter-spacing: -.02em; }
.accsub { margin: 6px 0 0; color: var(--text-3); font-size: 14px; }
.accf { display: flex; flex-direction: column; gap: 12px; margin-top: 18px; max-width: 380px; }
.fld { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 500; color: var(--text-2); }
.fld input { font: inherit; font-size: 15px; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 11px; padding: 10px 12px; }
.fld input:focus { outline: none; border-color: var(--info); box-shadow: 0 0 0 4px color-mix(in srgb, var(--info) 18%, transparent); }
.btn { align-self: flex-start; border: 0; border-radius: 999px; padding: 10px 18px; font-size: 14px; font-weight: 600; background: var(--ink); color: var(--bg); cursor: pointer; }
.btn:disabled { opacity: .5; cursor: default; }
.btn.sm { padding: 7px 14px; font-size: 13px; }
.btn.ghost { background: var(--sel); color: var(--text); }
.msg { margin: 0; font-size: 14px; }
.msg.good { color: color-mix(in srgb, var(--up) 85%, var(--text)); }
.msg.bad { color: var(--down); }
.acclist { display: flex; flex-direction: column; margin-top: 16px; }
.accrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px 16px; align-items: center; padding: 14px 0; border-top: 1px solid var(--line-soft); }
.accrow .who { display: flex; align-items: center; gap: 12px; min-width: 0; }
.accrow .who img, .accrow .who .fallback { width: 26px; height: 26px; border-radius: 7px; }
.accrow .who b { display: block; font-weight: 600; }
.accrow .who small { display: block; color: var(--text-3); font-size: 13px; }
.accrow .acts { display: flex; gap: 8px; }
.accrow .once { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 14px; }
.accrow .once:empty { display: none; }
.accrow .once code { font: 600 15px var(--mono); padding: 4px 10px; border-radius: 8px; background: var(--sel); user-select: all; }
.accrow .once small { width: 100%; color: var(--text-3); }
.scrim { display: none; }

/* ---------- top bar ---------- */
.top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 0 -48px 28px; padding: 28px 48px 18px; background: var(--glass); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); border-bottom: 1px solid transparent; transition: border-color .3s, padding .3s var(--ease); }
.top.stuck { border-bottom-color: var(--line-soft); padding-top: 14px; padding-bottom: 12px; }
.ttl { display: flex; align-items: center; gap: 14px; min-width: 0; }
.ttl .logo { width: 40px; height: 40px; border-radius: 11px; flex-shrink: 0; box-shadow: var(--card-shadow); background: var(--card); padding: 7px; transition: width .3s var(--ease), height .3s var(--ease); }
.ttl .logo.big { padding: 0; box-shadow: none; }
.top.stuck .ttl .logo { width: 32px; height: 32px; }
.ttl h1 { margin: 0; font: 600 28px/1.15 var(--display); letter-spacing: -.028em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; transition: font-size .3s var(--ease); }
.top.stuck .ttl h1 { font-size: 21px; }
.ttl .sub { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--text-3); margin-top: 3px; flex-wrap: wrap; }
.ttl .sub a { color: inherit; text-decoration: none; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.ttl .sub a:hover { color: var(--text); }
.live { display: inline-flex; align-items: center; gap: 7px; }
.live i { width: 6px; height: 6px; border-radius: 50%; background: var(--live); animation: pulse 2.4s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--live) 55%, transparent) } 70% { box-shadow: 0 0 0 7px transparent } 100% { box-shadow: 0 0 0 0 transparent } }
.burger { display: none; width: 38px; height: 38px; border-radius: 11px; border: 0; background: var(--card); box-shadow: var(--card-shadow); cursor: pointer; align-items: center; justify-content: center; flex-shrink: 0; }
.burger svg { width: 18px; height: 18px; }
.right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.pick { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; max-width: 100%; }
.quick { display: inline-flex; align-items: center; gap: 2px; padding: 3px; border-radius: 12px; background: var(--seg); max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.quick button { border: 0; background: none; padding: 7px 13px; border-radius: 9px; font-size: 13px; font-weight: 500; color: var(--text-2); cursor: pointer; white-space: nowrap; transition: background .2s var(--ease), color .2s, box-shadow .2s; }
.quick button:hover { color: var(--text); }
.quick button.on { background: var(--seg-on); color: var(--text); box-shadow: var(--seg-on-shadow); }
.period { position: relative; display: inline-flex; align-items: center; border-radius: 9px; flex-shrink: 0; }
.period.on { background: var(--seg-on); box-shadow: var(--seg-on-shadow); }
.period select { field-sizing: content; appearance: none; -webkit-appearance: none; border: 0; background: transparent; padding: 7px 28px 7px 13px; cursor: pointer; font-weight: 500; font-size: 13px; color: var(--text-2); border-radius: 9px; }
.period.on select { color: var(--text); }
.period::after { content: ""; position: absolute; right: 12px; top: 50%; width: 5px; height: 5px; border-right: 1.5px solid var(--text-3); border-bottom: 1.5px solid var(--text-3); transform: translateY(-70%) rotate(45deg); pointer-events: none; }
.cmp { font-size: 12.5px; color: var(--text-3); padding-right: 4px; white-space: nowrap; }
.custom { display: none; gap: 6px; align-items: center; font-size: 13px; }
.custom.on { display: inline-flex; }
.custom input { border: 0; box-shadow: var(--card-shadow); border-radius: 999px; background: var(--card); padding: 6px 10px; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; margin: -8px 0 16px; }
.filters:empty { display: none; }
.chip { display: inline-flex; align-items: center; gap: 4px; background: var(--card); box-shadow: var(--card-shadow); border-radius: 999px; padding: 4px 4px 4px 12px; font-size: 13px; animation: pop .35s var(--ease); }
.chip .k { color: var(--text-3); }
.chip b { font-weight: 600; max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip button { border: 0; background: transparent; cursor: pointer; color: var(--text-3); width: 22px; height: 22px; border-radius: 50%; font-size: 15px; line-height: 1; }
.chip button:hover { background: var(--hover); color: var(--text); }
@keyframes pop { from { opacity: 0; transform: scale(.9) } to { opacity: 1; transform: none } }

/* ---------- motion ---------- */
.enter > * { animation: rise .6s var(--ease) both; }
.enter > *:nth-child(2) { animation-delay: .06s } .enter > *:nth-child(3) { animation-delay: .12s } .enter > *:nth-child(4) { animation-delay: .18s }
@keyframes rise { from { opacity: 0; transform: translateY(10px); filter: blur(3px) } to { opacity: 1; transform: none; filter: none } }
.grid > .card { animation: rise .6s var(--ease) both; }
.sk { border-radius: 8px; background: linear-gradient(90deg, var(--sk) 0%, var(--sk-hi) 45%, var(--sk) 90%); background-size: 300% 100%; animation: shimmer 1.6s ease-in-out infinite; }
@keyframes shimmer { from { background-position: 100% 0 } to { background-position: -100% 0 } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-delay: 0s !important; transition-duration: .001ms !important; }
}

/* ---------- cards & stats ---------- */
.card { background: var(--card); border-radius: 22px; box-shadow: var(--card-shadow); }
.mainc { padding: 18px 22px 22px; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.stat { position: relative; display: flex; flex-direction: column; align-items: flex-start; text-align: left; background: transparent; border: 0; border-radius: 14px; padding: 12px 14px 13px; cursor: default; transition: background .25s var(--ease); }
.stat.pick { cursor: pointer; } .stat.pick:hover { background: var(--hover); }
.stat.sel { background: var(--sel); }
.stat .k { font-size: 13px; color: var(--text-3); white-space: nowrap; }
.stat.sel .k { color: var(--text); }
.stat .v { display: flex; align-items: baseline; gap: 8px; margin-top: 4px; flex-wrap: wrap; }
.stat .n { font: 600 38px/1.1 var(--display); font-variant-numeric: tabular-nums; letter-spacing: -.03em; }
.d { font-size: 13px; color: var(--text-3); font-variant-numeric: tabular-nums; white-space: nowrap; }
.up { color: var(--up); } .down { color: var(--down); }
.chart { position: relative; height: 320px; margin-top: 22px; }
.chart svg { display: block; width: 100%; height: 100%; overflow: visible; }
.chart .line { transition: stroke-dashoffset 1.4s var(--ease); }
.chart .area { transition: opacity 1s .3s ease; }
.tip { position: absolute; z-index: 5; pointer-events: none; display: none; background: var(--tip-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); color: var(--tip-text); border-radius: 12px; padding: 10px 12px; min-width: 180px; box-shadow: 0 12px 30px rgba(0,0,0,.22); font-size: 13px; }
.tip .t { font: 400 10.5px/1.3 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--tip-muted); }
.tip .r { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 6px; }
.tip .r span { display: inline-flex; align-items: center; gap: 8px; }
.tip .r span::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--tip-text); }
.tip .r b { font: 600 15px var(--display); font-variant-numeric: tabular-nums; }
.tip .h { border-top: 1px solid rgba(255,255,255,.14); margin-top: 8px; padding-top: 6px; color: var(--tip-muted); font-size: 12px; }

/* ---------- panels ---------- */
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 24px; }
.grid > * { min-width: 0; }
.panel { padding: 24px 28px 26px; display: flex; flex-direction: column; min-height: 300px; }
.panel.wide { grid-column: 1 / -1; min-height: 0; }
.panel:has(> .empty) { min-height: 0; }
.ph { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 4px; }
.tabs { display: inline-flex; gap: 2px; overflow-x: auto; scrollbar-width: none; background: var(--seg); border-radius: 10px; padding: 2px; max-width: 100%; }
.tabs:has(.title) { background: none; padding: 0; }
.tabs button { position: relative; background: none; border: 0; padding: 6px 13px; font-size: 13px; font-weight: 500; color: var(--text-2); cursor: pointer; white-space: nowrap; border-radius: 8px; transition: background .25s var(--ease), color .2s, box-shadow .25s; }
.tabs button:hover { color: var(--text); }
.tabs button.on { background: var(--seg-on); color: var(--text); box-shadow: var(--seg-on-shadow); cursor: default; }
.tabs .title { font: 600 17px/1.3 var(--display); letter-spacing: -.015em; color: var(--text); padding: 4px 0; white-space: nowrap; }
.expand { background: none; border: 0; padding: 6px; border-radius: 8px; cursor: pointer; color: var(--text-3); transition: color .15s, background .15s; }
.expand:hover { color: var(--text); background: var(--hover); }
.expand svg { width: 15px; height: 15px; display: block; }
.cols { display: flex; justify-content: space-between; gap: 12px; margin: 22px 0 8px; padding: 0 10px; font-size: 12px; color: var(--text-3); }
.cols .nums, .row .nums { display: flex; flex-shrink: 0; }
.cols .nums span, .row .nums span { width: 76px; text-align: right; }
.list { display: flex; flex-direction: column; gap: 4px; }
.row { display: flex; align-items: center; gap: 12px; height: 36px; }
.row .track { position: relative; flex: 1; min-width: 0; height: 36px; }
.row .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 8px; width: 0; transition: width .9s var(--ease); }
.row .lbl { position: relative; display: flex; align-items: center; gap: 10px; height: 100%; padding: 0 10px; min-width: 0; }
.row .lbl span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .lbl.click { cursor: pointer; }
.row .lbl.click:hover span { text-decoration: underline; text-decoration-color: var(--text-3); text-underline-offset: 3px; }
.row .lbl img, .row .lbl .ico, .row .lbl .fallback { width: 18px; height: 18px; flex-shrink: 0; border-radius: 4px; }
.row .lbl img.flag, img.flag { width: 20px; height: 15px; border-radius: 3px; object-fit: cover; flex-shrink: 0; box-shadow: 0 0 0 1px var(--line-soft); }
.row .lbl img.ico { border-radius: 0; object-fit: contain; }
.row .lbl .ico.dev { color: var(--text-2); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) img.mono { filter: invert(1); } }
:root[data-theme="dark"] img.mono { filter: invert(1); }
.row .nums span { font-weight: 500; font-variant-numeric: tabular-nums; }
.row .nums span.m { color: var(--text-3); font-weight: 400; }
/* (i) explanations */
.stat .k, .kpi .k, .total .k { display: flex; align-items: center; gap: 6px; }
.qi { display: inline-flex; width: 18px; height: 18px; border-radius: 50%; align-items: center; justify-content: center; color: var(--text-3); cursor: help; flex-shrink: 0; transition: color .15s, background .15s; }
.qi svg { width: 15px; height: 15px; }
.qi:hover, .qi[aria-expanded="true"] { color: var(--text); background: var(--sel); }
.pop { position: absolute; z-index: 60; display: none; background: var(--raise); color: var(--text); border-radius: 14px; padding: 14px 16px; box-shadow: 0 0 0 1px var(--line), 0 18px 40px -12px rgba(0,0,0,.28); font-size: 13.5px; line-height: 1.5; animation: pop .18s var(--ease); }
.pop.on { display: block; }
.pop b { display: block; font: 600 15px/1.3 var(--display); letter-spacing: -.01em; margin-bottom: 4px; }
.pop p { margin: 0 0 10px; color: var(--text-2); }
.pop .pr { display: flex; flex-direction: column; gap: 1px; padding-top: 8px; margin-top: 8px; border-top: 1px solid var(--line-soft); }
.pop .pr em { font-style: normal; font-size: 12px; font-weight: 600; color: var(--text-3); }
/* one sentence that says what a panel shows */
.lede { margin: 10px 0 0; font: 500 15px/1.45 var(--display); letter-spacing: -.008em; color: var(--text); max-width: 72ch; }
/* Gut / Okay / Schwach */
.rate { display: inline-flex; align-items: center; gap: 5px; margin-top: 6px; font-size: 12px; font-weight: 600; }
.rate::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.rate.good { color: color-mix(in srgb, var(--up) 85%, var(--text)); }
.rate.ok { color: color-mix(in srgb, var(--warn) 70%, var(--text)); }
.rate.weak { color: var(--down); }
.foot { margin-top: 12px; padding: 0 10px; font-size: 13px; color: var(--text-3); }
.empty { flex: 1; display: flex; align-items: center; justify-content: center; text-align: center; color: var(--text-3); padding: 44px 12px; font-size: 13px; }
.skl { display: flex; flex-direction: column; gap: 8px; margin-top: 18px; }
.skl .sk { height: 30px; }
.fallback { width: 18px; height: 18px; border-radius: 5px; display: inline-flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; color: var(--card); background: var(--ink); flex-shrink: 0; }

.kpis { display: grid; grid-template-columns: repeat(4, 1fr); margin-top: 20px; gap: 0; padding: 18px 0; border-top: 1px solid var(--line-soft); border-bottom: 1px solid var(--line-soft); }
.kpi { padding: 2px 20px; border-left: 1px solid var(--line-soft); min-width: 0; }
.kpi:first-child { border-left: 0; padding-left: 0; }
.kpi .k { font-size: 13px; color: var(--text-3); }
.kpi .n { font: 600 24px/1.2 var(--display); letter-spacing: -.028em; margin-top: 4px; font-variant-numeric: tabular-nums; }
.kpi .s { font-size: 13px; color: var(--text-3); margin-top: 4px; }
.tbl { overflow-x: auto; margin-top: 22px; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th { font-size: 12px; color: var(--text-3); text-align: right; padding: 0 0 10px 20px; white-space: nowrap; }
th:first-child, td:first-child { text-align: left; padding-left: 0; }
td { text-align: right; padding: 11px 0 11px 20px; border-top: 1px solid var(--line-soft); white-space: nowrap; font-weight: 500; }
td:first-child { font-weight: 400; max-width: 380px; overflow: hidden; text-overflow: ellipsis; }
tbody tr { transition: background .15s; } tbody tr:hover { background: var(--hover); }
td.m { color: var(--text-3); font-weight: 400; }
.note { margin-top: 14px; font-size: 13px; color: var(--text-2); line-height: 1.55; }
/* readable explanation under a panel */
.hint { display: flex; gap: 10px; align-items: flex-start; margin-top: 20px; padding: 12px 14px; border-radius: 12px; background: var(--sel); font-size: 13.5px; line-height: 1.5; color: var(--text-2); }
.hint svg { width: 17px; height: 17px; flex-shrink: 0; margin-top: 1px; color: var(--text-3); }
/* which dates a delayed Google panel shows */
.datapill { align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 12px; padding: 6px 12px 6px 10px; border-radius: 999px; background: var(--sel); font-size: 13px; font-weight: 500; color: var(--text); max-width: 100%; }
.datapill svg { width: 15px; height: 15px; color: var(--text-2); flex-shrink: 0; }
.datapill em { font-style: normal; font-weight: 400; color: var(--text-2); }
.datapill em::before { content: "·"; margin-right: 8px; color: var(--text-3); }
/* Google Ads */
.verdict { display: flex; align-items: flex-start; gap: 12px; margin-top: 20px; padding: 16px 18px; border-radius: 14px; font: 500 15.5px/1.45 var(--display); letter-spacing: -.01em; background: var(--sel); color: var(--text); }
.verdict .vnote { display: block; margin-top: 4px; font: 400 13.5px/1.4 Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: 0; color: var(--text-3); }
.verdict .vdot { width: 10px; height: 10px; border-radius: 50%; margin-top: 6px; flex-shrink: 0; background: var(--text-3); }
.verdict.good { background: color-mix(in srgb, var(--up) 10%, transparent); } .verdict.good .vdot { background: var(--up); box-shadow: 0 0 0 4px color-mix(in srgb, var(--up) 20%, transparent); }
.verdict.bad { background: color-mix(in srgb, var(--down) 9%, transparent); } .verdict.bad .vdot { background: var(--down); box-shadow: 0 0 0 4px color-mix(in srgb, var(--down) 20%, transparent); }
.camps { display: flex; flex-direction: column; gap: 10px; }
.camp { padding: 16px 18px; border-radius: 14px; box-shadow: inset 0 0 0 1px var(--line-soft); display: flex; flex-direction: column; gap: 14px; }
.camp .ch { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.camp .ch > b { font: 600 15px/1.35 var(--display); letter-spacing: -.01em; min-width: 0; overflow-wrap: anywhere; }
.camp .cn { display: flex; gap: 28px; }
.s2 { display: flex; flex-direction: column; align-items: flex-end; }
.s2 b { font: 600 16px/1.2 var(--display); font-variant-numeric: tabular-nums; letter-spacing: -.015em; }
.s2 span { font-size: 12.5px; color: var(--text-3); }
.vis { display: flex; flex-direction: column; gap: 8px; }
.vis .share { width: 100%; height: 8px; border-radius: 4px; }
.vw { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 13px; color: var(--text-2); }
.vw span { display: inline-flex; align-items: center; gap: 7px; }
.vw span::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--ink); }
.vw span.w::before { background: var(--warn); } .vw span.r::before { background: color-mix(in srgb, var(--down) 60%, transparent); }
.chipv { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 500; padding: 3px 10px; border-radius: 999px; white-space: nowrap; background: var(--sel); color: var(--text-2); }
.chipv::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .7; }
.chipv.good { background: color-mix(in srgb, var(--up) 13%, transparent); color: color-mix(in srgb, var(--up) 80%, var(--text)); }
.chipv.bad { background: color-mix(in srgb, var(--down) 12%, transparent); color: var(--down); }
.chipv.warn { background: color-mix(in srgb, var(--warn) 18%, transparent); color: color-mix(in srgb, var(--warn) 60%, var(--text)); }
.two { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.two .a { display: flex; align-items: center; gap: 8px; font-weight: 500; color: var(--text); min-width: 0; }
.two .a span { overflow: hidden; text-overflow: ellipsis; }
.two .a img, .two .a .fallback { width: 15px; height: 15px; border-radius: 4px; flex-shrink: 0; }
.two .b { font-size: 12.5px; color: var(--text-3); font-weight: 400; }
.tbl.kwt td { padding-top: 12px; padding-bottom: 12px; }
.tbl.kwt td:first-child { max-width: 340px; }
.tbl.kwt th:nth-child(2), .tbl.kwt td:nth-child(2) { text-align: left; }
.mlist { display: none; }
@media (max-width: 560px) {
  .tbl.kwt { display: none; }
  .mlist { display: flex; flex-direction: column; margin-top: 14px; }
  .mrow { padding: 14px 0; border-top: 1px solid var(--line-soft); display: flex; flex-direction: column; gap: 10px; }
  .mrow:first-child { border-top: 0; }
  .mrow .mt { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .mrow .mt .two { flex: 1; }
  .mrow .mn { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px 10px; }
  .mrow .mn span { display: flex; flex-direction: column; }
  .mrow .mn em { font-style: normal; font-size: 12px; color: var(--text-3); }
  .mrow .mn b { font-weight: 600; font-variant-numeric: tabular-nums; }
}
.qs { display: inline-flex; width: 26px; height: 22px; border-radius: 7px; align-items: center; justify-content: center; font-size: 12.5px; font-weight: 600; }
.qs.good { background: color-mix(in srgb, var(--up) 15%, transparent); color: color-mix(in srgb, var(--up) 80%, var(--text)); }
.qs.warn { background: color-mix(in srgb, var(--warn) 20%, transparent); color: color-mix(in srgb, var(--warn) 60%, var(--text)); }
.qs.bad { background: color-mix(in srgb, var(--down) 14%, transparent); color: var(--down); }
.more-btn { align-self: flex-start; margin-top: 14px; border: 0; background: var(--sel); color: var(--text); font-size: 13px; font-weight: 500; padding: 8px 14px; border-radius: 999px; cursor: pointer; transition: background .2s; }
.more-btn:hover { background: var(--line); }
.lead-in { margin-top: 18px; font-size: 14px; color: var(--text-2); }
@media (max-width: 560px) {
  .camp .cn { gap: 18px; width: 100%; justify-content: space-between; }
  .s2 { align-items: flex-start; }
  .verdict { font-size: 14.5px; }
}

/* ---------- overview ---------- */
.totals { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 24px; }
.total { padding: 22px 24px; }
.total .k { font-size: 13px; color: var(--text-3); }
.total .n { font: 600 36px/1.1 var(--display); letter-spacing: -.035em; margin-top: 8px; font-variant-numeric: tabular-nums; }
.total .d { margin-top: 6px; white-space: normal; }
.hero { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; padding: 12px 4px 40px; }
.hn .k { font-size: 15px; color: var(--text-3); white-space: nowrap; }
.hn .n { font: 600 64px/1.02 var(--display); letter-spacing: -.045em; margin-top: 10px; font-variant-numeric: tabular-nums; }
.hn .d { margin-top: 10px; font-size: 14px; }
.nudge { margin: 24px 0 0; }
.hero + .nudge { margin-top: 0; }
.nudge-in { display: flex; align-items: center; gap: 16px; padding: 18px 22px; color: var(--text); text-decoration: none; border-radius: inherit; transition: background .2s; }
.nudge-in:hover { background: var(--hover); }
.nudge-in .nd { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; background: var(--warn); box-shadow: 0 0 0 5px color-mix(in srgb, var(--warn) 18%, transparent); }
.nudge-in .nd.high { background: var(--down); box-shadow: 0 0 0 5px color-mix(in srgb, var(--down) 16%, transparent); }
.nudge-in .nt { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.nudge-in .nt b { font: 600 16px/1.35 var(--display); letter-spacing: -.01em; }
.nudge-in .nt span { font-size: 13.5px; color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nudge-in .na { font-size: 14px; font-weight: 500; color: var(--text-2); white-space: nowrap; }
.gtabs { display: flex; gap: 28px; margin-bottom: 6px; }
.gtabs button { border: 0; background: none; padding: 0 0 6px; font: 600 20px/1.2 var(--display); letter-spacing: -.02em; color: var(--text-3); cursor: pointer; border-bottom: 2px solid transparent; transition: color .2s, border-color .2s; }
.gtabs button:hover { color: var(--text-2); }
.gtabs button.on { color: var(--text); border-bottom-color: var(--ink); }
.gsub > .ph:empty, .tabs:empty { display: none; }
.mored { margin-top: 40px; }
.mored > summary { list-style: none; display: flex; justify-content: center; }
.mored > summary::-webkit-details-marker { display: none; }
.mored > summary { cursor: pointer; margin: 0 auto; width: max-content; padding: 10px 20px; border-radius: 999px; background: var(--card); box-shadow: var(--card-shadow); font-size: 14px; font-weight: 500; color: var(--text-2); transition: box-shadow .2s, color .2s; }
.mored > summary:hover { box-shadow: var(--card-hover); color: var(--text); }
.mored > summary::after { content: "↓"; margin-left: 8px; }
.mored[open] > summary::after { content: "↑"; }
.sitecard .lp { margin-left: auto; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; white-space: nowrap; color: color-mix(in srgb, var(--up) 85%, var(--text)); background: color-mix(in srgb, var(--up) 13%, transparent); }
/* the (i) stays out of the way until you look at a number */
.stat .qi, .kpi .qi, .hn .qi, .total .qi { opacity: 0; transition: opacity .2s; }
.stat:hover .qi, .kpi:hover .qi, .hn:hover .qi, .total:hover .qi, .qi:focus-visible, .qi[aria-expanded="true"] { opacity: 1; }
@media (hover: none) { .stat .qi, .kpi .qi, .hn .qi, .total .qi { opacity: .55; } }
@media (max-width: 960px) { .hero { grid-template-columns: 1fr 1fr; } .hn .n { font-size: 48px; } }
@media (max-width: 560px) { .hero { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; padding: 4px 0 24px; } .hn .k { font-size: 12.5px; } .hn .n { font-size: 30px; letter-spacing: -.035em; } .hn .d { font-size: 12px; } .nudge-in .na { display: none; } .gtabs { gap: 18px; overflow-x: auto; } .gtabs button { font-size: 17px; white-space: nowrap; } }
.cohead { display: flex; align-items: center; gap: 12px; margin: 56px 0 18px; flex-wrap: wrap; }
.cohead img, .cohead .fallback { width: 28px; height: 28px; border-radius: 8px; box-shadow: var(--card-shadow); }
.cohead h2 { margin: 0; font: 600 20px/1.2 var(--display); letter-spacing: -.02em; }
.cohead .meta { color: var(--text-3); font-size: 13px; }
.cohead a { margin-left: auto; font-size: 14px; font-weight: 500; color: var(--text-3); text-decoration: none; display: inline-flex; align-items: center; gap: 6px; transition: color .2s; }
.cohead a:hover { color: var(--text); }
.sitecard.quiet { box-shadow: none; background: transparent; outline: 1px dashed var(--line); outline-offset: -1px; }
.sitecard.quiet .big b { color: var(--text-3); }
.cohead a span { transition: transform .3s var(--ease); display: inline-block; } .cohead a:hover span { transform: translateX(3px); }
.sites { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
.sites > * { min-width: 0; }
.sitecard { display: flex; flex-direction: column; gap: 16px; padding: 22px 24px; text-decoration: none; transition: box-shadow .35s var(--ease), transform .35s var(--ease); }
.sitecard:hover { box-shadow: var(--card-hover); transform: translateY(-3px); }
.sitecard .top2 { display: flex; align-items: center; gap: 10px; min-width: 0; }
.sitecard .top2 img, .sitecard .top2 .fallback { width: 22px; height: 22px; border-radius: 6px; }
.sitecard .top2 .nm { min-width: 0; }
.sitecard .top2 b { display: block; font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sitecard .top2 small { display: block; font-size: 12.5px; color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sitecard .badge { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-3); white-space: nowrap; }
.sitecard .badge i { width: 6px; height: 6px; border-radius: 50%; background: var(--live); }
.sitecard .spark { height: 56px; }
.sitecard .spark svg { width: 100%; height: 100%; display: block; overflow: visible; }
.sitecard .spark .line { transition: stroke-dashoffset 1.2s var(--ease); }
.sitecard .big { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.sitecard .big b { font: 600 30px/1.1 var(--display); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.sitecard .big span { font-size: 13px; color: var(--text-3); }
.sitecard .meta { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--text-3); border-top: 1px solid var(--line-soft); padding-top: 12px; }
.sitecard .meta b { color: var(--text); font-weight: 600; }

/* ---------- opportunities v2 ---------- */
.ipage { display: flex; flex-direction: column; gap: 24px; margin-top: 16px; }
.isum { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 0; }
.isum-c { padding: 22px 24px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.isum-c + .isum-c { border-left: 1px solid var(--line-soft); }
.isum-c .k { font-size: 13px; color: var(--text-3); font-weight: 500; }
.isum-c .n { font: 600 34px/1.05 var(--display); letter-spacing: -.035em; font-variant-numeric: tabular-nums; }
.isum-c .d { font-size: 12.5px; color: var(--text-3); white-space: normal; }
.isev-bar { display: flex; gap: 3px; height: 6px; margin-top: 4px; max-width: 220px; }
.isev-bar i { border-radius: 3px; background: var(--info); }
.isev-bar i.high { background: var(--down); } .isev-bar i.medium { background: var(--warn); }
.ihd { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.ihd h2, .igh h2 { margin: 0; font: 600 20px/1.2 var(--display); letter-spacing: -.02em; display: flex; align-items: center; gap: 10px; }
.ihd span, .igh > span { font-size: 13.5px; color: var(--text-3); }
.itops { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.itop { background: var(--card); border-radius: 20px; box-shadow: var(--card-shadow); padding: 20px 22px; display: flex; flex-direction: column; gap: 10px; position: relative; overflow: hidden; min-width: 0; }
.itop::before { content: ""; position: absolute; left: 0; top: 0; right: 0; height: 4px; background: var(--info); }
.itop.high::before { background: var(--down); } .itop.medium::before { background: var(--warn); }
.itop-meta { display: flex; gap: 6px; flex-wrap: wrap; }
.itop-big { font: 600 28px/1 var(--display); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.itop-big small { font: 500 13px var(--display); color: var(--text-3); letter-spacing: 0; }
.itop h3 { margin: 0; font: 600 16px/1.35 var(--display); letter-spacing: -.012em; text-wrap: balance; }
.itop p { margin: 0; font-size: 13.5px; line-height: 1.45; color: var(--text-2); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.itop-foot { display: flex; gap: 8px; margin-top: auto; padding-top: 6px; }
.itop.leaving { opacity: .35; pointer-events: none; transition: opacity .25s; }
.ichip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 999px; background: var(--sel); font-size: 12.5px; font-weight: 500; color: var(--text-2); white-space: nowrap; }
.ichip .ico, .igh h2 .ico, .ifilter .seg .ico { width: 15px; height: 15px; flex: none; }
.ichip.eff { font-variant-numeric: tabular-nums; }
.ifilter { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.ifilter .seg button { display: inline-flex; align-items: center; gap: 7px; }
.iquick { border: 1px solid var(--line); background: none; border-radius: 999px; padding: 7px 14px; font: inherit; font-size: 13px; font-weight: 500; color: var(--text-2); cursor: pointer; }
.iquick.on { background: var(--ink); color: var(--card); border-color: var(--ink); }
.igroup { padding: 8px 24px 10px; }
.igh { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 16px 0 10px; }
.irow { border-top: 1px solid var(--line-soft); }
.ihead { width: 100%; display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 16px; align-items: center; padding: 15px 0; border: 0; background: none; text-align: left; font: inherit; color: inherit; cursor: pointer; }
.ihead:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
.idot { width: 10px; height: 10px; border-radius: 50%; background: var(--info); }
.irow.high .idot { background: var(--down); box-shadow: 0 0 0 4px color-mix(in srgb, var(--down) 16%, transparent); }
.irow.medium .idot { background: var(--warn); }
.irow.closed .idot { background: var(--text-3); box-shadow: none; }
.irow.closed .ititle { text-decoration: line-through; text-decoration-color: var(--text-3); color: var(--text-2); }
.imain { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.ititle { font: 600 15px/1.35 var(--display); letter-spacing: -.01em; }
.isub { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-size: 12.5px; color: var(--text-3); }
.isev { font-weight: 600; color: var(--info); }
.irow.high .isev { color: var(--down); } .irow.medium .isev { color: color-mix(in srgb, var(--warn) 75%, var(--text)); }
.isites { display: inline-flex; flex-wrap: wrap; gap: 4px 10px; }
.isites span { display: inline-flex; align-items: center; gap: 5px; }
.isites img, .isites .fallback { width: 14px; height: 14px; border-radius: 3px; }
.iright { display: flex; align-items: center; gap: 14px; }
.ival { font: 600 15px var(--display); letter-spacing: -.01em; min-width: 64px; text-align: right; font-variant-numeric: tabular-nums; }
.ichev { width: 8px; height: 8px; border-right: 1.6px solid var(--text-3); border-bottom: 1.6px solid var(--text-3); transform: rotate(45deg); margin: 0 4px 4px 0; transition: transform .25s var(--ease); }
.ihead[aria-expanded="true"] .ichev { transform: rotate(-135deg); margin: 4px 4px 0 0; }
.ibody { padding: 0 0 18px 26px; display: flex; flex-direction: column; gap: 12px; }
.idetail { margin: 0; font-size: 14px; line-height: 1.5; color: var(--text-2); max-width: 75ch; }
.ievi { overflow-x: auto; border-radius: 12px; background: var(--sel); padding: 4px 14px; }
.ievi table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
.ievi th { text-align: right; font-weight: 500; font-size: 11.5px; color: var(--text-3); padding: 8px 0 6px 14px; white-space: nowrap; }
.ievi td { text-align: right; padding: 8px 0 8px 14px; border-top: 1px solid var(--line-soft); white-space: nowrap; }
.ievi th:first-child, .ievi td:first-child { text-align: left; padding-left: 0; white-space: normal; }
.ievi tr:nth-child(2) td { border-top: 0; }
.ievi table:not(:has(th)) tr:first-child td { border-top: 0; }
.ievi td:first-child { display: flex; align-items: center; gap: 8px; }
.ievi td:first-child img, .ievi td:first-child .fallback { width: 15px; height: 15px; border-radius: 3px; flex: none; }
.ievi td small { color: var(--text-3); margin-left: auto; padding-left: 10px; white-space: nowrap; }
.ihow { display: flex; flex-direction: column; gap: 4px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); font-size: 14px; line-height: 1.45; max-width: 80ch; }
.ihow-k { font-size: 11.5px; font-weight: 600; color: var(--text-3); letter-spacing: .02em; }
.inote { margin: 0; font-size: 12px; color: var(--text-3); }
.irow.leaving { opacity: .35; pointer-events: none; transition: opacity .25s; }
.iempty { padding: 28px 24px; color: var(--text-2); font-size: 14.5px; }
.closed-list.igroup > summary { padding: 16px 0; cursor: pointer; font-weight: 600; font-size: 14px; color: var(--text-2); }
@media (max-width: 1000px) { .itops { grid-template-columns: minmax(0, 1fr); } .isum { grid-template-columns: repeat(2, minmax(0, 1fr)); } .isum-c:nth-child(3) { border-left: 0; } .isum-c:nth-child(n+3) { border-top: 1px solid var(--line-soft); } }
@media (max-width: 560px) { .igroup { padding: 4px 16px 8px; } .ihead { grid-template-columns: 10px minmax(0, 1fr); } .iright { grid-column: 2; justify-content: flex-start; } .ival { min-width: 0; text-align: left; } .ibody { padding-left: 0; } .isum-c .n { font-size: 28px; } }

/* ---------- opportunities ---------- */
.badge-n { margin-left: auto; min-width: 19px; height: 19px; padding: 0 6px; border-radius: 10px; background: var(--down); color: #fff; font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }
.badge-n:empty { display: none; }
.warn-card { padding: 16px 20px; margin-bottom: 16px; box-shadow: 0 0 0 1px color-mix(in srgb, var(--warn) 45%, transparent); }
.warn-card .wh { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.warn-card .wh .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--warn); box-shadow: 0 0 0 4px color-mix(in srgb, var(--warn) 22%, transparent); }
.warn-card .wh b { font: 600 15px var(--display); letter-spacing: -.01em; }
.warn-card .wh .more { margin: 0 0 0 auto; }
.warn-card .chips span { display: inline-flex; align-items: center; gap: 6px; }
.warn-card .chips img, .warn-card .chips .fallback { width: 14px; height: 14px; border-radius: 3px; }
.ins-list { display: flex; flex-direction: column; margin-top: 6px; }
.ins { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 4px 18px; padding: 20px 0; border-top: 1px solid var(--line-soft); align-items: start; }
.ins:first-child { border-top: 0; }
.ins .dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 5px; background: var(--info); box-shadow: 0 0 0 4px color-mix(in srgb, var(--info) 18%, transparent); }
.ins.high .dot { background: var(--down); box-shadow: 0 0 0 4px color-mix(in srgb, var(--down) 18%, transparent); }
.ins.medium .dot { background: var(--warn); box-shadow: 0 0 0 4px color-mix(in srgb, var(--warn) 20%, transparent); }
.ins h3 { margin: 2px 0 0; font: 600 15px/1.4 var(--display); letter-spacing: -.01em; }
.ins .meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 4px; font-size: 13px; color: var(--text-3); }
.ins .meta img, .ins .meta .fallback { width: 14px; height: 14px; border-radius: 3px; }
.ins .sev { font-weight: 600; color: var(--info); }
.ins.high .sev { color: var(--down); }
.ins.medium .sev { color: color-mix(in srgb, var(--warn) 75%, var(--text)); }
.ins .sep { opacity: .6; }
.ins-items { display: flex; flex-direction: column; margin-top: 12px; border-radius: 12px; background: var(--sel); padding: 4px 14px; }
.ins-items .it { display: flex; align-items: center; gap: 12px; padding: 8px 0; font-size: 13px; border-top: 1px solid var(--line-soft); }
.ins-items .it:first-child { border-top: 0; }
.ins-items .nm { display: inline-flex; align-items: center; gap: 8px; min-width: 0; flex: 1; }
.ins-items .nm span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ins-items .nm img, .ins-items .nm .fallback { width: 16px; height: 16px; border-radius: 4px; flex-shrink: 0; }
.ins-items .note2 { color: var(--text-3); font-size: 12px; white-space: nowrap; }
.ins-items b { font-weight: 600; white-space: nowrap; min-width: 96px; text-align: right; font-variant-numeric: tabular-nums; }
@media (max-width: 560px) { .ins-items .note2 { display: none; } }
.ins p { margin: 4px 0 0; color: var(--text-2); font-size: 14px; overflow-wrap: anywhere; }
.ins .act { margin-top: 8px; font-size: 14px; color: var(--text); display: flex; gap: 6px; overflow-wrap: anywhere; }
.ins .act { font-weight: 500; }
.ins .act::before { content: "→"; color: var(--text-3); font-weight: 500; }
.ins .val { text-align: right; font: 600 15px var(--display); letter-spacing: -.01em; white-space: nowrap; font-variant-numeric: tabular-nums; }
.ins .val small { display: block; font-weight: 400; color: var(--text-3); font-size: 11px; }
.ins details { margin-top: 6px; font-size: 12px; color: var(--text-2); }
.ins details summary { cursor: pointer; color: var(--text-3); }
.ins details ul { margin: 6px 0 0; padding-left: 18px; columns: 2; column-gap: 24px; }
.ins-acts { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 12px; }
.ib { border: 0; border-radius: 999px; padding: 6px 13px; font-size: 13px; font-weight: 500; cursor: pointer; transition: background .2s, transform .15s var(--ease); }
.ib:active { transform: scale(.97); }
.ib.done { background: var(--sel); color: var(--text); }
.ib.done::before { content: "✓ "; color: var(--up); font-weight: 700; }
.ib.done:hover { background: var(--ink); color: var(--bg); }
.ib.done:hover::before { color: inherit; }
.ib.hide, .ib.reopen { background: var(--sel); color: var(--text-2); }
.ib.hide:hover, .ib.reopen:hover { background: var(--line); color: var(--text); }
.ins-acts .was { font-size: 13px; color: var(--text-3); }
.ins-acts .again { font-size: 12px; font-weight: 600; color: var(--warn); }
.ins.closed h3 { text-decoration: line-through; text-decoration-color: var(--text-3); color: var(--text-2); }
.ins.closed .dot { background: var(--text-3); box-shadow: none; }
.ins.leaving { opacity: .35; pointer-events: none; transition: opacity .25s; }
.progress { display: flex; align-items: center; gap: 12px; margin-top: 14px; font-size: 13px; font-weight: 500; color: var(--text-2); }
.progress .pbar { flex: 1; max-width: 220px; height: 6px; border-radius: 3px; background: var(--line-soft); overflow: hidden; }
.progress .pbar i { display: block; height: 100%; background: var(--up); border-radius: 3px; transition: width .6s var(--ease); }
.closed-list { margin-top: 18px; }
.closed-list summary { cursor: pointer; font-size: 14px; font-weight: 500; color: var(--text-2); padding: 8px 0; }
.more { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; margin-top: 12px; font-size: 13px; font-weight: 500; color: var(--text); text-decoration: none; padding: 7px 14px; border-radius: 999px; background: var(--sel); transition: background .2s; }
.more:hover { background: var(--line); }
.seg { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 24px; }
.seg button { border: 0; box-shadow: var(--card-shadow); background: var(--card); border-radius: 999px; padding: 6px 14px; font-size: 13px; font-weight: 500; cursor: pointer; color: var(--text-2); transition: all .15s; display: inline-flex; gap: 6px; align-items: center; }
.seg button:hover { box-shadow: var(--card-hover); color: var(--text); }
.seg button.on { background: var(--ink); box-shadow: none; color: var(--bg); }
.seg button img, .seg button .fallback { width: 14px; height: 14px; border-radius: 3px; }
.seg button span.c { font-size: 11px; opacity: .7; }

/* ---------- funnel ---------- */
.funnel { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
/* page x-ray */
.xr-pages { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
.xr-pages button { border: 1px solid var(--line); background: none; border-radius: 999px; padding: 5px 11px; font: 500 12.5px var(--sans, inherit); color: var(--text-2); cursor: pointer; }
.xr-pages button.on { background: var(--ink); border-color: var(--ink); color: var(--card); }
.xr-body { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 18px; margin-top: 16px; }
.xr-phone { border: 1.5px solid var(--line); border-radius: 14px; padding: 6px; display: flex; flex-direction: column; gap: 4px; align-self: start; }
.xr-phone i { display: block; border-radius: 4px; background: var(--bar); }
.xr-phone i.hot { background: color-mix(in srgb, var(--up) 45%, transparent); }
.xr-rows { display: flex; flex-direction: column; gap: 4px; font-variant-numeric: tabular-nums; min-width: 0; }
.xr-key, .xr-row { display: grid; grid-template-columns: minmax(0, 1fr) 64px minmax(90px, 30%); gap: 12px; align-items: center; }
.xr-key { font-size: 11.5px; color: var(--text-3); padding: 0 10px 4px; letter-spacing: .02em; }
.xr-key span:not(:first-child), .xr-row span:not(:first-child) { text-align: right; }
.xr-row { position: relative; padding: 8px 10px; border-radius: 9px; font-size: 13.5px; }
.xr-row::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: var(--w); background: var(--bar); border-radius: 9px; transition: width .8s var(--ease); }
.xr-row > * { position: relative; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.xr-row b { font-weight: 600; }
.xr-row .c { color: var(--up); font-size: 12.5px; }
.xr-row .c.none { color: var(--text-3); }
/* weekday grid */
.wk { display: grid; grid-template-columns: 26px repeat(17, minmax(0, 1fr)); gap: 3px; margin-top: 16px; font-size: 10.5px; color: var(--text-3); font-variant-numeric: tabular-nums; }
.wk .h { text-align: center; }
.wk .d { align-self: center; }
.wk .c { aspect-ratio: 1; border-radius: 4px; background: var(--bar); }
.wk .l1 { background: color-mix(in srgb, var(--accent) 22%, transparent); }
.wk .l2 { background: color-mix(in srgb, var(--accent) 45%, transparent); }
.wk .l3 { background: color-mix(in srgb, var(--accent) 70%, transparent); }
.wk .l4 { background: var(--accent); }
/* path to contact */
.pf { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 16px; }
.pf .col { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.pf .col > span { font-size: 11.5px; color: var(--text-3); padding-bottom: 2px; }
.pf button { display: flex; align-items: center; justify-content: space-between; gap: 6px; border: 0; border-radius: 9px; padding: 8px 9px; background: var(--bar); color: var(--text); font: inherit; font-size: 12.5px; text-align: left; cursor: pointer; min-width: 0; transition: opacity .2s, background .2s; }
.pf button span { display: flex; align-items: center; gap: 6px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pf button span img { flex: none; width: 16px; height: 16px; object-fit: contain; }
.pf button b { font-weight: 600; font-variant-numeric: tabular-nums; }
.pf button.sel { background: color-mix(in srgb, var(--up) 18%, transparent); }
.pf button.dim { opacity: .35; }
/* logbook */
.lb-add { display: grid; grid-template-columns: 150px minmax(140px, 220px) minmax(0, 1fr) auto; gap: 8px; margin-top: 16px; }
.lb-add input, .lb-add select { font: inherit; font-size: 13.5px; padding: 8px 10px; border-radius: 9px; border: 1px solid var(--line); background: var(--card); color: var(--text); min-width: 0; }
.lb-add button { font: inherit; font-size: 13.5px; font-weight: 500; padding: 8px 14px; border-radius: 9px; border: 0; background: var(--ink); color: var(--card); cursor: pointer; }
.lb-list { display: flex; flex-direction: column; margin-top: 12px; }
.lb { display: grid; grid-template-columns: 74px minmax(0, 1fr) auto; gap: 14px; align-items: baseline; padding: 13px 0; border-bottom: 1px solid var(--line-soft); }
.lb:last-child { border-bottom: 0; }
.lb time { font: 500 12.5px var(--mono); color: var(--text-3); }
.lb .t { font-size: 14px; line-height: 1.4; }
.lb .t small { display: block; font-size: 12.5px; color: var(--text-3); margin-top: 2px; }
.lb .eff { text-align: right; font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.lb .eff b { display: block; font: 600 14px var(--display); }
.lb .eff .up { color: var(--up); } .lb .eff .down { color: var(--down); } .lb .eff .wait { color: var(--text-3); }
.lb .del { border: 0; background: none; color: var(--text-3); cursor: pointer; font-size: 12px; padding: 0 0 0 8px; }
.mtab { width: 100%; border-collapse: collapse; margin-top: 14px; font-size: 13.5px; font-variant-numeric: tabular-nums; }
.mtab th { text-align: right; font-weight: 500; font-size: 12px; color: var(--text-3); padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.mtab td { text-align: right; padding: 9px 8px; border-bottom: 1px solid var(--line-soft); white-space: nowrap; }
.mtab th:first-child, .mtab td:first-child { text-align: left; }
.mtab-wrap { overflow-x: auto; }
@media (max-width: 760px) { .lb-add { grid-template-columns: 1fr 1fr; } .lb-add input[type=text] { grid-column: 1 / -1; } .lb { grid-template-columns: minmax(0, 1fr) auto; } .lb time { grid-column: 1 / -1; } }
.fnote { margin: 12px 0 0; font-size: 13px; line-height: 1.45; color: var(--text-3); }
.fblock { display: flex; flex-direction: column; gap: 12px; margin-top: 18px; }
.fblock + .fblock { padding-top: 18px; border-top: 1px solid var(--line-soft); }
.fhead { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.fhead b { font: 600 15px/1.3 var(--display); letter-spacing: -.01em; }
.fhead span { font-size: 13px; color: var(--text-3); font-variant-numeric: tabular-nums; }
.fblock .verdict { margin-top: 0; font-size: 14px; }
.ffun .lbl em.fx { font-style: normal; font-size: 12px; color: var(--down); margin-left: 8px; white-space: nowrap; }
.fstep { display: grid; grid-template-columns: minmax(120px, 220px) minmax(0, 1fr) 150px; gap: 14px; align-items: center; }
.fstep .lbl { font-size: 13px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fstep .lbl small { display: block; font-weight: 400; color: var(--text-3); font-size: 12.5px; }
.fstep .bar { position: relative; height: 32px; border-radius: 9px; background: var(--bar); overflow: hidden; }
.fstep .bar i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; min-width: 4px; border-radius: 9px; background: var(--ink); transition: width 1s var(--ease); }
.fstep:nth-child(2) .bar i { opacity: .82 } .fstep:nth-child(3) .bar i { opacity: .66 } .fstep:nth-child(4) .bar i { opacity: .52 } .fstep:nth-child(5) .bar i { opacity: .42 } .fstep:nth-child(n+6) .bar i { opacity: .34 }
.fstep .num { font-variant-numeric: tabular-nums; font-size: 13px; text-align: right; white-space: nowrap; }
.fstep .num b { font: 600 16px var(--display); letter-spacing: -.02em; }
.fstep .num .drop { display: block; font-size: 12.5px; color: var(--down); }

/* ---------- lead feed ---------- */
.feed { display: flex; flex-direction: column; margin-top: 10px; }
.lead { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line-soft); align-items: start; }
.lead:first-child { border-top: 0; }
.lead .ic { width: 34px; height: 34px; border-radius: 11px; display: flex; align-items: center; justify-content: center; background: var(--sel); }
.lead .ic svg { width: 17px; height: 17px; }
.lead .ic.form { background: color-mix(in srgb, var(--brand) 16%, transparent); color: var(--brand); }
.lead .ic.call { background: color-mix(in srgb, var(--up) 16%, transparent); color: var(--up); }
.lead .ic.mail { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); }
.lead .ic.wa { background: color-mix(in srgb, #25d366 18%, transparent); color: #1da851; }
.lead .ic.appic { background: none; }
.lead .ic.appic img { width: 34px; height: 34px; border-radius: 9px; box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.lead b { font-weight: 600; }
.lead .sub2 { font-size: 13px; color: var(--text-3); margin-top: 2px; display: flex; flex-wrap: wrap; gap: 4px 10px; }
.lead .sub2 svg { width: 13px; height: 13px; vertical-align: -2px; margin-right: 4px; }
.lead .sub2 img, .lead .sub2 .fallback { width: 13px; height: 13px; border-radius: 3px; vertical-align: -2px; margin-right: 4px; }
.lead .ch { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
.lead .ch span { font-size: 12px; background: var(--chip); border-radius: 999px; padding: 2px 9px; }
.lead .ch span em { font-style: normal; color: var(--text-3); }
.lead time { font-size: 13px; color: var(--text-3); white-space: nowrap; }
.kw { font: 500 11.5px var(--mono); background: var(--chip); color: var(--text); border-radius: 999px; padding: 1px 8px; }

/* ---------- tables, flags, small charts ---------- */
.flag2 { display: inline-block; font-size: 11px; font-weight: 500; padding: 1px 8px; border-radius: 999px; margin-left: 6px; vertical-align: 1px; }
.flag2.bad { background: color-mix(in srgb, var(--down) 15%, transparent); color: var(--down); }
.flag2.good { background: color-mix(in srgb, var(--up) 16%, transparent); color: var(--up); }
.flag2.warn { background: color-mix(in srgb, var(--warn) 20%, transparent); color: color-mix(in srgb, var(--warn) 70%, var(--text)); }
.flag2.info { background: color-mix(in srgb, var(--info) 16%, transparent); color: var(--info); }
td.wrap { white-space: normal; min-width: 180px; }
.hours { display: grid; grid-template-columns: repeat(24, minmax(0, 1fr)); gap: 3px; align-items: end; height: 140px; margin-top: 18px; }
.hours div { position: relative; background: var(--ink-soft); border-radius: 5px 5px 2px 2px; height: 0; transition: height .7s cubic-bezier(.2,.8,.2,1); }
.hours div.cv { background: var(--ink); }
.hours div.off { opacity: .45; }
.hlab { display: grid; grid-template-columns: repeat(24, minmax(0, 1fr)); gap: 3px; font: 11px Inter, sans-serif; color: var(--text-3); text-align: center; margin-top: 4px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--text-3); margin-top: 10px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.share { display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: var(--line-soft); width: 110px; }
.share i { display: block; height: 100%; }
.sub-h { font-size: 13px; color: var(--text-3); margin: 28px 0 8px; }
.split { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
.split > * { min-width: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chips span { font-size: 13px; background: var(--sel); border-radius: 999px; padding: 4px 10px; }
.chips span b { font-weight: 600; margin-left: 4px; }
.chips span img { width: 16px; height: 16px; margin-right: 6px; vertical-align: -3px; border-radius: 4px; }
.stars { color: #f59e0b; letter-spacing: 1px; }
.gbp-one { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 14px; }
.gbp-one .nm { display: inline-flex; align-items: center; gap: 10px; min-width: 0; }
.gbp-one .nm img, .gbp-one .nm .fallback { width: 22px; height: 22px; border-radius: 6px; }
.gbp-one .nm b { font: 600 15px var(--display); letter-spacing: -.01em; }
.gbp-one .rv { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-2); }
.gbp-one .rv b { color: var(--text); font-weight: 600; }
.gbp-one .rv .flag2 { margin-left: 4px; }

/* ---------- tracking setup ---------- */
.trk { padding: 20px 22px; display: flex; flex-direction: column; gap: 10px; }
.trk .h { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.trk .h img, .trk .h .fallback { width: 22px; height: 22px; border-radius: 5px; }
.trk .h b { font: 600 16px var(--display); letter-spacing: -.015em; }
.trk .h small { color: var(--text-3); }
.status { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; }
.status i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.status.ok { color: var(--up); background: color-mix(in srgb, var(--up) 12%, transparent); }
.status.off { color: var(--text-3); background: var(--sel); }
.status.wait { color: color-mix(in srgb, var(--warn) 75%, var(--text)); background: color-mix(in srgb, var(--warn) 16%, transparent); }
.code { position: relative; font: 12px/1.6 var(--mono); background: var(--sel); border-radius: 12px; padding: 10px 84px 10px 12px; overflow-x: auto; white-space: pre; color: var(--text); }
.code button { position: absolute; right: 7px; top: 6px; border: 0; box-shadow: var(--card-shadow); background: var(--card); border-radius: 999px; padding: 3px 11px; font: 500 12px Inter, sans-serif; cursor: pointer; }
.trk .grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; font-size: 13px; }
.trk .grid3 > div { min-width: 0; }
.trk .grid3 .k { font-size: 12px; color: var(--text-3); margin-bottom: 6px; }
.trk ol { margin: 0; padding-left: 18px; color: var(--text-2); overflow-wrap: anywhere; }
.brandlogo { height: 22px; max-width: 120px; object-fit: contain; margin-left: 4px; padding: 3px 6px; border-radius: 6px; background: #fff; box-shadow: 0 0 0 1px var(--line); }
@media (max-width: 960px) {
  .split, .trk .grid3 { grid-template-columns: 1fr; }
  .fstep { grid-template-columns: minmax(0, 1fr) auto; }
  .fstep .num .drop { white-space: normal; }
  .ttl { flex: 1; }
  .ttl > div { flex: 1; min-width: 0; }
  .fstep .bar { grid-column: 1 / -1; grid-row: 2; }
}
@media (max-width: 560px) {
  .ins { grid-template-columns: 10px minmax(0, 1fr); }
  .ins .val { grid-column: 2; text-align: left; }
  .ins details ul { columns: 1; }
  .lead { grid-template-columns: 30px minmax(0, 1fr); }
  .lead time { grid-column: 2; }
  .hlab span:nth-child(odd) { visibility: hidden; }
}

/* ---------- responsive ---------- */
@media (max-width: 1100px) { .sites { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 960px) {
  .app { grid-template-columns: 1fr; }
  .side { position: fixed; z-index: 40; left: 0; top: 0; width: 284px; background: var(--card); transform: translateX(-104%); transition: transform .45s var(--ease); box-shadow: 0 0 60px rgba(0,0,0,.25); }
  .app.menu .side { transform: none; }
  .scrim { display: block; position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.3); backdrop-filter: blur(2px); opacity: 0; pointer-events: none; transition: opacity .35s; }
  .app.menu .scrim { opacity: 1; pointer-events: auto; }
  .burger { display: inline-flex; }
  .content { padding: 0 16px 72px; }
  .top { margin: 0 -16px 16px; padding: 14px 16px 12px; }
  .kpi { padding: 10px 14px; }
  .kpi:nth-child(3) { border-left: 0; padding-left: 0; }
  .kpis { row-gap: 8px; }
  .stats { grid-template-columns: repeat(2, 1fr); }
  .grid { grid-template-columns: 1fr; }
  .panel { min-height: 0; }
  .kpis, .totals { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 560px) {
  .stats { grid-template-columns: repeat(2, 1fr); }
  .stat .n { font-size: 30px; }
  .chart { height: 220px; }
  .cols .nums span.m, .row .nums span.m { display: none; }
  .cols .nums span, .row .nums span { width: 56px; }
  .panel { padding: 16px 16px 18px; }
  .card { border-radius: 18px; }
  .sites { grid-template-columns: minmax(0, 1fr); }
  .ttl h1, .top.stuck .ttl h1 { font-size: 20px; }
  .total .n { font-size: 26px; }
  .right { width: 100%; }
  .pick { align-items: stretch; width: 100%; }
  .cmp { white-space: normal; }
}

  // ---------- overview ----------
  var PERIOD_TEXT = { today: 'heute', yesterday: 'gestern', '7d': 'letzte 7 Tage', '30d': 'letzte 30 Tage', month: 'diesen Monat', lastmonth: 'letzten Monat', '12mo': 'letzte 12 Monate', custom: 'im Zeitraum' }
  function sparkline(daily, from, to) {
    var values = []
    for (var d = new Date(from + 'T00:00:00'), end = new Date(to + 'T00:00:00'); d <= end; d = addDays(d, 1)) values.push(daily[iso(d)] || 0)
    if (values.length < 2) values = [values[0] || 0, values[0] || 0]
    var W = 300, H = 52, max = Math.max.apply(null, values.concat([1]))
    var line = smoothPath(values.map(function (v, i) { return [(W * i) / (values.length - 1), H - 4 - ((H - 8) * v) / max] }))
    var accent = cssVar('--ink')
    var root = svg('svg', { viewBox: '0 0 ' + W + ' ' + H, preserveAspectRatio: 'none', 'aria-hidden': 'true' })
    var id = 'sp' + Math.random().toString(36).slice(2)
    var defs = svg('defs'), grad = svg('linearGradient', { id: id, x1: 0, x2: 0, y1: 0, y2: 1 })
    grad.append(svg('stop', { offset: '0%', 'stop-color': accent, 'stop-opacity': 0.2 }), svg('stop', { offset: '100%', 'stop-color': accent, 'stop-opacity': 0 }))
    defs.append(grad); root.append(defs)
    root.append(svg('path', { d: line + ' L' + W + ' ' + H + ' L0 ' + H + ' Z', fill: 'url(#' + id + ')' }))
    var path = svg('path', { d: line, fill: 'none', stroke: accent, 'stroke-width': 2, 'vector-effect': 'non-scaling-stroke', 'stroke-linejoin': 'round', class: 'line' })
    root.append(path)
    return { root: root, path: path }
  }

    return l
  }
  function renderAccount(view) {
    $('pick').style.display = 'none'
    var pw = el('section', 'card acc')
    pw.append(el('h2', null, 'Passwort ändern'))
    var f = el('form', 'accf'), msg = el('p', 'msg')
    f.append(field('Aktuelles Passwort', 'password', 'current', 'current-password'), field('Neues Passwort (mind. 12 Zeichen)', 'password', 'next', 'new-password'), field('Neues Passwort wiederholen', 'password', 'again', 'new-password'))
    var b = el('button', 'btn', 'Passwort speichern'); b.type = 'submit'
    f.append(b, msg)
    f.onsubmit = function (e) {
      e.preventDefault()
      msg.className = 'msg'
      if (f.next.value !== f.again.value) { msg.textContent = 'Die beiden neuen Passwörter sind nicht gleich.'; msg.classList.add('bad'); return }
      b.disabled = true
      postJson('/api/me/password', { current: f.current.value, next: f.next.value }).then(function () {
        msg.textContent = 'Gespeichert. Andere Geräte sind jetzt abgemeldet, dieses gleich auch.'; msg.classList.add('good')
        setTimeout(function () { location.href = '/login' }, 1800)
      }).catch(function (err) { msg.textContent = err.message; msg.classList.add('bad') }).finally(function () { b.disabled = false })
    }
    pw.append(f)
    view.append(pw)
    if (!isAdmin()) return

    var box = el('section', 'card acc')
    box.append(el('h2', null, 'Zugänge der Unternehmen'), el('p', 'accsub', 'Jedes Unternehmen sieht nur seine eigenen Websites. Ein neues Passwort wird nur einmal angezeigt.'))
    var list = el('div', 'acclist')
    box.append(list)
    view.append(box)
    var load = function () {
      fetch('/api/users').then(function (r) { return r.json() }).then(function (rows) {
        list.replaceChildren()
        rows.forEach(function (u) {
          var c = COMPANIES.filter(function (x) { return x.id === u.company })[0]
          var row = el('div', 'accrow'), who = el('div', 'who')
          if (c) who.append(companyLogo(c))
          var nm = el('div'), status = el('small', null, !u.username ? 'Noch kein Zugang' : u.disabled ? 'Gesperrt · Benutzername ' + u.username : 'Benutzername ' + u.username + (u.last_login ? ' · zuletzt angemeldet ' + new Date(u.last_login).toLocaleDateString('de-DE') : ' · noch nie angemeldet'))
          nm.append(el('b', null, u.name), status)
          who.append(nm)
          var acts = el('div', 'acts'), out = el('div', 'once')
          var gen = el('button', 'btn sm', !u.username ? 'Zugang erstellen' : 'Neues Passwort'); gen.type = 'button'
          gen.onclick = function () {
            if (u.username && !u.disabled && !confirm('Neues Passwort für ' + u.name + '? Das alte funktioniert dann nicht mehr.')) return
            gen.disabled = true
            postJson('/api/users', { company: u.company }).then(function (d) {
              out.replaceChildren()
              var code = el('code', null, d.password), copyB = el('button', 'btn sm ghost', 'Kopieren'); copyB.type = 'button'
              copyB.onclick = function () { navigator.clipboard.writeText('Benutzername: ' + d.username + '\nPasswort: ' + d.password).then(function () { copyB.textContent = 'Kopiert' }) }
              out.append(el('span', null, 'Benutzername ' + d.username + ' · Passwort '), code, copyB, el('small', null, 'Nur jetzt sichtbar. Bitte direkt weitergeben.'))
              gen.textContent = 'Neues Passwort'
              status.textContent = 'Benutzername ' + d.username + ' · noch nie angemeldet'
            }).catch(function (err) { out.textContent = err.message }).finally(function () { gen.disabled = false })
          }
          acts.append(gen)
          if (u.username && !u.disabled) {
            var dis = el('button', 'btn sm ghost', 'Sperren'); dis.type = 'button'
            dis.onclick = function () {
              if (!confirm(u.name + ' sperren? Der Zugang wird sofort abgemeldet.')) return
              postJson('/api/users', { company: u.company, action: 'disable' }).then(load)
            }
            acts.append(dis)
          }
          row.append(who, acts, out)
          list.append(row)
        })
      })
    }
    load()
  }

  // ---------- sync ----------
  function loadSyncInfo() {
    fetch('/api/sync-log').then(function (r) { return r.json() }).then(function (rows) {
      var label = $('synced')
      label.title = ''
      if (!rows.length) { label.textContent = 'Werbe- und Suchdaten noch nicht abgerufen'; return }
      var last = rows[0], errors = rows.filter(function (r) { return r.ts >= last.ts - 120000 && r.error })
      label.textContent = 'Daten abgerufen: ' + new Date(last.ts).toLocaleString('de-DE', { dateStyle: 'short', timeStyle: 'short' }) + (errors.length ? ' (mit Fehlern)' : '')
      if (errors.length) label.title = errors.map(function (e) { return e.site + ' · ' + e.source + ': ' + e.error }).join('\n')
    }).catch(function () {})
  }
  $('syncnow').onclick = function () {
    var b = $('syncnow')
    b.disabled = true
    b.textContent = 'Wird abgerufen…'
    fetch('/api/sync?days=90', { method: 'POST' }).then(function (r) { return r.json() }).then(function () {
      b.textContent = 'Fertig'
      loadSyncInfo()
      render()
    }).catch(function () { b.textContent = 'Fehler' }).finally(function () {
      setTimeout(function () { b.disabled = false; b.textContent = 'Werbe- & Suchdaten abrufen' }, 2500)
    })
  }

  // ---------- controls ----------
  $('period').onchange = function () { if (this.value) setPeriod(this.value) }
  Array.prototype.forEach.call($('quick').querySelectorAll('button'), function (b) { b.onclick = function () { if (state.period !== b.dataset.p) setPeriod(b.dataset.p) } })
  $('from').onchange = $('to').onchange = function () {
    if ($('from').value && $('to').value && $('from').value <= $('to').value) {
      state.from = $('from').value; state.to = $('to').value
      saveUrl()
      syncPicker()
      if (state.view === 'dash') refreshDash(); else render()
    }
  }
  var resizeTimer
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer)
    resizeTimer = setTimeout(function () { if (state.view === 'dash') renderChart(lastSeries, false) }, 150)
  })

  var topBar = document.querySelector('.top')
  window.addEventListener('scroll', function () { topBar.classList.toggle('stuck', window.scrollY > 8) }, { passive: true })

  // ---------- init ----------
  var nativeFetch = window.fetch.bind(window)
  window.fetch = function () {
    return nativeFetch.apply(null, arguments).then(function (r) { if (r.status === 401) location.href = '/login'; return r })
  }
  $('logout').onclick = function () { nativeFetch('/logout', { method: 'POST' }).finally(function () { location.href = '/login' }) }
  fetch('/api/me').then(function (r) { return r.json() }).then(function (me) {
    ME = me
    document.documentElement.classList.toggle('role-company', !isAdmin())
    $('meName').textContent = isAdmin() ? 'Konto · Admin' : 'Konto'
    return fetch('/api/sites')
  }).then(function (r) { return r.json() }).then(function (sites) {
    SITES = sites
    var byCompany = {}
    sites.forEach(function (s) {
      SITE_BY_DOMAIN[s.domain] = s
      var id = s.company || 'other'
      if (!byCompany[id]) {
        byCompany[id] = { id: id, name: s.company_name || 'Weitere', logo_domain: s.logo_domain || s.domain, favicon_url: s.company_favicon, logo_url: s.company_logo, sites: [] }
        COMPANIES.push(byCompany[id])
      }
      byCompany[id].sites.push(s)
    })
    buildSidebar()
    readUrl()
    render()
    if (isAdmin()) loadSyncInfo()
    loadInsightCount()
  })
})()
</script>
</body>
</html>
