<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Anmelden · Gruppenwerk Analytics</title>
<link rel="icon" type="image/svg+xml" href="/logo.svg?v=3">
<style>
@font-face { font-family: "Inter"; font-style: normal; font-weight: 400 700; font-display: swap; src: url(/f/inter.woff2) format("woff2"); }
@font-face { font-family: "Inter Tight"; font-style: normal; font-weight: 500 700; font-display: swap; src: url(/f/inter-tight.woff2) format("woff2"); }
@font-face { font-family: "DM Mono"; font-style: normal; font-weight: 400; font-display: swap; src: url(/f/dm-mono-400.woff2) format("woff2"); }
@font-face { font-family: "DM Mono"; font-style: normal; font-weight: 500; font-display: swap; src: url(/f/dm-mono-500.woff2) format("woff2"); }
:root { color-scheme: light; --bg: #f5f5f7; --card: #fff; --text: #1d1d1f; --text-2: #424245; --text-3: #6e6e73; --line: rgba(0,0,0,.12); --ink: #1d1d1f; --down: #d70015; --focus: #0a84ff; }
@media (prefers-color-scheme: dark) { :root { color-scheme: dark; --bg: #000; --card: #111113; --text: #f5f5f7; --text-2: #d1d1d6; --text-3: #a1a1a6; --line: rgba(255,255,255,.16); --ink: #f5f5f7; --down: #ff6369; } }
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--bg); color: var(--text); font: 15px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; display: grid; place-items: center; min-height: 100vh; padding: 24px 16px; }
main { width: 100%; max-width: 360px; }
.mark { width: 56px; height: 56px; border-radius: 14px; display: block; margin: 0 auto 22px; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
h1 { margin: 0; text-align: center; font: 600 28px/1.15 "Inter Tight", Inter, sans-serif; letter-spacing: -.03em; }
p.sub { margin: 6px 0 28px; text-align: center; color: var(--text-3); }
form { display: flex; flex-direction: column; gap: 12px; }
label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 500; color: var(--text-2); }
input { font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; outline: none; transition: border-color .15s, box-shadow .15s; }
input:focus { border-color: var(--focus); box-shadow: 0 0 0 4px color-mix(in srgb, var(--focus) 20%, transparent); }
button { margin-top: 8px; font: 600 15px Inter, sans-serif; color: var(--bg); background: var(--ink); border: 0; border-radius: 12px; padding: 13px; cursor: pointer; }
button:active { transform: scale(.99); }
.err { margin: 0 0 4px; padding: 10px 14px; border-radius: 12px; font-size: 14px; color: var(--down); background: color-mix(in srgb, var(--down) 10%, transparent); }
.err:empty { display: none; }
</style>
</head>
<body>
<main>
  <img class="mark" src="/logo.svg?v=3" alt="">
  <h1>Analytics</h1>
  <p class="sub">Gruppenwerk</p>
  <form method="post" action="/login" autocomplete="on">
    <p class="err" role="alert"><!--ERROR--></p>
    <label>Benutzername<input name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required maxlength="64" value="<!--USERNAME-->" autofocus></label>
    <label>Passwort<input name="password" type="password" autocomplete="current-password" required maxlength="200"></label>
    <button type="submit">Anmelden</button>
  </form>
</main>
</body>
</html>
