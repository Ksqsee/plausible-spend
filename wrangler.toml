name = "gw-analytics"
main = "src/index.js"
compatibility_date = "2026-10-01"
account_id = "25346b53f111266024f71046763f6aee"
workers_dev = true

[[rules]]
type = "Text"
globs = ["**/*.html", "**/*.client.js", "**/*.svg"]
fallthrough = false

[[rules]]
type = "Data"
globs = ["**/*.woff2"]
fallthrough = false

[[d1_databases]]
binding = "DB"
database_name = "gw-analytics"
database_id = "9b9fbe90-d23e-4aff-bb3d-53a8944b7962"
migrations_dir = "migrations"

[triggers]
# Every 6 hours, Windsor sync (Google Ads + Search Console)
crons = ["17 */6 * * *"]

[observability]
enabled = true

# Event intake: at most 120 events per minute per visitor IP and site; more is dropped quietly.
[[ratelimits]]
name = "EVENTS_RATE"
namespace_id = "1001"
simple = { limit = 120, period = 60 }

# second net against floods from many IPs; far above real traffic of these sites
[[ratelimits]]
name = "EVENTS_SITE_RATE"
namespace_id = "1002"
simple = { limit = 600, period = 60 }
